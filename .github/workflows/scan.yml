name: PantauRiset - pemindaian harian

on:
  schedule:
    # 23:30 UTC = 06:30 WIB (Kalimantan Tengah). Ubah bila perlu.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      lookback:
        description: "Hari ke belakang (kosongkan untuk normal)"
        required: false
        default: ""
      backfill:
        description: "Ringkas N artikel lama (hanya ringkasan, tanpa pemindaian)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pantauriset
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang pypdf (ekstraksi teks penuh)
        run: pip install --quiet pypdf fonttools

      - name: Jalankan pemindaian
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python3 scan.py --backfill "${{ github.event.inputs.backfill }}" 2>&1 | tee data/last_run.log
          elif [ -n "${{ github.event.inputs.lookback }}" ]; then
            python3 scan.py --lookback "${{ github.event.inputs.lookback }}" 2>&1 | tee data/last_run.log
          else
            python3 scan.py 2>&1 | tee data/last_run.log
          fi

      - name: Simpan basis data & situs ke repo
        run: |
          git config user.name "pantauriset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%d)"
          git push

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Unggah situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
