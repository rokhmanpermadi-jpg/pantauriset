eight reached their highest recorded means on Day 6 (2.42 and 2.10 kg, respectively), while °Brix varied across storage days, with relatively higher values observed on Days 5 and 9. At S2, the highest fruit weights occurred early in storage, whereas °Brix increased during the later observation period and reached 17.00°Brix on Day 12. At S3, fruit weight and dimensions were greatest around Day 3 and subsequently declined, while °Brix remained relatively stable. At S4, fruit weight, dimensions, crown weight, and °Brix showed comparatively minor fluctuations during storage. Postharvest shelf life decreased with advancing ripening stage, with S1 fruits showing the longest storability and S2, S3, and S4 fruits exhibiting shorter storage periods under ambient conditions. Earlier-harvested fruits provided greater storage flexibility, whereas more advanced ripening stages were associated with higher initial soluble-solids concentrations but reduced postharvest storability. These findings demonstrate the importance of matching harvest maturity with intended marketing and storage conditions to maintain pineapple quality and minimize postharvest losses. Future research should evaluate larger fruit populations across multiple seasons and locations and incorporate additional quality indicators, including titratable acidity, firmness, weight loss, microbial deterioration, and physiological disorders, together with improved storage technologies for extending the postharvest life of pineapple under tropical conditions.", "oa_url": "https://www.frontiersin.org/journals/horticulture/articles/10.3389/fhort.2026.1941588/pdf", "pdf_url": "https://www.frontiersin.org/journals/horticulture/articles/10.3389/fhort.2026.1941588/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["Smooth Cayenne pineapple", "pineapple", "harvest maturity", "fruit ripening stages", "room temperature storage", "shelf life", "fruit weight", "fruit dimensions"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 30}, {"id": "W7221196593", "doi": "10.11648/j.ajwse.20261204.11", "title": "Evaluation of the Effectiveness of Some Local Plants in Purification of Water Samples from Selected Sources", "date": "2026-10-09", "year": "2026", "journal": "American Journal of Water Science and Engineering", "issn": "25751867", "publisher": "Science Publishing Group", "authors": ["Fanika Suleiman", "Alimi Taofeek", "Mohammed Zakariyawu"], "abstract": "This study evaluates the effectiveness of local plants such as banana peel, watermelon seed, neem leaf and orange peel in treating borehole and well water around Kontagora in Nigeria. Chemical coagulants such as alums present hazard and economic shortcomings in water treatment. They reduce water pH due to their acidic nature, against the pH 6.5 – 8.5 standard recommended for potable water. It is therefore, desirable to replace these chemical coagulants with plant-based ones, which are economic and environmental friendly. This study analysed some physicochemical parameters such as temperature, conductivity, and others, and heavy metals such as Cu, Fe and Pb before and after treatment with plant-based coagulants and alum. From the results, irrespective of water sample type and coagulant, the conductivities measurement before treatment was 28.8 – 30.6 µs/cm, and increased to 34.8 – 48.0 µs/cm for alum. The range was 37.6 – 48.8 µs/cm for plant-based. Turbidity before treatment ranged 0.96 – 6.50 NTU and decreased to the range 0.1 – 0.36 NTU for alum and 0.05 – 0.09 for plant-based. Total Dissolved Solid (TDS) before treatment ranged 4.00 – 7.00 mg/L and reduced to 2.15 – 4.00 mg/L for alum, 1.00 – 4.32 mg/L for plant-based. Total Hardness (TH) before treatment showed 28.00 – 32.00 mg/L range, which reduced to 28.00 – 30.00 mg/L for alum, 19.00 – 28.50 mg/L for plant-based. Most parameters, including alkalinity, acidity, BOD, DO, chloride, sulphate, colour and TSS showed improved performance with plant-based coagulants better than alum with values within the WHO standards for drinking water. Heavy metals analysed recorded varied concentrations: Fe in raw borehole water was 0.85 mg/L and reduced to 0.10 mg/L with alum, and 0.1 – 0.27 mg/L range with plant-based coagulants. Fe concentration in well water increased with all treatments, including alum. Cu, Fe and Pb concentrations in raw well water were 0.30 mg/L, 0.05 mg/L and 0.2 mg/L respectively, where Pb concentration was higher than the WHO limit of 0.01 mg/L set for drinking water. Pb was found below detection limit in borehole water. While alum reduced the levels of Cu to 0.07 mg/L, all the plant-based treatments increased its concentration within 0.1 – 0.87 mg/L range, which were below the 1.0 mg/L, WHO limits for Cu in drinking water. From these findings, in no particular order, the plant-based coagulants of banana peel, watermelon leaf and orange peel displayed greater potency for water treatment than neem leaf. Conclusively, all plant-based coagulants used in this study showcased better alternatives than alum.", "oa_url": "http://article.sciencepg.com/pdf/j.ajwse.20261204.11", "pdf_url": "http://article.sciencepg.com/pdf/j.ajwse.20261204.11", "oa_status": "diamond", "cited_by": 0, "keywords": ["plant-based coagulants", "banana peel", "watermelon seeds", "neem leaves", "orange peel", "alum", "borehole water", "well water"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7221180427", "doi": "10.3390/resources15100128", "title": "Economics of Water Resource Management in Agriculture and Farm Performance in India Under Market Distortions", "date": "2026-10-09", "year": "2026", "journal": "Resources", "issn": "20799276", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Sofina Maharjan", "Atakelty Hailu", "Maria Fay Rola‐Rubzen", "Ram Pandit", "Jeetendra Prakash Aryal"], "abstract": "As agriculture is the largest user of water resources in India, its efficient management is crucial for the food and water security of the country. However, prices of water and energy used in agriculture are distorted due to government interventions. It keeps the price of irrigation water artificially low and does not reflect its scarcity value. Such a situation largely affects the efficiency of water resource management and farm performance. In this context, the study examines the economics of water resource management in agriculture by estimating the degree and sources of technical inefficiency among farmers, evaluating the productivity effects of water-efficient technology adoption, and estimating the shadow price of irrigation water. The study applied a selectivity-bias-corrected directional distance function (DDF) approach to control for selection bias in estimating technical inefficiency and found substantial technical inefficiency in the production system. Adoption of water-efficient technology, here laser land leveling, appeared to significantly improve farm productivity. The study estimated shadow price (SP) of irrigation water using the duality relationship between DDF and the profit function. The estimated SP of irrigation water was low, indicating low incentives among farmers to optimize the use of irrigation water, largely caused by market distortions. The results indicate the possibility of improving water resource management in agriculture by upscaling water-efficient technologies and reducing factor market distortions. A mix of policy measures that combines the choice of realistic water and energy prices for agricultural use, scaling up of water-efficient agricultural technologies, and interlinking economic incentives to the scaling up of water-efficient technologies seem crucial towards sustainable and efficient water resource management in agriculture.", "oa_url": "https://doi.org/10.3390/resources15100128", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["water resources management", "irrigation water pricing", "technical inefficiency", "agricultural productivity", "laser leveling", "market distortions", "water-energy nexus", "directional distance function"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 18}, {"id": "W7220921430", "doi": "10.3390/conservation6040120", "title": "Harnessing Indigenous Knowledge for Climate-Smart Agri-Food Systems: A Review of Adaptation Strategies, Food Security, Ecosystem Services, Governance, and Digital Innovation in Sub-Saharan Africa", "date": "2026-10-08", "year": "2026", "journal": "Conservation", "issn": "26737159", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Adetomiwa Kolapo", "Wale Ayojimi"], "abstract": "Sub-Saharan Africa (SSA) faces escalating climate challenges that threaten agricultural productivity, food security, ecosystem sustainability, and rural livelihoods. Indigenous knowledge (IK), developed through generations of interaction with local environments, offers context-specific and culturally embedded solutions for climate adaptation and resilient agri-food systems. This scoping review synthesizes evidence on the role of indigenous knowledge in advancing climate-smart agriculture (CSA) and resilient agri-food systems across SSA. Guided by the Preferred Reporting Items for Systematic Reviews and Meta-Analyses Extension for Scoping Reviews (PRISMA-ScR), the review analyzed 17 studies published between 2000 and 2026. The findings reveal that indigenous knowledge contributes significantly to climate resilience through traditional weather forecasting, crop diversification, indigenous seed preservation, agroforestry, water harvesting, soil fertility management, and community-based natural resource governance. These practices enhance food security, livelihood resilience, biodiversity conservation, and ecosystem service provision while strengthening adaptive capacity among smallholder farmers. The review further highlights the importance of inclusive governance frameworks, knowledge co-production, and policy support for integrating indigenous knowledge into climate adaptation and agricultural development strategies. Emerging digital technologies and innovation platforms also present opportunities for documenting, preserving, and scaling indigenous agricultural knowledge. However, challenges related to weak policy recognition, inadequate documentation, knowledge erosion, and limited digital infrastructure continue to constrain its effective utilization. The study concludes that integrating indigenous knowledge with scientific innovation is essential for building inclusive, sustainable, and climate-resilient agri-food systems in SSA.", "oa_url": "https://doi.org/10.3390/conservation6040120", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["indigenous knowledge", "climate-smart agriculture", "climate change adaptation", "food security", "ecosystem services", "smallholder farmers", "traditional weather forecasting", "crop diversification"], "topics": ["Adopsi teknologi & pertanian digital", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 44}, {"id": "W7220922963", "doi": "10.1016/j.jwpe.2026.111032", "title": "Physicochemical tailoring of POME through mechanical pretreatment: Assessing nutrient uptake and biomass characteristics in mixotrophic Chlorella sp. cultivation", "date": "2026-10-08", "year": "2026", "journal": "Journal of Water Process Engineering", "issn": "22147144", "publisher": "Elsevier BV", "authors": ["Elaine Elaine", "Candra Wijaya", "Arief Widjaja", "Raymond Lau"], "abstract": "Palm oil mill effluent (POME) is organic, nutrient-rich wastewater which physicochemical properties can severely disrupt terrestrial and aquatic ecosystems when discharged untreated. This study investigates the effect of hydrothermal and ultrasonication pretreatments in enhancing nutrient release from POME for microalgae cultivation as an alternative organic-based medium. Liquid and solid fractions of raw POME were characterized prior to pretreatment. Lyophilized POME sludge comprised 35.86% extractives, while the extractive-free sludge consisted mainly of cellulose (28.3%), hemicellulose (13.8%), and lignin (16.1%) on mass weight basis. POME was pretreated at different range of temperature-time for hydrothermal (140, 180, 200, 220 °C; 60 and 120 min) and intensity-time for probe ultrasonication (50% and 100%; 2 and 10 min). Selected conditions were evaluated for Chlorella sp. cultivation and compared with R and BG-11 synthetic media representing mixotrophic and autotrophic growth. The liquid fraction of raw POME used as cultivation media in this study contained high levels of chemical oxygen demand (COD) (19,690 mg/L), total nitrogen (TN) (323 mg/L), total phosphorus (TP) (346 mg/L), corresponding to a COD:N:P mass ratio of 61:1:1. The highest TN consumption (74.99%) by Chlorella sp. was achieved in sonicated POME, while HT-POME yielded the greatest carbohydrate consumption (83.58%). Meanwhile, TP removal in all POME-based media exceeded 98.89%. Biomass productivity in POME-based media was comparable to R medium, although protein content was lower. Thermal analysis revealed increased structural condensation and thermal stability of residual sludge after pretreatment. Overall, US-pretreated POME supports efficient nutrient consumption, comparable microalgal growth, and offers integrated potential for wastewater treatment and downstream resource valorization.", "oa_url": "https://doi.org/10.1016/j.jwpe.2026.111032", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["mechanical pretreatment", "mixotrophic cultivation", "Chlorella", ork connectivity (82.50%), providing financial support (80.00%), providing agricultural information in Hindi and other regional languages (75.83%), and providing training to improve farmers’ understanding of social media (75.83%) were the most frequently suggested measures. Conclusion: The findings indicate that farmers’ effective utilisation of social media for agricultural information is influenced by educational, technical, infrastructural, economic, language-related, and institutional constraints. Improving rural digital infrastructure, providing practical training, ensuring reliable electricity and network connectivity, providing agricultural information in Hindi and other regional languages, and strengthening linkages with agricultural extension services may help improve the effectiveness of social media as a complementary agricultural extension channel.", "oa_url": "https://doi.org/10.9734/jsrr/2026/v32i104592", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["social media", "agricultural information", "farmers", "digital agricultural extension", "constraints", "smartphone use", "network connectivity", "language barriers"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7220862118", "doi": "10.4067/s0718-58392026000600884", "title": "Tidal inundation type and soil chemical properties determine rice productivity in tropical acid sulfate swamp ecosystems", "date": "2026-10-07", "year": "2026", "journal": "Chilean journal of agricultural research", "issn": "07185820", "publisher": "Instituto de Investigaciones Agropecuarias, INIA", "authors": ["Nukhak Nufita Sari", "Masganti Masganti", "Andin Muhammad Abduh", "Muhammad Rizky Romadhon", "Rachmiwati Yusuf", "Yanti Rina", "Eni Maftu’ah", "Khairil Anwar", "Puspita Harum Maharani", "Anna Hairani", "Muhammad Alwi", "Parlin Holomoan Sinaga"], "abstract": "Ensuring sustainable rice (Oryza sativa L.) production in tidal swamp ecosystems is critical for strengthening food security in Indonesia.Soil chemical properties, tidal inundation type, and planting season strongly influence rice productivity in these systems.This study evaluated soil chemical characteristics and rice productivity across tidal swamp areas in Tanah Bumbu Regency, South Kalimantan, Indonesia, by inundation type and cropping season.Field surveys, soil analyses, and farmer interviews were conducted in five villages.Selimuran and Mudalang were classified as Type B tidal swamps.In contrast, Rantau Panjang, Api-api, and Segumbang were categorized as Type C. Type B soils were acidic, while Type C soils were very acidic.Although both types exhibited low organic C, total N, and exchangeable P, Type B soils had higher P and base cation availability and lower concentrations of exchangeable Al, Fe, sulfate, and pyrite.The pyritic layer was shallower in Type C soils, increasing oxidation risk.Rice productivity was significantly higher in Type B systems (5.43 t ha⁻¹) than in Type C systems (3.76 t ha⁻¹).Seasonal responses differed between tidal types.Yields in Type B fields declined by 0.95 t ha⁻¹ from the dry to the rainy season, whereas yields in Type C fields increased by 0.45 t ha⁻¹.These findings highlight the importance of site-and season-specific nutrient and water management to enhance productivity and sustainability in acid sulfate tidal swamp ecosystems.", "oa_url": "http://www.scielo.cl/pdf/chiljar/v86n6/0718-5839-chiljar-86-06-884.pdf", "pdf_url": "http://www.scielo.cl/pdf/chiljar/v86n6/0718-5839-chiljar-86-06-884.pdf", "oa_status": "diamond", "cited_by": 0, "keywords": ["soil chemical properties", "rice productivity", "acid sulfate soils", "swamps", "tidal flooding", "rice cultivation"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 60}, {"id": "W7220863783", "doi": "10.1016/j.sftr.2026.102215", "title": "Advancing economic sustainability in smallholder agriculture: insights on financial inclusion, asset size, technology, and knowledge-based inputs in the transformation of farm productivity in India", "date": "2026-10-07", "year": "2026", "journal": "Sustainable Futures", "issn": "26661888", "publisher": "Elsevier BV", "authors": ["Sraddha Srivastav", "Giridhari Mohanta", "Vanita Singh", "Ashutosh Dash"], "abstract": "Enhancing agricultural productivity is central to achieving sustainable development goals, particularly in rural economies characterized by smallholder farming. This study examines the role of financial inclusion, human capital, and technology adoption in shaping crop productivity among marginal farmers in India. Drawing on human capital and development perspectives, the research investigates how literacy and awareness interact with access to agricultural credit, farm size, and the adoption of modern technologies to influence productivity outcomes. Primary data were collected from 400 marginal farmers through a structured survey and analyzed using Structural Equation Modeling (SEM). The findings reveal that literacy and awareness significantly enhance crop productivity both directly and indirectly by strengthening the impact of technology adoption and access to credit. The results highlight a complementary relationship between knowledge-based inputs and technological resources in driving sustainable agricultural outcomes. In contrast, farm size shows a limited influence, reflecting structural constraints in smallholder contexts. By demonstrating the dual role of literacy as both an independent and moderating factor, the study contributes to the literature on sustainable agriculture and inclusive development. The findings underscore the need for integrated policy interventions that combine financial inclusion, capacity building, and technology dissemination to promote resilient and equitable agrarian systems. Such interventions can enhance food security, improve rural livelihoods, and support long-term sustainable development in emerging economies.", "oa_url": "https://doi.org/10.1016/j.sftr.2026.102215", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["smallholder farming", "financial inclusion", "agricultural credit", "literacy", "farmer awareness", "technology adoption", "farm size", "crop productivity"], "topics": ["Adopsi teknologi & pertanian digital", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 48}, {"id": "W7221054221", "doi": "10.1016/j.scenv.2026.100341", "title": "Sustainable biodiesel production from beef tallow and lard: A comparative study in Indonesia", "date": "2026-10-07", "year": "2026", "journal": "Sustainable Chemistry for the Environment", "issn": "29498392", "publisher": "Elsevier BV", "authors": ["Haryo Hari Wibowo", "Yuny Erwanto", "Nanung Agus Fitriyanto", "Balasubramani Ravindran", "Mohammad Zainal Abidin", "Merlyn Sujatha Rajakumar"], "abstract": "The utilization of waste animal fats as biodiesel feedstock offers a sustainable alternative to conventional vegetable oils, particularly in regions where palm oil production competes with food resources. This study investigates the production and characterization of biodiesel synthesized from beef tallow and lard through alkali-catalyzed transesterification using methanol and sodium hydroxide. The produced fatty acid methyl esters (FAMEs) were purified through liquid–liquid extraction and subsequently characterized using FTIR and ¹H NMR spectroscopy, gas chromatography, and physicochemical analyses. Biodiesel conversion achieved 97.3% for beef tallow and >99% for lard with good-isolated yields 72% and 82%, respectively. The main fatty acids identified were palmitic, stearic, and oleic acids, while lard biodiesel contained a higher proportion of monounsaturated FAMEs. Key fuel characteristics such as viscosity, cetane number, density, and acid value, complied with ASTM D6751, EN 14214, and Indonesian National Standards, although cloud and pour points were slightly elevated due to saturated fat content. This study establishes that high-quality biodiesel can be efficiently produced from animal fats, offering a sustainable alternative to palm oil in Indonesia's renewable energy sector.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2949839226000301/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2949839226000301/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["biodiesel production", "beef tallow", "lard", "animal fats", "sustainable biofuels", "feedstock comparison", "Indonesia"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7220858502", "doi": "10.12688/f1000research.165606.2", "title": "Políticas públicas productivas: Papel y desafíos en el empoderamiento de las mujeres en la agricultura en Aramango, Amazonas, Perú", "date": "2026-10-07", "year": "2026", "journal": "F1000Research", "issn": "20461402", "publisher": "Faculty of 1000", "authors": ["Patricia Escobedo Ocampo", "Lynn Karin Mendoza Zuta", "Lindon Vela Meléndez", "Juan Diego Dávila Cisneros", "Greyss Amairiny León Mego"], "abstract": "Objective This study analyzes the relationship between productive public policies and women’s empowerment in agricultural activities in the district of Aramango, Amazonas, Peru. The aim was to identify which dimensions of public policies significantly influence the levels of intrinsic, instrumental, and collective agency among women farmers. Methodology The research adopted a quantitative, non-experimental, cross-sectional approach. A survey validated by experts was administered to 40 women belonging to active agricultural associations in El Porvenir. The variables—public policies and empowerment—were measured in five and three dimensions, respectively. Rating scales were used to establish perception levels, and Spearman’s coefficient was employed to analyze correlations between variables. Results The results reveal a positive and statistically significant correlation between productive public policies and women’s empowerment (ρ = 0.318; p < 0.05), with particularly strong effects in the dimensions of knowledge (ρ = 0.458; p = 0.003) and market access (ρ = 0.344; p = 0.030). The dimensions of infrastructure, access to resources, and institutional framework did not show significant correlations. Medium levels of empowerment predominated, although there were advances in autonomy and participation. Conclusions Women’s empowerment in rural agricultural contexts depends on targeted public policies that prioritize technical training and equitable market access. The evidence supports the need to redesign policies using a territorial and intersectional approach to overcome structural barriers and promote the economic, social, and political autonomy of rural women. Accordingly, it is recommended to redesign rural public policies by prioritizing technical training and access to information for women, as a central and more causally effective strategy for their empowerment.", "oa_url": "https://doi.org/10.12688/f1000research.165606.2", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["women's empowerment", "women farmers", "agricultural cooperatives", "market access", "technical training", "intersectionality", "rural women"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 41}, {"id": "W7221000578", "doi": "10.4103/ijcm.ijcm_752_25", "title": "Analyzing the Trends in Tobacco Industry Input Costs from the Lens of Leaf Tobacco Prices and Wholesale Price Index (WPI) of India", "date": "2026-10-07", "year": "2026", "journal": "Indian Journal of Community Medicine", "issn": "09700218", "publisher": "Medknow", "authors": ["Pranay Lal", "Saptarshi Basu Roy Choudhury", "Yogesh Kumar Jain", "Ravita Yadav", "Prashant Kumar Singh", "Amit Yadav"], "abstract": "Abstract Background: India is among the world’s largest producers and consumers of tobacco, with Flue-Cured Virginia (FCV) leaf forming the backbone of cigarette production. Despite claims of supporting rural livelihoods, smallholder farmers of tobacco face low income, rising input costs, and environmental degradation. While the wholesale price index (WPI) of India has steadily risen over the years, farm-gate auction prices of tobacco have stagnated, widening disparities between manufacturers and growers. The introduction of the goods and services tax (GST) in 2017 further reshaped the fiscal landscape, but its implications for farmer incomes remain unclear. In this context, the study analyzes and compares the trends in leaf tobacco prices with those of WPI in India, drawing implications for farmers’ welfare and the sustainability of tobacco cultivation. Materials and Methods: Secondary data were obtained from the Tobacco Board of India; University of California, San Francisco Industry Documents Library; and International Monetary Fund databases. Average auction platform prices for FCV tobacco from 1984 to 2024 were compared with WPI (2010 = 100). Trends were analyzed across pre- and post-GST periods, with inflation-adjusted comparisons to assess real income implications for tobacco farmers. Results: The study findings reveal four decades of price stagnation, with FCV auction prices stuck between INR 50–70/kg until the early 2000s, rising modestly to INR 100/kg by 2010, and only recently reaching INR 257/kg in 2023–24. In contrast, WPI showed steady upward movement, reflecting broader inflation. Post-GST, farm-gate prices remained misaligned with WPI, offering no immediate relief. This prolonged disconnect suppressed farmer incomes while manufacturers benefited from relatively cheaper raw material costs. Conclusions: The study underscores structural inequities in tobacco leaf pricing in India for FCV tobacco growers, where farmers bear rising costs without proportional price gains. Urgent policy reforms are needed to ensure inflation-adjusted procurement, alongside sustainable crop diversification strategies, to protect the livelihoods and agricultural viability of tobacco.", "oa_url": "https://doi.org/10.4103/ijcm.ijcm_752_25", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["flue-cured Virginia tobacco", "wholesale price index", "Goods and Services Tax", "inflation", "crop diversification", "India"], "topics": ["Akses & informasi pasar petani", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 38}, {"id": "W7221017433", "doi": "10.3390/agriculture16192164", "title": "Can Farmers’ Participation in E-Commerce Promote Common Prosperity? An Empirical Analysis Based on Survey Data of Farmers in 10 Chinese Provinces", "date": "2026-10-07", "year": "2026", "journal": "Agriculture", "issn": "20770472", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Mingyang Yin", "Yan Yan", "Xiudong Wang"], "abstract": "Based on data from the 2020 China Rural Revitalization Comprehensive Survey, this study uses a sample of 2508 farm households from 10 provinces to empirically examine the effect of farmers’ e-commerce participation on common prosperity and its underlying mechanisms. The benchmark regression results indicate that farmers’ e-commerce participation significantly promotes common prosperity. The findings remain robust after a series of robustness checks, including propensity score matching (PSM), Tobit estimation, instrumental variable approaches, and alternative measures of the core explanatory variable. Heterogeneity analysis indicates that farmers’ engagement in e-commerce business has a significantly positive effect on common prosperity in the eastern, central, and western regions, with the largest estimated effect observed in the central region. Moreover, farmers’ engagement in e-commerce business significantly enhances common prosperity across groups with different income levels and average household educational attainment, with larger estimated effects among low-income households and those with lower average education levels, indicating greater benefits for relatively disadvantaged groups. Mechanism analysis results indicate that farmers’ participation in e-commerce operations mainly promotes common prosperity through two pathways: improving rural credit accessibility and enhancing information acquisition capabilities.", "oa_url": "https://doi.org/10.3390/agriculture16192164", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["common prosperity", "rural revitalization", "information acquisition", "income inequality", "low-income households", "household education", "regional heterogeneity", "China"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 28}, {"id": "W7220861081", "doi": "10.3389/fpls.2026.1952622", "title": "Optimization of protoplast cell division and microcallus formation toward somatic embryogenesis in oil palm", "date": "2026-10-07", "year": "2026", "journal": "Frontiers in Plant Science", "issn": "1664462X", "publisher": "Frontiers Media", "authors": ["Mohamed A. A. Ahmed", "Hanlu Su", "Elboghdady A. E. A.", "Seerat Fatima", "Zhiying Li", "Yong Wang"], "abstract": "Background Efficient protoplast regeneration remains a major obstacle to the application of somatic hybridization, genome editing and precision breeding in oil palm ( Elaeis guineensis ); while early developmental stages, from cell wall regeneration and cell division to microcolony and microcallus formation, could be more important, which could be connected easily with the traditional tissue culture system for succeeding plant regeneration. This study aimed to optimize the protopalst culture conditions for cell division and microcallus formation by identifying the most effective combinations of culture systems, basal media and plant growth regulators. Methods Protoplasts isolated from different oil palm tissues (embryogenic callus, suspension cultures, and somatic embryos) were investigated by protoplast yield and viability; protoplasts from the embryogenic callus showed the most satisfactory response and was therefore used for subsequent optimization of culture conditions. The protoplasts were cultured using six culture systems (liquid, droplet, agarose pool, well-plate culture, feeder layer, and nurse culture) in combination with eight basal media (BH3, MS, WPM, Y3, KM, B5, N6, and KPR), and the culture effects were evaluated based on protoplast viability, plating efficiency, cell division, microcolony and microcallus formation. Microcallus emerged from the KPR solid medium were transferred to previously established traditional tissue culture system for further somatic embryogenesis and regeneration. Results BH3 liquid medium was particularly effective for early protoplast recovery and rapid cell wall regeneration, whereas KPR solid medium combined with the nurse culture system, provided the most favorable conditions for sustained cell division, plating efficiency, microcolony and microcallus formation. Cell division occurred within 3–7 days, followed by microcolony formation after approximately 7 days and visible microcallus formation after 60 days. Microcallus were transferred for further development, somatic embryos and bud regeneration was observed after 90 days and 120 days, respectively. Conclusions The present study focused on the early developmental stages of oil palm protoplast culture, and optimized a stage-specific culture strategy for quick microcallus formation; combined with previous oil palm tissue culture system, further somatic embryogenesis and bud regeneration were established successfully. This work not only promoted the protoplast regeneration of oil palm, but also provides a promising strategy for other tropical palm trees such as coconut and betel nut.", "oa_url": "https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2026.1952622/pdf", "pdf_url": "https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2026.1952622/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["oil palm", "protoplast culture", "protoplast regeneration", "somatic embryogenesis", "cell division", "plant growth regulators", "embryogenic callus", "microcolony formation"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7220735597", "doi": "10.1016/j.foreco.2026.124313", "title": "Long-term legacy effects of Eucalyptus plantation on soil properties, ant diversity, and ecosystem functioning in tropical montane ecosystems", "date": "2026-10-07", "year": "2026", "journal": "Forest Ecology and Management", "issn": "03781127", "publisher": "Elsevier BV", "authors": ["Bruno Henrique Silva Mayrink", "Tatiana Cornelissen", "Bruno Moreira", "Pablo Cuevas‐Reyes", "Walisson Kenedy‐Siqueira", "Marcílio Fagundes"], "abstract": "Eucalyptus plantations are rapidly expanding across tropical mountains, where silvicultural practices modify soil properties and biodiversity. However, the long-term consequences of abandoned plantations remain poorly understood, particularly in biodiversity hotspots such as the Espinhaço Range, Brazil. Here, we evaluated the effects of active and abandoned Eucalyptus plantations on soil properties, ant community, and ant-mediated ecosystem services in tropical montane ecosystems. We compared reference vegetation ( Campo Sujo ), active Eucalyptus plantations (four years old), and abandoned plantations (approximately five years after harvesting) across three sites in the northern Espinhaço Range. Ant species were sampled using pitfall traps, while scavenging, granivory, and seed dispersal were assessed using bait arenas. Soil physical and chemical properties were also quantified. Mean values of soil organic matter, organic carbon, and potential cation exchange capacity were higher in abandoned and active Eucalyptus plantations than in Campo Sujo, indicating persistent differences in soil characteristics associated with previous silvicultural land use. Active and abandoned plantations exhibited higher nutrient availability compared to reference areas. Reference areas showed higher alpha and gamma diversity, whereas active and abandoned plantations exhibited increased beta diversity. Reference areas had 52% more ant species (61 species) than active plantations (40 species), with abandoned plantations showing intermediate richness (46 species). Ant species composition also differed significantly among treatments, suggesting strong anthropogenic filtering associated with Eucalyptus plantation and limited recovery after abandonment. Ecosystem services showed variable responses to land-use change. Scavenging was reduced in active plantations and was positively associated with ant richness only in reference areas. Granivory was higher in active plantations, while seed dispersal did not differ among treatments. Overall, our findings demonstrate that Eucalyptus plantation was associated with long-lasting changes in soil conditions and ant diversity and services in montane ecosystems. These persistent soil and biodiversity differences remain detectable after Eucalyptus plantation abandonment, highlighting the importance of incorporating post-harvest management and restoration strategies.Parte superior do formulário", "oa_url": "https://doi.org/10.1016/j.foreco.2026.124313", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["eucalyptus plantations", "soil properties", "ant diversity", "ecosystem functioning", "tropical montane forest"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 0}, {"id": "W7220725843", "doi": "10.3389/fsufs.2026.1884625", "title": "Youth and the future of labor- and knowledge-intensive small-scale farming in West Africa under climate change and political instability", "date": "2026-10-06", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Merlin Leunda Martiarena", "Marina Padrão Temudo"], "abstract": "Debates on the future of smallholder farming in sub-Saharan Africa often interpret rural youth mobility and non-farm work as withdrawal from agriculture. This article examines how rural youth in coastal Guinea-Bissau engage with labour- and knowledge-intensive, climate-vulnerable mangrove swamp rice farming, and the conditions under which agriculture remains part of their imagined futures. We combine long-term ethnographic research, updated between 2020 and 2024, with a survey of 770 household heads in 13 villages, 98 biographical interviews, and conversations and group discussions involving 90 participants across 17 villages. Quantitative indicators were compared across household-head age groups, while qualitative material was analysed thematically and narratively. Results show that many young household heads remain engaged in agriculture while combining it with education, mobility and non-farm activities. Age differences in access to mangrove rice land are limited, although young household heads face higher dependency ratios and substantial rice deficits. Biographical evidence indicates that mobility and non-farm earnings often complement rather than replace agriculture. Nevertheless, climate-related risks, high labour costs, weak markets, political instability and inadequate rural services undermine its attractiveness. The study challenges binary portrayals of youth as either farmers or agricultural ‘exiters’ and shows that the future of mangrove rice farming depends on enabling diversified and mobile rural livelihoods.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1884625/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1884625/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["rural youth", "smallholder farming", "climate change vulnerability", "political instability", "youth mobility", "dependency ratio", "labor costs", "rural livelihood diversification"], "topics": ["Pembangunan pedesaan & kebijakan pertanian", "Komoditas: pisang, nanas, padi rawa"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 52}, {"id": "W7220716203", "doi": "10.1080/14735903.2026.2743390", "title": "Scaling paludiculture: stakeholder perspectives on adoption and enabling conditions in England", "date": "2026-10-06", "year": "2026", "journal": "International Journal of Agricultural Sustainability", "issn": "14735903", "publisher": "Taylor & Francis", "authors": ["Fatemeh Khosravi", "Angela Afua Assan", "Jack Clough", "Richard Lindsay"], "abstract": "Paludiculture, the cultivation of wetland species on rewetted peatlands, is increasingly promoted as a nature-based solution for climate mitigation, biodiversity restoration and peat conservation; however, its adoption remains limited in the United Kingdom. This study examines stakeholder perspectives on the adoption of paludiculture and the enabling conditions required to support its scale-up. Drawing on 36 photo-elicitation interviews with farmers, land managers, conservation organisations, researchers, and policymakers, the study explores how stakeholders interpret the ecological, economic, and socio-cultural implications of transitioning from drained peatland agriculture to wetland-based systems. Results indicate widespread recognition of environmental benefits, including greenhouse gas mitigation, flood regulation, and habitat restoration. However, adoption is constrained by concerns related to food security, land valuation, regulatory complexity, and underdeveloped markets. Stakeholders also highlight gaps in policy frameworks, with existing financial mechanisms perceived as short-term and poorly adapted to peatland systems. Market development, long-term policy support, and a strengthened evidence base emerge as critical enabling conditions, requiring coordinated policy, sustained investment, and cross-sector collaboration to support viable supply chains and demand. Aligning policy design with locally grounded knowledge and stakeholder needs is essential to enable effective environmental management.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/14735903.2026.2743390?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/14735903.2026.2743390?needAccess=true", "oa_status": "diamond", "cited_by": 0, "keywords": ["paludiculture", "wetland restoration", "stakeholder perspectives", "technology adoption", "enabling factors", "scale-up", "peatland management", "wetland conservation"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 38}, {"id": "W7220424155", "doi": "10.1016/j.biombioe.2026.110101", "title": "Sustainable ethyl levulinate production from oil palm empty fruit bunch: Integrated techno-economic analysis and life cycle assessment", "date": "2026-10-06", "year": "2026", "journal": "Biomass and Bioenergy", "issn": "09619534", "publisher": "Elsevier BV", "authors": ["임세인", "Zheng Shen Gan", "Zi Wei Ng", "Irene Mei Leng Chew"], "abstract": "Environmental concerns regarding non-renewable energy sources have driven a critical shift towards sustainable bio-based chemical production methods. Among these, the conversion of oil palm empty fruit bunch (EFB) to ethyl levulinate (EL) offers a low-toxic, biodegradable, high-performance fuel additive. This study established a multi-dimensional feasibility framework to evaluate the three conversion pathways using Aspen Plus simulation: a three-step conversion of cellulose-derived glucose via 5-hydroxymethylfurfural (5-HMF) and levulinic acid (LA) to EL (Route 1), and two furfural-based configurations valorising the hemicellulose fraction via furfuryl alcohol (Route 2) or intermediate LA production (Route 3). To determine the optimal design, a multi-criteria sustainability index (SI) was developed by integrating technical yield with economic profitability from techno-economic analysis (TEA) and environmental impact from life cycle assessment (LCA). Route 2 achieved an SI of 1 across the entire weighting space. This streamlined two-step furfural pathway achieved a technical yield of 23.5 wt% EL, an annual profit of RM 100.37 million, and a global warming potential (GWP) impact score of 4.98 tonnes of CO 2 -eq/tonne EL. Its dominance is driven by reduced complexity, lower capital investment, and decreased utility-related emissions. Although Route 3 yielded 23.0 wt% EL, its intensive energy requirements resulted in a higher GWP of 17.93 tonnes CO 2 -eq/tonne EL. Route 1 remained the least competitive overall, though it became more competitive than Route 3 only when environmental weighting exceeds approximately 32–88%. Process simplification effectively aligns technical, economic, and environmental objectives, thereby providing a robust model for the Malaysian circular bioeconomy.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S0961953426011773/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S0961953426011773/pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["ethyl levulinate", "empty fruit bunch", "biofuel production", "techno-economic analysis", "life cycle assessment", "oil palm waste", "sustainable biofuels"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7220670105", "doi": "10.3389/fsufs.2026.1935542", "title": "Development of a farmer-centric UTAUT scale for measuring farmers’ behavioural intention towards the adoption of fluoride-safe practices", "date": "2026-10-06", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Vicky Yadav", "Kalyan Ghadei", "M. K. Shukla"], "abstract": "Background Fluoride contamination in groundwater is a serious problem in many parts of India and affects agriculture, livestock, and human health. Although the Unified Theory of Acceptance and Use of Technology (UTAUT) has been widely used to explain technology adoption, no farmer-centric scale is available to measure farmers’ behavioural intention towards the adoption of fluoride-safe practices. Therefore, the present study was carried out to develop a farmer-centric UTAUT scale for this purpose. Methodology The initial statements were generated by reviewing UTAUT, UTAUT2, and other related technology adoption studies and were modified according to the agricultural context. Eighty-five statements were developed under seven constructs. After face validity, 66 statements were evaluated for content validity by a panel of 25 experts using Relevancy Weightage (RW), Mean Relevancy Score (MRS), and Overall Mean Relevancy Score (OMRS). Based on the predefined criteria, 49 statements were retained. A pilot survey was then conducted with 250 farmers from fluoride-affected areas using a five-point Likert scale. Exploratory Factor Analysis was performed using Principal Axis Factoring with Direct Oblimin rotation, followed by reliability analysis using Cronbach’s alpha. Results The KMO value (0.935) and Bartlett’s Test of Sphericity ( p < 0.001) confirmed the suitability of the data for factor analysis. Exploratory Factor Analysis supported a seven-factor structure consistent with the adapted UTAUT framework, explaining 77.23% of the total variance. Based on the factor loading criterion, seven statements were removed, resulting in a final scale consisting of 42 statements. Cronbach’s alpha values ranged from 0.882 to 0.979, indicating satisfactory internal consistency across all constructs. Discussion The developed scale can be used to measure farmers’ behavioural intention towards the adoption of fluoride-safe practices in fluoride-affected areas. It can also help researchers, extension professionals, and policymakers to understand the factors influencing farmers’ adoption decisions and to plan suitable extension programmes. Further validation of the developed scale through Confirmatory Factor Analysis using an independent sample is recommended.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1935542/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1935542/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["Unified Theory of Acceptance and Use of Technology", "behavioral intention", "technology adoption", "farmers", "scale validation", "agricultural extension"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7220684615", "doi": "10.1038/s41538-026-01133-7", "title": "Hybrid Artificial Neural Network-Genetic Algorithm modelling and optimization of multistage palm oil fractional crystallization", "date": "2026-10-06", "year": "2026", "journal": "npj Science of Food", "issn": "23968370", "publisher": "Nature Portfolio", "authors": ["Noor Hidayu Othman", "Mohd Shareduwan Mohd Kasihmuddin", "Gurajala V. S. Bhagya Raj", "Kshirod K. Dash", "Norliza Saparin", "Musfirah Zulkurnain"], "abstract": "Abstract Fractional crystallization of refined, bleached, and deodorized palm oil (RBDPO) is highly sensitive to feedstock variability, particularly fluctuations in iodine value (IV), which influences nucleation, crystal growth, separation efficiency, and olein yield. This study developed and validated response surface methodology (RSM) and hybrid Artificial Neural Network-Genetic Algorithm (ANN-GA) framework for modeling and optimizing multistage palm oil fractional crystallization across RBDPO IV51–IV53. A structured three-stage experimental design encompassing supercooling, nucleation, and crystal growth generated 145 datasets. Stage-specific RSM models quantified process-variable effects and provided an interpretable benchmark, while a multilayer feedforward ANN (7-13-5 architecture) predicted olein yield, olein IV, cloud point (CP), slip melting point (SMP), and stearin IV, achieving R 2 values of 0.79–0.96. GA integration identified feed-specific optimum cooling conditions, predicting olein yields of 83.80%, 83.10%, and 87.98% for RBDPO IV51, IV52, and IV53, respectively. Experimental validation yielded overall prediction accuracies of 91.94%, 96.97%, and 97.75%, with corresponding mean absolute percentage error (MAPE) values of 8.06%, 3.03%, and 2.25%. RSM provided robust interpretability, whereas ANN–GA offered greater flexibility for nonlinear multistage interactions. Collectively, the framework supports feed-responsive optimization of yield and product quality and establishes a basis for adaptive crystallization control and future digitalized palm oil fractionation.", "oa_url": "https://www.nature.com/articles/s41538-026-01133-7_reference.pdf", "pdf_url": "https://www.nature.com/articles/s41538-026-01133-7_reference.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["iodine value", "supercooling", "nucleation", "crystal growth", "response surface methodology", "artificial neural networks", "genetic algorithm", "cloud point"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 28}, {"id": "W7220745079", "doi": "10.1016/j.clwas.2026.100587", "title": "Options to reduce street market food waste in low-income urban communities: Perspectives from Zimbabwe", "date": "2026-10-06", "year": "2026", "journal": "Cleaner Waste Systems", "issn": "27729125", "publisher": "Elsevier BV", "authors": ["Sharon Yeukai Mada", "Felicitas Schneider"], "abstract": "Street markets in developing countries provide low-income urban households access to affordable food, especially fresh fruits and vegetables; however, the food waste generated at these markets is a sustainability concern. This study examines the characteristics and quantities of food waste and explores the reasons behind it at a street market in Hatcliffe, Zimbabwe. A mixed-method approach combining Waste Composition Analysis, field observations, and face-to-face questionnaire surveys was used to collect data during the harvest and seasons. The results show that, on average, each stall generates an estimated 690 kg of food waste per year, of which 83% is avoidable food waste. Fresh vegetables, including tomatoes, cucumbers, bell peppers, and leafy greens, constituted 71% of the total food waste mass, and fresh fruits, such as bananas, lemons, and oranges, contributed 21%. Using the Social Practice Theory, the study identifies material -related factors such as poor stall infrastructure, limited storage space, and lack of refrigeration as the main reasons for food disposal. Vendor competences also influenced waste levels, with vendors who used purchasing and sales records generating a 60.6% decrease in food waste and those who repurposed “imperfect” products generating 45.9% less food waste than those who did not. Socio-cultural meanings shaping demand, consumer preferences for aesthetically perfect produce, and prioritising certain products contribute to food waste. To promote sustainable consumption, our recommendations include improving market infrastructure, such as wide-shaded stalls and low-cost cooling systems, raising consumer awareness about embracing “imperfect” produce and educating vendors to promote best food handling and preservation practices.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S277291252600120X/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S277291252600120X/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["food waste reduction", "low-income urban communities", "informal food markets", "waste management", "municipal solid waste management", "Zimbabwe"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7220833646", "doi": "10.1080/13648470.2026.2687249", "title": "Articulations of poisoning: historicity, relationality, and contextuality of Chlordecone pollution in the French Antilles", "date": "2026-10-06", "year": "2026", "journal": "Anthropology and Medicine", "issn": "13648470", "publisher": "Taylor & Francis", "authors": ["Giorgio Brocco", "Aminata Cécile Mbaye"], "abstract": "Chlordecone, a highly persistent organochlorine insecticide, was widely applied to banana plantations in Martinique and Guadeloupe from 1972 until being banned in 1993. Decades later, its residues still permeate soil, waterways, food systems, and human bodies in the two islands. Classified as both a carcinogenic and an endocrine disruptor, the chemical compound has generated widespread protests, epidemiological debates, and political critique. Drawing on six months of non-consecutive ethnographic fieldwork conducted in Martinique between 2017 and 2022, this article examines how people interpret and navigate the chemical's enduring effects. We develop the concept of 'articulations of poisoning' to describe the ways in which Chlordecone is rendered meaningful, not simply as a biomedical or ecological risk, but as a lived, historically sedimented, and politically contested experience. These articulations unfold along three interconnected dimensions (i.e. historicity, relationality, and contextuality) that shape how poisoning is perceived, embodied, and contested in everyday life. Through the voices of activists, farmers, medical professionals, institutional actors, and community members, we explore how poisoning becomes entangled with colonial legacies, political debates, and the everyday struggle for environmental justice in the French Antilles.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/13648470.2026.2687249?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/13648470.2026.2687249?needAccess=true", "oa_status": "hybrid", "cited_by": 0, "keywords": ["chlordecone", "organochlorine insecticides", "pesticide contamination", "banana plantations", "environmental justice", "colonial legacy", "endocrine disruptors", "carcinogens"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7220695950", "doi": "10.1007/s43681-026-01417-4", "title": "Animal welfare in the world of digitalization: Computer Vision in the context of foundational structures", "date": "2026-10-06", "year": "2026", "journal": "AI and Ethics", "issn": "27305953", "publisher": "Springer Nature", "authors": ["Mariska Thalitha Bosschaert", "Bart Gremmen"], "abstract": "Abstract Computer Vision is an emerging technology within Precision Livestock Farming (PLF), combining camera systems with artificial intelligence to monitor animal welfare. While animal ethicists recognize its potential benefits, they also raise concerns about possible negative implications for animal welfare. This paper argues that addressing ethical concerns cannot rely on solutions targeting isolated ethical risks; rather, potential solutions must account for the technology’s embeddedness within society-wide structures. The focus in this paper will be on foundational structures, these structures concern how the world is experienced and understood, what is taken as self-evident. Over centuries, humans have increasingly delegated tasks to machines and standardized the world in doing so. This process has fostered growing trust in the outcomes of (digital) technologies. These developments have changed human experience and understanding of the world in various ways. Farmers, as members of society, are unlikely to be exempt from this trend. Therefore, reflection on Computer Vision must go beyond the farming practice and take into account these foundational structures that are currently reshaping society at large. Computer Vision examined as embedded within foundational structures demonstrates that ethical issues are also embedded within these structures, consequently, potential solutions must take account of them to increase their effectiveness.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s43681-026-01417-4.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s43681-026-01417-4.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["animal welfare", "computer vision", "precision livestock farming", "animal ethics", "digitalization", "trust in technology", "standardization", "farmers"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 15}, {"id": "W7220700580", "doi": "10.1002/ghg.70048", "title": "Farm‐Level Greenhouse Gas Balance of Commercial Coffee Production in Minas Gerais, Brazil", "date": "2026-10-06", "year": "2026", "journal": "Greenhouse Gases Science and Technology", "issn": "21523878", "publisher": "Wiley", "authors": ["Isabella Faustino Alves", "Laércio Antônio Gonçalves Jacovine", "Polyana Pizzi Rotta", "Pablo Murta Baião Albino", "Viviani Silva Lírio", "Rafael da Silva Teixeira", "Luís Henrique Rodrigues Silva"], "abstract": "ABSTRACT Coffee production is considered a potential contributor to climate change mitigation due to its perennial biomass and carbon storage capacity. However, empirical assessments of greenhouse gas (GHG) balances at the farm level remain limited for commercial coffee systems. This study quantified the carbon balance of 24 commercial coffee farms in Minas Gerais, Brazil, across two consecutive harvests (2020/21 and 2021/22). Farm‐level emissions of CO 2 , CH 4 , and N 2 O were estimated following IPCC guidelines (Scopes 1 and 2) using farm inventory data. Carbon removals were estimated using biomass increment coefficients for coffee plantations, Permanent Preservation Areas, and Legal Reserves. Estimated carbon removals exceeded on‐farm emissions in 16 (66.7%) and 19 (79.2%) of the evaluated farms in 2020/21 and 2021/22, respectively. Average carbon balances across farms were 104.5 Mg CO 2 e (0.59 Mg CO 2 e ha −1 ) in 2020/21 and 263.1 Mg CO 2 e (1.35 Mg CO 2 e ha −1 ) in 2021/22. Nitrogen fertilization represented the largest emission source, accounting for 66.7% and 54.2% of total emissions in each harvest. Higher productivity reduced emissions per unit of product but increased emissions per hectare due to greater input intensity. Coffee plantations accounted for 414.3 and 448.3 Mg CO 2 e of total removals in 2020/21 and 2021/22, respectively, corresponding to 70.9% of total removals across farms. These findings highlight the importance of considering both emissions and removals when evaluating the carbon balance of commercial coffee systems. Farm‐level carbon accounting provides useful information for understanding carbon dynamics in perennial cropping systems and supporting greenhouse gas assessments in coffee production. 2026 Society of Chemical Industry and John Wiley & Sons, Ltd.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/ghg.70048", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/ghg.70048", "oa_status": "hybrid", "cited_by": 0, "keywords": ["coffee production", "greenhouse gas balance", "carbon balance", "methane emissions", "nitrous oxide emissions", "carbon sequestration", "biomass accumulation", "coffee plantations"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7220449937", "doi": "10.1016/j.jrurstud.2026.104448", "title": "Rural industrial integration and household income in China: Mechanisms, distributional effects, and threshold dynamics", "date": "2026-10-05", "year": "2026", "journal": "Journal of Rural Studies", "issn": "07430167", "publisher": "Elsevier BV", "authors": ["Hong Yang", "李忆春"], "abstract": "Achieving sustained growth in rural household income is a core challenge in agricultural and rural development. This study explores whether the integration of rural industries can promote farmers' income growth, and what the mechanism of this effect is. Based on seven waves of CFPS panel data of 2326 farmers in 30 provinces of China from 2010 to 2022, this paper uses the entropy weight method to construct the inter-provincial integration index, and analyzes its income effect, transmission path and distributional significance. The results consistently confirm that integration promotes sustained income growth. The study identifies two transmission mechanisms: the reallocation of labor to off-farm employment, which diversifies household income sources; and the easing of credit constraints, which improves smallholder access to productive resources and higher value supply chain activities. The analysis of regional heterogeneity shows that income growth is significant in highly urbanized areas and non-major grain producing areas, but weakens under the constraint of the staple grain value chain. The threshold regression finds a double threshold structure, suggesting that the income growth effect strengthens only after the degree of integration exceeds the critical level of intersectoral coordination. The quantile analysis further reveals distributional asymmetry: middle and high income farmers benefit substantially, while low income farmers have limited gains due to constrained access to value-added segments. The research results indicate that rural industrial integration can promote farmers' income growth by creating local non-agricultural employment opportunities and alleviating credit constraints. However, its benefits are influenced by regional conditions, family income status, and the stage of integration. These findings provide useful references for formulating rural industrial policies that are adapted to local development conditions.", "oa_url": "https://doi.org/10.1016/j.jrurstud.2026.104448", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["rural industrial integration", "rural household income", "farmer income growth", "off-farm employment", "labor reallocation", "credit constraints", "value chain", "intersectoral coordination"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 47}, {"id": "W7220406710", "doi": "10.1007/s10037-026-00294-y", "title": "Do Agriculture and Infrastructure Development Improve Life Satisfaction? Evidence from Rural Tanzania", "date": "2026-10-05", "year": "2026", "journal": "Review of Regional Research", "issn": "01737600", "publisher": "Springer Science+Business Media", "authors": ["Victoria Luxen", "Moses January Ndunguru", "Peter Dannenberg"], "abstract": "Abstract Rural development in Sub-Saharan Africa is mostly measured by economic indicators, despite growing calls to broaden this narrow focus. Although wellbeing is used in discourse, it often repackages economic goals rather than capturing people’s subjective wellbeing. We address this gap by analysing how and why agricultural intensification, commercialisation and infrastructure interventions affect life satisfaction, a central component of subjective wellbeing, among Tanzanian smallholder farmers within the Southern Agricultural Growth Corridor of Tanzania (SAGCOT). Using longitudinal survey data from 2019 and 2023 ( N = 871) and focus groups, we show that life satisfaction has increased on average. Among the variables analysed in this study, access to electricity combined with Information and Communication Technologies (ICT) use is associated with higher life satisfaction. Despite development narratives, we do not find statistically significant evidence that agricultural intensification is associated with higher life satisfaction. Commercialisation is negatively associated with life satisfaction, which our qualitative findings link to perceived structural and market barriers. Infrastructure effects are heterogeneous and depend on household access: road improvements are associated with lower satisfaction among households without transport, while electricity is associated with higher satisfaction when used for ICT. These findings show that life satisfaction provides a valuable lens for understanding the intended and unintended impacts of development and can inform policies and practices by highlighting that these impacts are heterogeneous and vary across different groups.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s10037-026-00294-y.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s10037-026-00294-y.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["life satisfaction", "subjective well-being", "rural development", "agricultural intensification", "agricultural commercialization", "infrastructure development", "electricity access", "information and communication technologies"], "topics": ["Adopsi teknologi & pertanian digital", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 37}, {"id": "W7220460500", "doi": "10.1016/j.worlddev.2026.107585", "title": "Mobile internet connectivity and climate change literacy in Africa", "date": "2026-10-05", "year": "2026", "journal": "World Development", "issn": "0305750X", "publisher": "Elsevier BV", "authors": ["Yacouba Kassouri"], "abstract": "Addressing climate change requires individual behavioral shifts and a deep understanding of its impacts, yet the role of information and communication technologies (ICT), a powerful driver of social movements and cultural shifts, in shaping climate change literacy remains underexplored. This study addresses a critical gap by exploring how ICT, particularly mobile Internet connectivity, influences climate change literacy in Africa. I provide the first causal evidence on the impact of mobile Internet connectivity on climate change literacy by exploiting variations in peer-based Internet connectivity in an instrumental variable strategy. Using newly georeferenced individual-level data on climate change literacy from over 42,000 respondents across 31 African countries, I show that climate change literacy increases among individuals connected to the Internet. The differential analysis indicates that Internet connectivity can help close climate-related information gaps, particularly for traditionally disadvantaged populations such as women, farmers, and those without formal education. Importantly, the impact is concentrated in climate-vulnerable arid and tropical regions. These findings suggest that closing the digital divide by addressing socioeconomic inequalities in Internet connectivity effectively enhances climate change knowledge. Although, Internet connectivity increases the frequency of using Internet and social media for news, there is no strong evidence that these platforms serve as channels linking Internet connectivity to climate literacy.", "oa_url": "https://doi.org/10.1016/j.worlddev.2026.107585", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["mobile internet connectivity", "climate change literacy", "information and communication technologies", "climate awareness", "climate risk perception", "peer effects", "social media use", "information gap"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 34}, {"id": "W7220435599", "doi": "10.1016/j.psj.2026.107899", "title": "Biotechnological upgrading of palm kernel meal for poultry nutrition: Challenges and opportunities", "date": "2026-10-05", "year": "2026", "journal": "Poultry Science", "issn": "00325791", "publisher": "Elsevier BV", "authors": ["Ahmed Mijiyawa", "Elham Ghashghaei", "Uchechukwu Edna Obianwuna", "Hamada Okasha", "Yendouhamtchié Nadiedjoa", "Maxwell Ansong Okai", "Lijing Sun", "Muhammad Faisal Riaz", "Felix Kwame Amevor", "Dossêh Jean Apôtre Afayibo", "Were Pitala", "Hai Lin"], "abstract": "In recent years, fluctuations in the cost of traditional feed ingredients for poultry farming have compelled producers to explore alternative raw materials to reduce costs. Palm kernel meal (PKM), a by-product of the palm oil extraction industry, is one such alternative. Although PKM is often deemed a low-quality ingredient for poultry feed due to its low energy density and high content of non-starch polysaccharides, particularly β-mannans, its availability and lower price relative to other meal products make it a viable option. This review highlights the nutritional challenges and demonstrates how biotechnology can convert a cumbersome waste product into a valuable feed ingredient. The data focuses on the use of exogenous enzymes, with an emphasis on the synergistic action of β-mannanases and multicarbohydrase cocktails. The use of solid-state fermentation (SSF) with fungal and bacterial strains was also discussed. These bioprocesses efficiently break down complex fibrous matrices, increase the content of crude protein through microbial biomass synthesis and release bioactive manno-oligosaccharides (MOS) in situ. In vivo studies demonstrate that incorporating processed PKM maintains and improves production performance. The released MOS act as prebiotics, stimulating the growth of beneficial gut bacteria, preventing the growth of pathogens, and improving intestinal mucosal architecture. Although biotechnological valorization offers a promising way to transform PKM into a high-value functional ingredient for poultry feed, this technology has certain limitations. These include substrate variability and high scaling costs. Further research is needed into industrial-scale SSF processes, as well as the optimization of eco-efficient enzyme combinations and sequential fermentations.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S0032579126015336/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S0032579126015336/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["palm kernel meal", "poultry feed", "β-mannanase", "exogenous enzymes", "solid-state fermentation", "manno-oligosaccharides", "prebiotics", "non-starch polysaccharides"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 26}, {"id": "W7220444925", "doi": "10.1080/19439342.2026.2742225", "title": "Ethnoveterinary medicine adoption and household food security among small ruminant farmers in Northern Ghana", "date": "2026-10-05", "year": "2026", "journal": "Journal of Development Effectiveness", "issn": "19439342", "publisher": "Taylor & Francis", "authors": ["Daniel Ziba", "Gideon Danso-Abbeam", "Franklin Nantui Mabe", "Gilbert Dagunga", "Abiodun Akintunde Ogundeji"], "abstract": "Small ruminants’ production is critical to household food security in developing countries including Northern Ghana. Beyond serving as a source of food and income, small ruminants also act as a buffer or form of insurance against household shocks. As such, their health is pivotal to ensuring that these benefits are realised. Ethnoveterinary medicine (EVM), defined as the traditional or indigenous animal health practice which involves the use of plant extracts, serves as a potential pathway for increased household food security outcomes. These practices were promoted by the Association of Church-Based Development Projects (ACDEP) from 2019 to 2022 through their Ethnovet project. The study assesses the impact of ethnoveterinary medicine on food security outcomes using cross-sectional data from 400 small ruminant farmers in Northern Ghana. Employing the endogenous ordered probit with treatment effect model, the results show that household adoption decisions for EVM were influenced by sociodemographic and institutional factors including education, household size, off-farm income, distance to market, access to extension and access to credit. Awareness of EVM and perceived benefits also informed farmers’ choices for EVM. The treatment effect estimates show that adoption of EVM significantly influences household dietary quality, reduces the probability of falling into crises and exerts a moderate effect on household food access. Specifically, adoption increases the probability of household to fall in acceptable food consumption by 27 percentage points, reduces the probability of falling in severe coping strategies situation by 43 percentage points and increases the probability of falling into moderate food security situation by 14 percentage points. The study thus recommends the need for sustainable animal health practices such as the integration of EVM into the delivery of animal extension services. There should also be conscious scientific testing of these EVM practices and standardisation to ensure effective utilisation.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/19439342.2026.2742225?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/19439342.2026.2742225?needAccess=true", "oa_status": "hybrid", "cited_by": 0, "keywords": ["ethnoveterinary medicine", "small ruminants", "household food security", "technology adoption", "diet quality", "coping strategies", "food access", "access to credit"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 25}, {"id": "W7220407703", "doi": "10.37394/232015.2026.22.93", "title": "Soil and Water Conservation Mechanism in Oil Palm Plantations: A Review of Best Management Practices and Decision Support Strategies", "date": "2026-10-05", "year": "2026", "journal": "WSEAS TRANSACTIONS ON ENVIRONMENT AND DEVELOPMENT", "issn": "17905079", "publisher": "", "authors": ["Loso Judijanto", "Sri Nurhayati"], "abstract": "Soil and water conservation on oil palm plantation is increasingly considered as a glimmer of hope for the future sustainability of land functionality and environment. Appropriate management practices and informed decision-making frameworks thus have a strong influence on conservation outcomes. This study aims to systematically identify, categorize, synthesize and quantitatively aggregate peer-reviewed evidence regarding soil and water conservation mechanisms in oil palm plantations, focusing on best management practice strategies and decision support. This study uses Systematic Litigation Review (SLR) the Scopus database is used as a reference in searching scientific publication. A keyword-based structured search was used to identify peer-reviewed articles published from 2020 to 2025 and subsequent screening in sequence based on relevance and language. Thirty-eight articles met all the selection criteria for analysis. Then we extracted data and analyzed it using thematic synthesis with descriptive quantitative aggregation of reported metrics (soil loss, SOC change, runoff reduction, or yield response). The results show six main interrelated themes: control of soil erosion; soil fertility and organic matter management; conservation of water and hydrological regulation; integrated land use and landscape management; agronomic best methods practices; and support for decision-making processes. Quantitative synthesis show that cover-based and structural BMPs decrease soil loss by 50–80%, organic amendments increase SOC by 10–35% and integrated water management decreases runoff by 20–60% across regions reported.", "oa_url": "https://wseas.com/journals/ead/2026/b885115-041(2026).pdf", "pdf_url": "https://wseas.com/journals/ead/2026/b885115-041(2026).pdf", "oa_status": "diamond", "cited_by": 0, "keywords": ["soil and water conservation", "oil palm plantations", "best management practices", "decision support", "soil erosion control", "soil organic carbon", "runoff reduction", "soil fertility"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7220420438", "doi": "10.3390/su181910139", "title": "IoT Adoption for Sustainable Agri-Food Logistics: Perceived Usefulness, Investment Intentions, and Implementation Barriers in Greece", "date": "2026-10-04", "year": "2026", "journal": "Sustainability", "issn": "20711050", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Aikaterini Roumpaki", "Christos Staboulis", "Efthimia Tsakiridou", "Konstadinos A. Mattas"], "abstract": "Sustainability pressures in agri-food supply chains are creating growing interest in digital technologies that can improve the efficiency and responsiveness of logistics and supply chain operations. Within this context, the Internet of Things (IoT) is increasingly discussed as a tool with potential applications that extend beyond farm-level monitoring to broader agri-food logistics processes. This study examines perceptions of IoT and factors associated with its wider integration through the perspectives of key professional groups involved in the agri-food supply chain, moving beyond single-actor approaches. Based on survey data from 217 professionals in Greece, including 40.1% agronomists, 32.7% f
