<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PantauRiset</title>
<meta name="description" content="Pembaca artikel open access terbaru bidang agribisnis dan ekonomi pertanian.">
<style>
  :root{
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#efece3; --text:#1d1b16; --muted:#6b665a;
    --line:#e2ddd0; --accent:#2f6b4f; --accent-soft:#e3efe7; --accent-text:#1f4d38;
    --warn:#b4601b; --warn-soft:#f7e8d8; --chip:#f0ede4; --shadow:0 1px 2px rgba(0,0,0,.05);
    --radius:12px; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1e2025; --surface-2:#262930; --text:#ecebe6; --muted:#a09d94;
    --line:#32353d; --accent:#6cbf96; --accent-soft:#1f3a2e; --accent-text:#bfe6d1;
    --warn:#e39a5a; --warn-soft:#3b2a1b; --chip:#2b2e36; --shadow:none;
  }}
  :root[data-theme="dark"]{
    --bg:#15161a; --surface:#1e2025; --surface-2:#262930; --text:#ecebe6; --muted:#a09d94;
    --line:#32353d; --accent:#6cbf96; --accent-soft:#1f3a2e; --accent-text:#bfe6d1;
    --warn:#e39a5a; --warn-soft:#3b2a1b; --chip:#2b2e36; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
  a{color:var(--accent-text)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
  .brand{font-family:var(--serif);font-size:1.45rem;letter-spacing:.2px}
  .brand small{display:block;font-family:var(--sans);font-size:.78rem;color:var(--muted);letter-spacing:0}
  .stats{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--text);font-weight:600}
  .controls{display:grid;grid-template-columns:1fr;gap:8px;padding:0 0 12px}
  @media(min-width:760px){.controls{grid-template-columns:2fr 1fr 1fr 1fr 1fr}}
  input[type=search],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:.92rem}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
  .tab{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.84rem;color:var(--muted)}
  .tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:18px 0 60px}
  .list{display:grid;gap:14px}
  article{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  article.read{opacity:.68}
  .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.8rem;color:var(--muted);align-items:center}
  .badge{padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--chip);color:var(--muted)}
  .badge.prio{background:var(--accent-soft);color:var(--accent-text)}
  .badge.new{background:var(--warn-soft);color:var(--warn)}
  .badge.rel{background:var(--surface-2);color:var(--text)}
  h2{font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1.35;margin:8px 0 4px}
  h2 a{color:inherit;text-decoration:none}
  h2 a:hover{text-decoration:underline}
  .authors{font-size:.86rem;color:var(--muted);margin-bottom:10px}
  .summary{display:grid;gap:6px;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.92rem}
  .summary div b{color:var(--accent-text);font-weight:600;margin-right:4px}
  .abstract{font-size:.9rem;color:var(--text);margin-top:10px;display:none}
  article.open .abstract{display:block}
  .kw{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .kw span{font-size:.74rem;background:var(--chip);padding:2px 8px;border-radius:999px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .btn{font:inherit;font-size:.82rem;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:hover{border-color:var(--accent)}
  .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .theme{font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted);cursor:pointer}
  .more{text-align:center;margin-top:18px}
  @media(max-width:759px){
    header{position:static}
    .stats{display:none}
    .brand{font-size:1.25rem}
  }
</style>
</head>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">PantauRiset<small id="gen"></small></div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="stats" id="stats"></div>
        <button class="theme" id="theme" title="Ganti tema">Tema</button>
      </div>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Cari judul, abstrak, penulis, jurnal...">
      <select id="topic"><option value="">Semua topik</option></select>
      <select id="journal"><option value="">Semua jurnal</option></select>

        <option value="90">90 hari terakhir</option>
        <option value="0">Semua waktu</option>

      <select id="sort">
        <option value="rel">Urut: relevansi</option>
        <option value="date">Urut: terbaru</option>
        <option value="cites">Urut: sitasi</option>
      </select>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-f="all" aria-pressed="true">Semua</button>
      <button class="tab" data-f="unread">Belum dibaca</button>
      <button class="tab" data-f="saved">Disimpan</button>
      <button class="tab" data-f="prio">Jurnal prioritas</button>
      <button class="tab" data-f="pdf">Ada PDF</button>
      <button class="tab" data-f="summ">Ada ringkasan ID</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="list" id="list"></div>
  <div class="more" id="more"></div>
</main>

crop output, resource-use efficiency, and regional gross income. Scenario simulations show that rice-oriented subsidies increase rice output but reduce resource-use efficiency, rapeseed output, and gross income, whereas rotation-oriented incentives increase gross income while maintaining rice output near the baseline level. These findings support performance-linked subsidies based on multidimensional outcomes, tiered land-transfer regulation, and diversified cropping incentives. By linking adaptive behavioral dynamics with spatial and institutional constraints, this study provides a robust analytical framework for evaluating land-use policies and supports more effective governance strategies for balancing food security, environmental sustainability, and rural livelihoods.", "oa_url": "https://doi.org/10.1016/j.landusepol.2026.108374", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": [], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 35}, {"id": "W7221788829", "doi": "10.3390/mca31050228", "title": "Fractional-Order Epidemiological Model for Banana Bunchy Top Disease Integrating Memory Effects and Optimal Control Strategies", "date": "2026-10-14", "year": "2026", "journal": "Mathematical and Computational Applications", "issn": "1300686X", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Thamizharasi Tamilmani", "Venkatesh Ambalarajan", "Santhosh Moni Chinnian", "Shajidmon Kolamban", "M. Prakash Raj"], "abstract": "Banana Bunchy Top Disease (BBTD) is caused by Banana Bunchy Top Virus (BBTV), poses a significant threat to global banana farming and results in substantial yield losses and economic instability for smallholder farmers. Extensively, Classical compartmental models are used in plant diseases while overlooking the hereditary effects intrinsic to biological systems. Throughout this paper, an innovative fractional-order epidemiological model for BBTD is formulated using Caputo-type derivatives to integrate memory effects in plant–vector interactions. In this model, the host plant population is partitioned into five distinct compartments—susceptible, exposed, infected, treated, and recovered—whereas the vectors are classified into susceptible, infectious, and removed states. By applying the next-generation matrix, the local stability of the disease-free equilibrium is established. The sensitivity analysis of BBTD reveals that transmission and progression parameters act as the essential determinants of disease persistence within the ecosystem. The Numerical simulations are executed using the modified Euler method that illustrates the impact of fractional-order dynamics includes infection peaks, treatment effectiveness, and recovery delays. Using Optimal control strategies and Pontryagin’s Maximum Principle, preventive measures, vector management, and treatment interventions for BBTD are developed. These strategies demonstrate that integrated controls significantly reduce the infection prevalence while maintaining cost-effectiveness. These findings underscore the efficacy of fractional calculus in plant disease epidemiology, offering superior predictive precision and actionable insights for sustainable, long-term BBTD management.", "oa_url": "https://doi.org/10.3390/mca31050228", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": [], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 31}, {"id": "W7221647657", "doi": "10.1080/23311932.2026.2746802", "title": "Resilience, market transparency, and farmer performance: an information processing perspective on fragmented agricultural markets", "date": "2026-10-13", "year": "2026", "journal": "Cogent Food & Agriculture", "issn": "23311932", "publisher": "Cogent OA", "authors": ["Irugu Chandana", "Vasumathi Arumugam"], "abstract": "Farmers’ value realization is restricted by structural uncertainty, institutional fragmentation, and information asymmetry in the agricultural markets of developing economies. Previous studies have largely conceptualized resilience through disruption and recovery perspectives, while less attention has been given to its role in information processing and coordination within fragmented agricultural systems. Building on Information Processing Theory (IPT), this conceptual study reconceptualizes Agricultural Supply Chain Resilience as a distributed information-processing capacity and proposes that it influences farmer performance through market execution capability, with market transparency acting as a boundary condition. Market execution capability reflects the ability to convert coordinated information into market processes, including grading, pricing, auctioning, and settlement. By reducing informational ambiguity and enhancing the reliability and interpretability of market information, market transparency moderates the extent to which execution ability converts into farmer outcomes. By positioning resilience as a distributed information processing capability, the study’s framework advances IPT beyond primary hierarchical organizational settings to fragmented agricultural systems. This study indicates a multi-faceted approach to policy interventions that should combine digital market platforms and transparency mechanisms with institutional capacity, farmer organizations, and support for market access and bargaining conditions.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/23311932.2026.2746802?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/23311932.2026.2746802?needAccess=true", "oa_status": "diamond", "cited_by": 0, "keywords": ["resilience", "market transparency", "farmer performance", "information processing", "agricultural markets"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 52}, {"id": "W7221584733", "doi": "10.1007/s43621-026-05011-w", "title": "Unpacking the drivers of improved crop technology adoption and intensity among smallholder farmers in Ethiopia’s Amhara Region", "date": "2026-10-13", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["MULUALEM MOLLA", "Walie Tilahun"], "abstract": "Agricultural transformation in sub-Saharan Africa depends critically on the adoption of improved crop technologies, yet uptake remains limited despite sustained dissemination efforts. This study unpacks the drivers influencing smallholder farmers’ decisions to adopt and intensify the use of improved agricultural technologies in Ethiopia’s Amhara Region, an area characterized by diverse agro-ecologies and persistent food insecurity. Utilizing cross-sectional household survey data from 486 randomly selected farm households across three zones, we employ a generalized double-hurdle model with correlated errors to analyze two sequential decision-making processes: the initial adoption decision and the intensity of adoption, measured by land area allocated to improved technologies. We also estimate a Multivariate Probit model to account for joint adoption of technology packages, and conduct sub-sample analyses to examine household-level heterogeneity. The results reveal that adoption is a multi-phase process, with distinct drivers influencing each stage. Household-level characteristics, including education, agricultural experience, and social network participation, significantly affect the initial adoption decision. In contrast, resource endowments such as livestock holdings and farm size predominantly determine the intensity of technology use. Institutional factors, including access to extension services and credit, play significant roles across both decision stages. The correlation between the two hurdles is positive and significant (ρ = 0.42, p < 0.01), confirming the presence of selection bias and justifying the generalized specification. Adoption rates vary substantially by technology type, from 78% for inorganic fertilizer to 23% for improved crop varieties. Heterogeneity analysis reveals that credit constraints bind more tightly for small farms and female-headed households, while extension services substitute for formal education among less educated farmers. The findings underscore the importance of distinguishing between adoption and intensity when designing agricultural extension and technology dissemination policies. Tailored interventions that address both entry-level behavioral barriers and resource constraints are essential for scaling up improved crop technologies. By disaggregating the adoption process, this study provides nuanced insights for policymakers and development practitioners seeking to foster sustainable agricultural transformation in resource-constrained, climate-vulnerable settings.", "oa_url": "https://doi.org/10.1007/s43621-026-05011-w", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["adoption factors", "smallholder farmers", "Amhara region", "Ethiopia"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7221698652", "doi": "10.3390/agriengineering8100438", "title": "Data Fusion of GPS Trackers and Activometers Mounted on Milking Cows for Alpine Pasture Exploitation Monitoring", "date": "2026-10-13", "year": "2026", "journal": "AgriEngineering", "issn": "26247402", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Dario Benedini", "Andrea Lazzari", "Claudia Gambale", "Milena Povolo", "Lucia Monti", "Valeria Pelizzola", "Giovanni Cabassi"], "abstract": "Extensive grazing in alpine environments represents a livestock management strategy that contributes to landscape conservation, animal welfare, and allows the production of high-quality dairy products. Digital technologies offer a potential solution to these challenges by supporting farmers and facilitating generational turnover. In this work, 20 lactating cows were monitored during the grazing season using GPS devices to track movements across the pasture area and activometers composed of an accelerometer-based collar that recorded cow neck movements continuously, classifying them into three possible behaviours: rumination, feeding and resting. Data provided by the activometers were collected with a resolution of 15 min intervals, reporting the duration of each activity, while GPS data were collected at an average frequency of 5 min. GPS data were filtered for potential outliers and subsequently aligned with activometers data through a Visual Basic for Applications (VBA) algorithm. This data fusion optimization enabled the creation of a robust integrated dataset in which each GPS position was associated with the animal’s predominant activity, allowing the analysis of grazing patterns and the generation of high-resolution grazing maps. The combination of these two digital tools proved effective in assessing animal behaviour in mountainous environments, providing operational indicators to support pasture management and improve forage biomass utilisation.", "oa_url": "https://doi.org/10.3390/agriengineering8100438", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["GPS tracking", "accelerometer", "grazing patterns", "alpine pastures", "extensive grazing", "dairy cattle", "data fusion", "animal welfare"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 11}, {"id": "W7221534151", "doi": "10.1007/s43546-026-01493-y", "title": "Estimating determinants of market participation and its impact on the income of under-utilized vegetable farmers in Nigeria", "date": "2026-10-12", "year": "2026", "journal": "SN Business & Economics", "issn": "26629399", "publisher": "Springer Nature", "authors": ["Ayodeji Damilola Kehinde", "Adeolu B. Ayanwale", "Abosede Ige"], "abstract": "Abstract Under-utilized indigenous vegetables (UIVs) offer considerable potential for improving rural livelihoods in Nigeria due to their nutritional benefits, climate resilience, and cultural importance. Despite these advantages, their contribution to household welfare remains limited because of weak integration into formal markets. In the context of increasing emphasis on inclusive agricultural commercialization, market participation represents an important pathway for enhancing the welfare of smallholder farmers. This study investigates the determinants and income effects of market participation among smallholder farmers cultivating UIVs in Southwestern Nigeria. Primary data were collected from randomly selected farmers participating in the Nigeria–Canada Under-recognized Vegetable Project (NiCanVeg) across multiple states and agro-ecological zones. A Linear Regression Model with Endogenous Treatment Effects (LRETEM) was employed to address selection bias and unobserved heterogeneity in estimating the impact of market participation on income. Descriptive findings indicate that market participants tend to be younger, more educated, and possess greater productive assets and savings than non-participants. Econometric results reveal that socioeconomic and institutional factors, including gender, age, education, asset ownership, livestock income, and cooperative membership, significantly influence market participation decisions. The findings further demonstrate that participation in markets exerts a positive and significant effect on farmers’ welfare outcomes. The study underscores the importance of strengthening market access mechanisms for smallholder farmers and recommends policies aimed at enhancing farmer cooperatives, improving access to market information, and promoting inclusive value chains to support the commercialization of UIVs in Nigeria.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s43546-026-01493-y.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s43546-026-01493-y.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["market participation", "smallholder farmers", "farm income", "determinants of market participation", "agricultural cooperatives", "market access", "rural livelihoods", "agricultural commercialization"], "topics": ["Akses & informasi pasar petani", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 60}, {"id": "W7221472675", "doi": "10.1186/s40066-026-00634-8", "title": "Constraints and opportunities in cluster-based farming in Ethiopia", "date": "2026-10-12", "year": "2026", "journal": "Agriculture & Food Security", "issn": "20487010", "publisher": "BioMed Central", "authors": ["Endris Mamo Mulate", "Muluken Gezahegn Wordofa"], "abstract": "Abstract Background In many developing countries, smallholders play a central role in the agricultural sector, and holding significant potential for agricultural growth and rural development. In Ethiopia, agriculture contributes about 37.57% to Et GDP and supports the livelihoods of most of the population. However, recent agricultural growth has not efficiently addressed persistent challenges of food insecurity, malnutrition, and rural poverty among smallholder farmers. To improve productivity and promote commercialization, the Agricultural Transformation Agency introduced cluster-based farming approach aimed at transforming subsistence farming into market-oriented production system. Despite its potential benefits, the adoption and expansion of cluster farming remain limited due to several constraints. Therefore, this study reviews the opportunities and constraints of cluster-based farming in Ethiopia from social, economic, ecological/environmental, institutional, and political perspectives. Methods This study employed a systematic literature review methodology. Relevant studies were identified through digital libraries, web sources, Ethiopian public university repositories, ATA government website and other academic databases. A keyword-based search strategy was used to identify relevant publications mainly covering the period from 2015 to 2026. Based on relevance to study objective, a total of 23 empirical studies were selected and analyzed. Results The findings indicate that cluster-based farming in Ethiopia provides several opportunities across multiple dimensions. Social opportunities include enhanced farmer-to-farmer interaction, knowledge sharing, and collaboration. Economic opportunities involve improved productivity, economies of scale, better market access, and increased bargaining power. Ecological opportunities include improved natural resource management and the potential adoption of climate-smart agricultural practices. Institutional opportunities arise from stronger partnerships and coordination among farmers, government agencies, and development organizations, while political support through national agricultural development strategies further promotes cluster initiatives. However, several constraints also affect the implementation of cluster-based farming. These include farmers’ resistance to collective approaches, limited economies of scale among smallholders, unfavorable agro-ecological conditions, weak institutional coordination, and political instability. Conclusions Cluster-based farming has the potential to transform smallholder agriculture in Ethiopia by improving productivity, commercialization, and rural livelihoods. However, its success depends on addressing key social, economic, ecological, institutional, and political constraints. Recommendation Prioritize should be given to improving rural infrastructure to better connect cluster farms with markets. Expand agricultural research, strengthening farmer training, and securing financial support for cooperatives are also essential. In addition, promoting pro-poor agricultural strategies, extending extension services and ensuring continuous government monitoring and evaluation are necessary to enhance the effectiveness and sustainability of cluster- based farming in Ethiopia.", "oa_url": "https://link.springer.com/content/pdf/10.1186/s40066-026-00634-8.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1186/s40066-026-00634-8.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["smallholder farmers", "Ethiopia", "agricultural commercialization", "agricultural cooperatives", "economies of scale", "market access", "bargaining power", "natural resource management"], "topics": ["Akses & informasi pasar petani", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 55}, {"id": "W7221453292", "doi": "10.3389/fenvs.2026.1869652", "title": "Satellite LiDAR reveals patterns in water table depth and flood risk in SE Asia coastal lowland and peatland plantations", "date": "2026-10-12", "year": "2026", "journal": "Frontiers in Environmental Science", "issn": "2296665X", "publisher": "Frontiers Media", "authors": ["R. Vernimmen", "A. Hooijer"], "abstract": "Agriculture in SE Asian coastal lowlands is vulnerable to inundation and associated crop production loss. Quantifying and managing flood risk, surface subsidence, and carbon emissions (in peatlands) requires an understanding of water table depth patterns and controls, for which no comprehensive data currently exists. Here, we present a dataset of 15,575 measurements of canal water table depth below the soil surface (CWD) in large-scale industrial tree plantations across the islands of Sumatra and Borneo, derived from ICESat-2 satellite LiDAR data. A pronounced relation is evident between CWD and land surface elevation, which applies equally in different regions, both in peatlands and mineral soil areas, and in oil palm as well as Acacia plantations. Mean CWD varies consistently across elevation zones, from −0.6 to −0.85 m for oil palm and Acacia plantations, respectively (i.e., ∼-0.5 – ∼-0.75 m in peat soil) where the surface is 5–9 m above global mean sea level, to ∼ -0.2 m at 1–3 m elevation near mean sea level. The area of industrial plantations in the 1–3 m elevation range alone, which likely has the highest flood risk, is 984,700 ha. Accounting for larger areas of smallholder plantations, and for areas at higher elevations with impeded drainage, the total area of lowland plantations likely experiencing regular flooding could exceed 2.8 million hectares. The close relation with elevation indicates that plantation water levels, especially in lowest-lying areas, are often controlled by landscape drainability conditions rather than management targets, and that optimum water table depths for production and peat loss prevention are not achieved over large areas. We propose that such difficult-to-manage landscape elevation controls on water table depth are considered in yield projections and land use planning, as well as fire and peat carbon emission reduction policies. Unproductive flood-prone plantations as well as peatlands with very low water tables may be logical priority targets for restoration planning.", "oa_url": "https://www.frontiersin.org/journals/environmental-science/articles/10.3389/fenvs.2026.1869652/pdf", "pdf_url": "https://www.frontiersin.org/journals/environmental-science/articles/10.3389/fenvs.2026.1869652/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["water table depth", "flood risk", "peatlands", "oil palm plantations", "acacia plantations", "terrain elevation", "land subsidence", "drainage conditions"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 52}, {"id": "W7221536688", "doi": "10.1016/j.jrurstud.2026.104458", "title": "Farming under fire: Conflict, displacement, and the collapse of food security in south Lebanon", "date": "2026-10-12", "year": "2026", "journal": "Journal of Rural Studies", "issn": "07430167", "publisher": "Elsevier BV", "authors": ["Yasmine Fakhry", "Jasmin Lilian Diab", "Hussein F. Hassan"], "abstract": "Context Lebanon's agricultural sector and food systems are facing unprecedented pressures amid overlapping crises: economic collapse, climate change, and the 2023-2025 armed conflict with Israel. Objective This paper investigates the compounded impact of conflict-induced displacement and climate stress on rural livelihoods, agricultural productivity, and food security in South Lebanon-an area marked by strategic agricultural value and climate vulnerability. Methods Drawing on 29 in-depth interviews with displaced farmers, cooperative leaders, and food producers from conflict-affected areas such as Marjayoun, Nabatieh, and Bint Jbeil, this qualitative study uncovers key disruptions in agricultural infrastructure, local markets, and household food access. Interview findings are also triangulated with published secondary quantitative data (IPC, FAO, WFP, and World Bank assessments). Results and conclusion s: The findings reveal how displacement led to the abandonment of farms, loss of livestock, contamination of crops, and collapse of cooperative models, exacerbating existing economic and climate stressors like currency depreciation, water scarcity, unpredictable rainfall, and reduced yields. Gendered impacts, informal solidarity mechanisms, and persistent energy and input shortages emerged as critical themes. The study highlights the urgent need for an integrated recovery strategy focused on smart irrigation, climate-resilient crops, market reintegration, and financial support for smallholders. The analysis is guided by a conceptual framework that treats conflict-induced displacement and climate stress as interlocking drivers of livelihood erosion, market collapse, and food and nutrition insecurity, with gendered and refugee-specific vulnerabilities at the core. Significance As Lebanon faces a worsening food insecurity crisis, with 1.17 million people in IPC Phase 3 or higher, rebuilding agriculture is no longer a developmental luxury but an existential necessity for national food security.", "oa_url": "https://doi.org/10.1016/j.jrurstud.2026.104458", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["conflict", "displacement", "food security", "agricultural livelihoods", "South Lebanon", "civil war", "rural livelihoods"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 51}, {"id": "W7221512407", "doi": "10.1186/s40100-026-00526-2", "title": "Local traditions, customary institutions and agricultural downstreaming in Agrarian communities of Prabumulih, South Sumatra", "date": "2026-10-12", "year": "2026", "journal": "Agricultural and Food Economics", "issn": "21937532", "publisher": "Springer Nature", "authors": ["Rudy Kurniawan", "M Chairul Basrun Umanailo", "Muhammad Arsyad", "Pardamean Daulay"], "abstract": "Abstract This study examines how local traditions and customary institutions shape agricultural downstreaming in agrarian communities of Prabumulih City, South Sumatra. While downstreaming is often promoted as a strategy for value addition, market integration, and rural income improvement, empirical evidence on how sociocultural institutions mediate farmers’ capacity to adapt to these transformations remains limited. Using a qualitative case-study approach, this research collected data through in-depth interviews with 20 informants, participatory observation, and document analysis across five villages (Karya Mulya, Karang Jaya, Tanjung Telang, Muara Sungai, and Pangku) with strong agricultural potential. Data were coded and analysed thematically using QDA Miner 6, guided by Social Capital, Institutional, and Value-Chain Theory. The findings indicate that successful downstreaming depends on the comprehensive integration of production, distribution, and marketing, which local traditions, customary institutions, and cross-actor coordination strongly mediate. However, challenges persist in tripartite collaboration, where government support remains insufficiently integrated with local institutional arrangements, and gaps in market access constrain the economic resilience of farming households. The study contributes to agrarian sociology by demonstrating that downstreaming should not be treated solely as a technical or market-based intervention, but as a sociocultural process requiring institutional alignment, trust-based coordination, and context-sensitive policy support.", "oa_url": "https://link.springer.com/content/pdf/10.1186/s40100-026-00526-2.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1186/s40100-026-00526-2.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["local traditions", "customary institutions", "agrarian communities", "value chain", "social capital", "institutional theory", "value chain theory", "market access"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7221561505", "doi": "10.3390/ruminants6040088", "title": "Harnessing Dairy Goats for Food Security and Climate Resilience in Sub-Saharan Africa: An Interdisciplinary Review of Nutrition, Genomics, and Policy Pathways", "date": "2026-10-12", "year": "2026", "journal": "Ruminants", "issn": "2673933X", "publisher": "", "authors": ["Oludayo Michael Akinsola", "Oladeji Bamidele", "Akeem Babatunde Sikiru", "Jamiu Oyewole Omirinde", "Abdulmojeed Yakubu", "Malarmathi Muthusamy", "Chitra Ramasamy", "Abdulraheem Arome Musa", "Aranganoor Kannan Thiruvenkadan"], "abstract": "Dairy goats offer significant potential to enhance food security, promote climate resilience, and improve rural livelihoods in sub-Saharan Africa (SSA), particularly within women-led smallholder farming systems. This interdisciplinary narrative review integrates findings from nutritional science, climate adaptation studies, recent genomic innovations, and policy analyses (2010–2025) to critically evaluate dairy goats’ roles in addressing persistent malnutrition and vulnerability to climate extremes. Goat milk provides vital macronutrients and micronutrients and can contribute to improved dietary adequacy. Compared with larger ruminants such as cattle, goats—particularly indigenous and locally adapted populations—often exhibit greater tolerance to heat stress, flexible browsing behaviour, and lower water requirements. However, these adaptive advantages vary widely among dairy goat breeds, with high-yielding temperate breeds generally showing lower resilience to climatic extremes than indigenous SSA ecotypes. In addition, the per-kg GHG emissions for goat milk are typically higher than those for bovine milk, although system-level benefits may emerge in drylands where goats fit local heat/feed constraints and where species mix and management differ substantially. Recent genomic advancements, notably genome-wide association studies and selection signature analyses, have identified candidate loci for thermotolerance, disease resistance, and milk yield. Near-term improvement is most plausible where breeding is anchored in community-based programmes supported by minimal identification and phenotyping, with marker use most defensible when validated within target populations. Despite emerging opportunities through microfinance and climate finance, especially for women-centric cooperatives, dairy goats remain underrepresented in national livestock and climate policies, and life cycle assessment data to support formal carbon–credit integration are limited. We therefore recommend dedicated funding to goat-specific extension and animal health, targeted gender-inclusive training, strategic investments in genomic and data infrastructure, and enhanced data collection for carbon accounting. Overall, the evidence synthesised here indicates that scalable dairy goat development in SSA is unlikely without the coordinated implementation of climate-smart management and delivery systems (animal identification and core recording), alongside context-validated genomic approaches (e.g., MAS or genomic prediction integrated within community-based breeding where reference resources and phenotypes exist) and targeted policy and financing.", "oa_url": "https://doi.org/10.3390/ruminants6040088", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["dairy goats", "food security", "climate resilience", "sub-Saharan Africa", "malnutrition", "heat tolerance", "indigenous goat breeds", "disease resistance"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7221532637", "doi": "10.3390/world7100171", "title": "Patterns of Value Chain Participation and the Commercialisation of Underutilised Leafy Vegetables: Evidence from Sekhukhune District, South Africa", "date": "2026-10-12", "year": "2026", "journal": "World", "issn": "26734060", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Mishal Trevor Morepje", "Oladimeji Idowu Oladele", "Siphe Zantsi"], "abstract": "Indigenous and underutilised leafy vegetables (ULVs) can contribute to rural livelihoods and food security, yet household participation in their production, consumption, and marketing varies substantially. This study developed a typology of ULV farmers and examined factors associated with market orientation in Sekhukhune District, South Africa. Primary data were collected through a structured questionnaire administered to 266 farmers. Production Participation Scores (PPS), Marketing Participation Scores (MPS), Consumption Participation Scores (CPS), and an Extension Service Index (ESI) were constructed from standardised indicators. Ward’s hierarchical clustering identified farmer typologies, with k-means clustering used as a sensitivity check. Cluster differences were assessed using ANOVA and Tukey’s post hoc tests, while Spearman correlations and Firth’s penalised logistic regression examined associations and predictors of market orientation. Three typologies were identified: Low-Engagement Farmers (34.4%), Subsistence-Oriented Farmers (36.8%), and Market-Oriented Farmers (28.9%). The solution showed good stability (bootstrap mean ARI = 0.785) and substantial agreement between hierarchical and k-means clustering (ARI = 0.734; 90.1% agreement). Market-Oriented and Subsistence-Oriented Farmers did not differ significantly in production (p = 0.954) or consumption participation (p = 0.988) but differed in marketing participation (p < 0.001). Market access was the only significant predictor of market orientation (OR = 18.81, 95% CI: 7.34–48.25, p < 0.001). Strengthening market access may enhance ULV commercialisation.", "oa_url": "https://doi.org/10.3390/world7100171", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["value chain participation", "commercialization", "farmer typology", "market orientation", "market access", "subsistence farming", "agricultural extension", "indigenous vegetables"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 39}, {"id": "W7221574922", "doi": "10.1186/s42779-026-00335-4", "title": "Traditional preservation practices of asala fish (Schizothorax spp.) among Himalayan communities of Darjeeling, India", "date": "2026-10-12", "year": "2026", "journal": "Journal of Ethnic Foods", "issn": "23526181", "publisher": "BioMed Central", "authors": ["Priya Chakraborty", "Aramvha Chowhan", "Kriti Ghatani"], "abstract": "Abstract Traditional fish preservation practices are an important part of the cultural heritage and food systems of the Darjeeling Himalayas. In this study, the traditional methods used by local communities to preserve asala fish ( Schizothorax spp.) have been documented. Data were collected from the 50 respondents over the age of 18 including fish farmers, hatchery operators, fish processors, traders, and household members engaged in fish production, preservation, and marketing. Structured questionnaires, in-person interviews, direct field observations, and photograph were used to collect the data. Snowball and purposeful sampling methods were employed to find respondents with relevant knowledge and experience. According to this study, drying, wrapping in banana pseudostem (BPS) and fermentation are the main steps in the traditional asala fish preservation process. Among these methods, drying was the most frequently used preservation technique. The duration of preservation varied depending on the method used and local storage conditions. Wrapping in BPS is a unique and locally distinctive preservation practice that helps maintain moisture balance. According to local practitioners, these methods reduce spoilage and allow temporary storage of fish products without refrigeration. The findings demonstrate the importance of indigenous knowledge in preserving fish, reducing post-harvest losses, and supporting household food security. Documentation of these traditional practices contributes to the conservation of the local cultural heritage and provides baseline information for future research on sustainable fish preservation and management of fish resources in the Dhajea Tea Garden of Darjeeling Himalaya.", "oa_url": "https://link.springer.com/content/pdf/10.1186/s42779-026-00335-4.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1186/s42779-026-00335-4.pdf", "oa_status": "diamond", "cited_by": 0, "keywords": ["Schizothorax", "Himalayan communities", "Darjeeling", "indigenous knowledge", "fish drying", "fermentation", "post-harvest losses", "food security"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 30}, {"id": "W7221504017", "doi": "10.1007/s43621-026-04965-1", "title": "Determinants of communities’ adoption and practice of soil and water conservation measures in the Jema Watershed, in the highlands of northwestern Ethiopia", "date": "2026-10-12", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Ayalneh Yedem Fentie", "Yismaw Assefa"], "abstract": "Natural resource degradation is a major environmental challenge that threatens ecosystem stability and rural livelihoods, particularly in developing countries such as Ethiopia. Although soil and water conservation (SWC) interventions have been widely promoted, their adoption and implementation remain limited. This study aimed to identify the key factors influencing the adoption and implementation of SWC practices. To achieve this, a household survey and key informant interviews were used. The respondents’ knowledge was measured using yes/no items, while perceptions and practices were measured using five-point Likert-scale items. The composite and mean score values were calculated, and the result values were categorized using predefined score intervals such as very low to very high. To assess the community’s perception, knowledge, and practice on SWC and to identify the key factors, correlation and multiple linear regression analysis were employed. The findings indicate that the majority of respondents achieved composite awareness and perception scores corresponding to the ‘good’ category (50–75% of the maximum attainable score), based on the predefined classification criteria. The correlation analysis indicates a strong correlation between community knowledge and perception ( r = 0.64, p < 0.05), knowledge and practice ( r = 0.83, p < 0.05), and perception and practice ( r = 0.69, p < 0.05) in the study area. The multiple regression results showed that access to training (β = 0.620), knowledge (β = 0.496), source of information (β = 0.416), and extension services (β = 0.336) were the most influential positive factors affecting SWC adoption. Perception also had a positive, though smaller effect (β = 0.108). In contrast, land tenure insecurity (β = -0.109), along with factors such as small farm size and greater distance to farmland, negatively affected the adoption of SWC practices. Overall, the study highlights that strengthening institutional support, improving access to training and information, enhancing extension services, and ensuring land tenure security are essential to promote sustainable adoption of SWC practices.", "oa_url": "https://doi.org/10.1007/s43621-026-04965-1", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["soil and water conservation", "technology adoption", "community perceptions", "farmer knowledge", "agricultural extension", "access to training", "land tenure insecurity", "small farm size"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7221536273", "doi": "10.1371/journal.pclm.0000886", "title": "How much climate-smart agriculture is enough? A dose-response analysis of technology adoption effects on farmer welfare in Ghana", "date": "2026-10-12", "year": "2026", "journal": "PLOS Climate", "issn": "27673200", "publisher": "Public Library of Science", "authors": ["Stephen Prah", "John N. Ng’ombe", "Bright Owusu Asante", "Jonathan Masasi"], "abstract": "Climate-smart agricultural technologies (CSAT) are promoted to enhance agricultural productivity and strengthen resilience to climate change. However, limited empirical evidence exists on the effects of adoption intensity, particularly when farmers adopt multiple technologies simultaneously. This study examines the effects of CSAT adoption intensity on maize yield and household asset accumulation in Ghana using survey data from 2,151 maize farmers. A dose–response model with Heckman selection is applied to address potential selection bias and estimate the causal effects of varying adoption levels. The findings show that farmers’ education, access to credit, extension services, and perceived drought significantly influence both the likelihood and intensity of CSAT adoption. Results reveal a U-shaped relationship between CSAT adoption intensity and maize yield, where yields initially decline but increase as adoption intensity rises. On average, higher CSAT adoption is associated with a 21% increase in maize yield. Similarly, CSAT intensity shows a nonlinear positive relationship with household asset accumulation, with an average 19.5% increase in assets. The results also indicate heterogeneous effects across farmers. Overall, higher CSAT adoption improves agricultural productivity and long-term household welfare, highlighting the need to strengthen extension services, expand credit access, and raise climate risk awareness to promote sustainable agricultural development.", "oa_url": "https://journals.plos.org/climate/article/file?id=10.1371/journal.pclm.0000886&type=printable", "pdf_url": "https://journals.plos.org/climate/article/file?id=10.1371/journal.pclm.0000886&type=printable", "oa_status": "gold", "cited_by": 0, "keywords": ["climate-smart agriculture", "maize yield", "household asset accumulation", "farmer welfare", "dose-response modeling", "agricultural extension", "access to credit", "drought perception"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 15}, {"id": "W7221451322", "doi": "10.3389/fsufs.2026.1942316", "title": "Joint determination of factors influencing adoption of climate smart agricultural practices in modern rice production in Southwest Bangladesh: a multivariate probit approach", "date": "2026-10-11", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Basanta Kumar Barmon", "Ehsanur Rauf Prince", "Sanzidur Rahman"], "abstract": "Climate change and environmental degradation are increasingly threatening rice production in the coastal regions of the developing world, where the goals of raising productivity and building resilience became a joint priority. Climate smart agriculture offers a portfolio of practices that serve both goals, yet knowledge on how farmers in saline rice systems combine these practices, and why adoption remains often partial, is still limited. This study jointly examines the factors associated with the adoption of five common climate smart practices (i.e., crop diversification, agroforestry, integrated soil fertility management, small scale irrigation, and integrated pest management) among modern rice farmers in southwest Bangladesh, using a multivariate probit model. The analysis draws on 493 farm households randomly selected from complete household lists in three purposively selected villages, one in each of three districts spanning the region’s salinity gradient. Results show that adoption decisions are interdependent, and most households maintain a portfolio of three or four practices. Soil improving practices complement one another, whereas small scale irrigation substitutes for diversification and soil and pest management. Education, farm size, livestock ownership, and climatic exposure are associated with specific individual practices, while access to credit, extension services, and market information are associated with adoption across the portfolio. The findings highlight the important roles of institutional access and climate-related factors in the adoption of climate smart agricultural practices, particularly advisory services, credit access, and support for investment-intensive practices.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1942316/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1942316/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["climate-smart agriculture", "rice production", "adoption factors", "crop diversification", "agroforestry", "integrated soil fertility management", "small-scale irrigation", "integrated pest management"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 42}, {"id": "W7221333092", "doi": "10.1016/j.agsy.2026.105004", "title": "A systems-oriented framework for wise, equitable, and sustainable digital agricultural transformation in sub-Saharan Africa: A critical review", "date": "2026-10-10", "year": "2026", "journal": "Agricultural Systems", "issn": "0308521X", "publisher": "Elsevier BV", "authors": ["Kibrom T. Sibhatu", "Maurice Tschopp", "Nicole Harari"], "abstract": "CONTEXT Sub-Saharan Africa (SSA) faces mounting food security pressures amidst accelerating digital agricultural investment. Digital agricultural solutions in the region are growing rapidly, yet adoption remains uneven, often excluding women, resource-constrained smallholders, and remote rural communities. The prevailing ‘smart farming’ paradigm, which prioritizes technological optimization, has often failed to account for the structural, institutional, and social conditions that determine whether digital tools deliver durable outcomes. OBJECTIVE In this study, we argue that digital agricultural transformation in SSA requires fundamental reorientation, moving from technology-centric deployment to systems-oriented integration. We aim to operationalize the emerging concept of wise agricultural systems for the SSA context and to develop a framework that can guide more equitable, sustainable, and resilient digital agricultural transformation. METHODS We employ a critical narrative review, organizing the literature into five thematic strands covering digital advisory services and adoption, infrastructure, gender and equity, environmental sustainability, and data governance. Within each strand, we critically assess the evidence, examining underlying assumptions, identifying contradictions, and assessing where evidence is robust or remains limited. We use the wise agricultural systems concept and the Socio-Cyber-Physical System (SCPS) lens to organize our analytical structures. RESULTS We demonstrate that the primary barriers to effective digital agricultural transformation in SSA are systemic rather than technical. These barriers include weak rural road and connectivity infrastructure, fragmented, outdated, and non-interoperable public agricultural data resources, erosion of farmer trust through extractive platform design, institutional capacity deficits in extension and regulatory systems, a persistent gender digital divide affecting approximately half of SSA's smallholder farming population. These challenges are compounded by extractive platform designs that can erode farmer trust and data governance arrangements that concentrate value in corporate actors at the expense of farming communities. Digital tools that have generated durable benefits share common features, including proximity to farmer realities in design, integration with human advisory systems, and embedding within functional institutional arrangements. Drawing on these findings, we propose a four-component framework for wise digital agricultural transformation comprising ground-level integration, institutional infrastructure, equitable governance, and adaptive learning. CONCLUSIONS Wise digital agricultural systems in SSA are defined not by technological sophistication but by their demonstrated capacity to achieve balanced, resilient performance across socioeconomic viability, environmental sustainability, and social justice. Achieving this requires investment in the non-digital foundations of effective digital agriculture, including physical infrastructure, extension capacity, and data governance, and genuine participation of smallholder farmers in system design. SIGNIFICANCE In the study, we make a conceptual contribution by operationalizing the wise agricultural systems framework for SSA and by demonstrating that the persistent gap between digital agricultural promise and rural reality is a systemic rather than a technological problem. The proposed four-component framework offers actionable guidance for researchers, policymakers, development finance institutions, and platform designers seeking to redirect digital agricultural investment toward systems that serve people, sustainability, and justice.", "oa_url": "https://doi.org/10.1016/j.agsy.2026.105004", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["sustainable agriculture", "sub-Saharan Africa", "agricultural digitalization"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 55}, {"id": "W7221534353", "doi": "10.22037/afb.v13i1.53088", "title": "The Genus Weissella: A Review of its Antimicrobial Potentials, Functional Characteristics and Uses in Food Biopreservation", "date": "2026-10-10", "year": "2026", "journal": "Applied food biotechnology", "issn": "23455357", "publisher": "Shahid Behehsti University of Medical Sciences", "authors": ["Ghadeer Al-Nehmi", "Amira Al-Harethi"], "abstract": "Background and Aim: Heterofermentative lactic acid bacteria belonging to the Genus Weissella possess unique metabolic capabilities with distinct value for natural food preservation. This review has synthesized current insights into the physiological characteristics, antibacterial pathways and antifungal mechanisms of Weissella species, with their practical uses within diverse food systems and safety problems restricting their commercial adoption. Material and Methods: A comprehensive literature search was carried out using PubMed, Scopus, Web of Science and Google Scholar for peer-reviewed literature published up to June 2026. The review covered Weissella taxonomy, ecological distribution, functional characteristics, antimicrobial activities and mechanisms, food biopreservation and biosafety. Relevant literature was critically screened and synthesized based on strain characteristics, bioactive metabolites, mechanisms of action, food-matrix uses, preservation outcomes and safety considerations. Results and Conclusion: The reviewed studies have indicated that Weissella shows strain-dependent antimicrobial activity mediated by multiple compounds, including organic acids, volatile organic compounds, bacteriocins and exopolysaccharides. These factors can inhibit foodborne and spoilage microorganisms through acidification, metabolic disruption and damage to fungal membranes and hyphae, with strains showing potentials for aflatoxin B1 adsorption. Antimicrobial effects have been reported against several bacterial and fungal pathogens, while food-model studies demonstrate decreases in microbial load and delayed visible spoilage in various food matrices. However, these effects cannot be generalized within Weissella because antimicrobial production, technological characteristics and safety characteristics differ within the strains. Therefore, further strain-specific safety assessment, standardized efficacy assessment, mechanistic studies and pilot and industrial-scale validation are needed before reliable use of Weissella-based biopreservation systems. INTRODUCTION Filamentous fungi are some of the most persistent and economically significant sources of food contamination in the global food supply chain. Fungal colonization within staple supplies such as dairy, cereals, grains and fresh produce causes progressive degradation of organoleptic characteristics, nutritional value and market acceptability [1,2]. Therefore, fungal contamination poses a significant challenge to the food industry compromising safety and quality of food products [3]. In addition to physical deterioration, filamentous fungi synthesize mycotoxins that represent critical biological hazards in foods. While ingestion of contaminated supplies triggers acute toxicosis [4], chronic dietary exposure is linked to severe long-term health consequences, including developmental delays and nutritional impairment in early childhood [5]. Foodborne diseases are still a major global public health concern, with the World Health Organization (WHO) estimating that approximately 866 million people were ill and 1.52 million died from foodborne diseases worldwide in 2021 [6]. Furthermore, fungal contamination and mycotoxin occurrence pose substantial challenges throughout the global food supply chain. Eskola et al. estimated that mycotoxins were detectable in up to 60–80% of food-crop samples, indicating that contamination at detectable levels is substantially more widespread than estimates based on regulatory exceedances alone [7]. Fresh fruits and vegetables are particularly susceptible to fungal deterioration during postharvest handling, storage and distribution. Despite advances in agricultural production and postharvest management, fungal diseases are still major constraints to food security because they decrease product quality, shorten storage life and decrease market value [8]. Postharvest vulnerability is further heightened in tropical and subtropical climates, where increased ambient temperatures and relative humidity accelerate fungal proliferation. Highly perishable climacteric fruits such as mango, banana, strawberry, pineapple and papaya are susceptible to contamination by Botrytis cinerea, Penicillium expansum, Colletotrichum species and Rhizopus stolonifer during handling, transport and storage [9,10]. These pathogens typically enter host tissues via physical wounds or natural openings, rapidly colonizing plant tissues and driving severe postharvest decay and economic loss [11]. Species within Aspergillus and Penicillium represent critical postharvest threats because they merge aggressive spoilage capability with potent mycotoxin synthesis [2], positioning fungal contamination as food security and public health concern. Adequate consumption of fruits and vegetables is an important component of a healthy diet. For example, WHO links insufficient fruit and vegetable intake to nearly 19% of gastrointestinal cancer deaths, nearly 31% of ischaemic heart disease deaths and nearly 11% of stroke deaths [12]. Nevertheless, postharvest preservation is still challenging because physiological processes associated with maturation and postharvest deterioration continue after harvest [13]. Quality retention is further compromised by transpiration-driven water loss, tissue senescence and opportunistic bacterial (Pseudomonas spp.) or fungal infections (Fusarium spp., Alternaria alternata and C. gloeosporioides), which routinely damage high-value crops such as tomatoes and avocados [9,11]. To lessen postharvest deterioration, conventional food preservation depends on physical treatments, modified atmosphere packaging and chemical additives such as sorbates, benzoates, propionates, ethanol and ethylenediaminetetraacetic acid (EDTA). While these methods enhance microbial stability and extend shelf life, their long-term reliance faces increasing studies [14]. Nevertheless, exposure to chemical and biological preservatives can induce microbial stress responses and may contribute to the development of preservative-tolerant or antimicrobial-resistant microbial strains [15]. In contrast, physical preservation technologies may need substantial capital costs and potential degradation of organoleptic and nutritional quality [16]. These constraints have driven research to sustainable, natural preservation alternatives that balance broad-spectrum antimicrobial efficacy with consumer safety expectations [17]. Biopreservation uses beneficial microorganisms or their metabolites to suppress pathogens and spoilage organisms while preserving food quality. Compared with conventional chemical preservatives, this approach includes clean-label demand, although efficacy depends strongly on the food matrix, target organism and use conditions [18–20]. Lactic acid bacteria (LAB) are widely identified as promising biopreservative microorganisms due to their long-standing use in food fermentation and their ability to produce a range of antimicrobial and functional metabolites, including organic acids, bacteriocins, hydrogen peroxide and exopolysaccharides (EPS) [17,21]. Nevertheless, these characteristics are not necessarily shared by all Weissella strains, as their functional characteristics can vary significantly at the strain level. Although Weissella has been discussed in relation to taxonomy, fermentation and probiotic potential, the evidence connecting strain-level taxonomy, metabolite-mediated antibacterial and antifungal mechanisms, practical food uses and regulatory safety is still fragmented. This review has addressed that gap by integrating recent taxonomic developments including the separation of Periweissella with mechanistic evidence and use outcomes within fresh produce, bakery products and cereal matrices. Its novelty depends on extending previous Weissella-focused reviews by providing a strain-conscious framework that links antimicrobial metabolites and mechanisms of action with matrix-specific efficacy, biosafety considerations and experimental evidence needed for further use and regulatory translation [22,23]. Accordingly, this review has assessed the taxonomy, ecological distribution, physiological and functional attributes, antimicrobial mechanisms, biopreservation performance and biosafety of Weissella, with particular emphasis on antifungal efficacy and the requirements for safe, scalable, clean-label food preservation. As shown in Figure 1, the food biopreservation potential of Weissella should be assessed through an integrated strain-level framework that addresses taxonomy, ecology, bioactive metabolites, antimicrobial activity, practical preservation outcomes and safety requirements. MATERIALS AND METHODS 2.1. Literature Search Strategy To investigate the biotechnological landscape of Weissella, a comprehensive literature search was carried out using PubMed, Scopus, Web of Science and Google Scholar for relevant literature published up to June 2026. The retrieval strategy targeted peer-reviewed studies investigating Weissella taxonomy, ecological niches, functional characteristics, antimicrobial mechanisms, food preservation trials and biosafety assessments. The retrieval strategy combined controlled vocabulary and keyword terms, including Weissella, Weissella cibaria, Weissella confusa, \"bacteriocins\", \"weissellicins\", \"antimicrobial activity\", \"antifungal activity\", \"biopreservation\", \"lactic acid bacteria\", \"EPS\", \"postharvest diseases\", \"volatile organic compounds\" and \"mycotoxins\". Terms were linked using Boolean logic (AND/OR) and reference lists of retrieved articles were manually screened to capture additional eligible studies. 2.2. Study Selection Relevant peer-reviewed research articles, review articles and authoritative taxonomic resources were addressed. Non-peer-reviewed reports, conference abstracts, editorials and duplicate publications were excluded. Relevant studies addressed key facets of Weissella biology, including taxonomy, ecological distributio", "oa_url": "https://journals.sbmu.ac.ir/afb/article/download/53088/38115", "pdf_url": "https://journals.sbmu.ac.ir/afb/article/download/53088/38115", "oa_status": "gold", "cited_by": 0, "keywords": ["Weissella", "food biopreservation", "antimicrobial activity", "heterofermentative lactic acid bacteria", "bacteriocins", "exopolysaccharides", "volatile organic compounds", "organic acids"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7221343165", "doi": "10.1007/s43621-026-04967-z", "title": "Assessing climate change perceptions and climate-smart agriculture adoption among root, tuber and banana farmers in Eastern D.R. Congo", "date": "2026-10-10", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Jacques B. Kihye", "Jean Mubalama Mondo", "Géant Basimine Chuma", "Gilbert Mubalama Mugisho", "J. G. Majaliwa", "Katcho Karume"], "abstract": "Perceptions shape human practices, including agricultural decisions, yet their influence on climate-smart agriculture adoption remains insufficiently understood in climate-vulnerable eastern Democratic Republic of Congo (DRC). This study compared farmers’ perceptions of climate change with empirical climate data of the past three decades across South-Kivu’s agroecological zones (AEZ), eastern DRC. It further assessed climate-smart agriculture (CSA) practices being used by smallholder root, tuber, and banana (RTB) farmers and factors driving their adoption. Data on climate change perception and drivers of CSA adoption was collected from 407 smallholder RTB farmers, selected through a multistage stratified random sampling, while climate data trends of the past three decades (1989–2024) were assessed using RClimDex 1.9. Farmers perceived increase in floods, drought, rainfall, wind speed, and lightning regardless of AEZ, though weather data could only confirm significant increase in rainfall. The study identified 24 CSA practices being used in RTB-based production systems, with varying adoption rates and drivers. Generally, farmer location, access to information and communication technologies (ICTs), and crop had the most significant effects on CSA adoption regardless of the practice. The findings, supported by both observed climate records and farmers’ perceptions, indicate that climate parameters are changing in eastern DRC and may adversely affect RTB production systems, although the perceived magnitude of these changes does not always correspond with observed trends. Therefore, there is need for context-specific interventions to foster a sustainable transition toward climate-smart RTB production systems, building upon and scaling up practices that are already adopted by smallholders.", "oa_url": "https://doi.org/10.1007/s43621-026-04967-z", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["climate change perception", "climate-smart agriculture", "smallholder farmers", "eastern Democratic Republic of the Congo", "climate change adaptation"], "topics": ["Adopsi teknologi & pertanian digital", "Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7221332696", "doi": "10.3390/suschem7040060", "title": "Integrated Conversion of Coconut and Palm Oils into Bio-Based Chemicals via Hydrolysis and Kolbe Electrolysis", "date": "2026-10-10", "year": "2026", "journal": "Sustainable Chemistry", "issn": "26734079", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Haroon ahmad", "Renato Pelosato", "Grazia Isa C. Righetti", "Isabella Natali Sora"], "abstract": "This study presents an integrated two-step synthetic protocol for the conversion of coconut and palm oils into high-value bio-based hydrocarbons, alcohols, and aldehydes. The process employs alkaline hydrolysis followed by Kolbe electrolysis. Under reflux in an EtOH-KOH system, both oils were quantitatively converted into their constituent fatty acid mixtures (C16–C18:1 for palm oil and C8–C18:1 for coconut oil) with yields up to 88% and 92%, respectively. The resulting intermediates were characterized via GC–MS. Subsequently, galvanostatic Kolbe electrolysis (100 mA) was performed using custom platinum electrodes in binary and ternary solvent systems. High substrate conversions (>86%) were obtained, and the organic product distribution reached up to 73% and 74% relative hydrocarbon selectivity for palm and coconut oil derivatives, respectively, in a ternary MeOH/EtOH/H2O system. However, operating under excess charge yielded isolated hydrocarbon mass yields of 8–20% (with up to 18% Kolbe dimers) alongside medium- and long-chain alcohols and aldehydes. This integrated protocol demonstrates a scalable and tunable route for converting vegetable oils into high-purity bio-based chemicals.", "oa_url": "https://doi.org/10.3390/suschem7040060", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["coconut oil", "palm oil", "Kolbe electrolysis", "alkaline hydrolysis", "fatty acid conversion", "galvanostatic electrolysis", "platinum electrode", "solvent effects"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 31}, {"id": "W7221339938", "doi": "10.1186/s12870-026-10040-8", "title": "AgroNLP-SimAssist: a multilingual transformer-based decision support simulator for crop disease diagnosis, advisory generation, and market intelligence", "date": "2026-10-10", "year": "2026", "journal": "BMC Plant Biology", "issn": "14712229", "publisher": "BioMed Central", "authors": ["Priya Thirugnanam", "Sandeep Kumar Mathivanan", "Sundara Kumar M R", "Sangeetha Ramaswamy", "Shruthi T S", "Sangeetha S.K.B"], "abstract": "Abstract There are three major shortcomings of agricultural NLP and need addressing, regardless of the recent developments in the field: (i) use of proprietary or small-scale datasets that affect reproducibility; (ii) one-task models that only focus on intent recognition but lack integration for crop disease diagnosis, advice, and market information; and (iii) the absence of simulators for evaluating the system’s performance during actual deployment. The application of precision agriculture is constrained by limitations in diverse farming environments. The study introduces AgroNLP-SimAssist, which represents a unified multilingual transformer architecture augmented by an easily deployable agricultural decision support simulator, as the proposed solution to overcome the challenges. The five major components constituting the proposed framework are: (1) domain-specific multilingual transformer embedding; (2) data collection and cleaning from publicly available agricultural datasets; (3) multiple prediction tasks including trend price estimation, crop disease detection, and advisory recommendation; (4) SHAP value explainability for expert validation; and (5) advisory simulation engine for evaluating latency and scalability. Multilingually available data sources, which include multilingual agricultural reports from the FAO organization, crop-disease descriptions from the PlantVillage knowledge base, and price-market narratives from the Agmarknet website, have been used for training and validation purposes. Among the 3,200 multilingual farmer queries dataset (in English, Hindi, and Kannada), there was an assignment of 70%, 15%, and 15% to the training, validation, and testing sets, respectively. In terms of accuracy compared to the existing classifiers, results from experiments yielded 96.1% disease classification, 94.3% advisory relevance, and 92.7% named entity recognition with F1-measure. The simulation system scaled up to 10,000 concurrent users with an inference latency of 0.35 s/query. The proposed data-driven AgroNLP-SimAssist framework facilitates extension services and precision agriculture through providing a scalable, reproducible, and interpretable solution for intelligent agricultural advisory systems.", "oa_url": "https://doi.org/10.1186/s12870-026-10040-8", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["agricultural decision support", "crop disease detection", "multilingual transformer models", "named entity recognition", "SHAP", "precision agriculture", "simulation engine", "reproducibility"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 25}, {"id": "W7221359395", "doi": "10.3390/horticulturae12101258", "title": "Comparative Metabolome Analysis Reveals That MaOPR1 Is a Key Modulator of the Response to Banana Fusarium Wilt", "date": "2026-10-10", "year": "2026", "journal": "Horticulturae", "issn": "23117524", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Jingfang Shi", "Bin Liu", "Xueyi Xie", "Menghao Li", "Yaoyao Li", "Fangcheng Bi", "Qizong Liang", "Rongshang Mai", "Ganjun Yi", "Tongxin Dou"], "abstract": "Background: Banana Fusarium wilt inflicts enormous economic losses on global banana production; however, effective control strategies remain elusive. We previously demonstrated that overexpression of plantain (Musa paradisiaca) ICE1 (MpICE1) significantly enhances banana resistance to Fusarium wilt. This study aimed to screen and identify key resistance genes associated with banana Fusarium wilt resistance and further explore their molecular functions and regulatory mechanisms, so as to provide a solid theoretical basis for the genetic breeding and disease resistance improvement of banana. Methods: Based on our previous transcriptomic dataset and the current metabolomic analysis, we identified a key gene encoding 12-oxo-phytodienoic acid reductase, MaOPR1, involved in the linoleic acid metabolism pathway, and functionally validated its role via dsRNA-mediated gene silencing. Results: Silencing of MaOPR1 alleviated banana leaf-lesion response after Fusarium wilt. Conclusions: Integrating metabolomic and dsRNA-silencing evidence, MaOPR1 acts as a negative regulator of banana Fusarium wilt resistance, associated with alpha-linolenic acid metabolic reprogramming in the MpICE1-overexpressing background.", "oa_url": "https://doi.org/10.3390/horticulturae12101258", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["Fusarium wilt of banana", "linoleic acid metabolism", "plant disease resistance", "gene silencing", "metabolomics"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7221070841", "doi": "10.3389/fhort.2026.1941588", "title": "Performance of smooth cayenne pineapple under tropical conditions: unravelling effects of postharvest duration and ripening stage", "date": "2026-10-09", "year": "2026", "journal": "Frontiers in Horticulture", "issn": "28133595", "publisher": "Frontiers Media", "authors": ["Kalolaini Koto Colaitiniyara", "Shamal Shasang Kumar", "Owais Ali Wani", "Savenaca Cuquma", "Mohammadi Begum Jeelani", "Nouf Abdulrahman Alqahtani", "Qasem Al-mdallal"], "abstract": "Introduction Optimizing harvest maturity and postharvest handling is important for maintaining pineapple quality and reducing losses under tropical storage conditions. However, limited information is available on how ripening stage at harvest interacts with postharvest storage duration to influence physical and quality characteristics of Smooth Cayenne pineapple under ambient conditions in Fiji. Methods This study evaluated the effects of four ripening stages and postharvest storage duration on fruit weight, crown weight, fruit dimensions, and °Brix of Ananas comosus (Smooth Cayenne) pineapple stored under ambient conditions at 27 ± 2 °C and 85 ± 5% RH. Forty fruits were assigned to four ripening stages: S1 (25%), S2 (50%), S3 (75%), and S4 (100%), with 10 fruits per stage. The same fruits were repeatedly evaluated from Day 0 to Day 14. Although the estimated shelf life of some treatments ended by Day 5, observations were continued to document the progression of quality deterioration during extended ambient storage. Results and Discussion At S1, total fruit weight and fruit w
