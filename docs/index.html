iencedomain International", "authors": ["Manish Kanwat", "Santosh Kumar", "Naveen Kh", "Doni Jini", "Rajesh A. Alone", "Keshab Gogoi"], "abstract": "Farmer producer organisations have become a central instrument of agricultural policy for smallholders in low- and middle-income countries, and women-led or women-only variants are increasingly promoted as a route to rural women’s economic empowerment. The assumption that collective organisation automatically converts women’s agricultural labour into income, voice and control remains weakly tested. This critical narrative review examines what the evidence shows about the economic effects of women-led producer organisations, the conditions under which membership produces collective agency, and the role of agricultural extension and promoting institutions in shaping these outcomes. Peer-reviewed studies, systematic reviews and institutional reports published from 2000 onwards were identified through multidisciplinary and economics databases, citation tracking and targeted searches of intergovernmental and governmental sources, with foundational earlier works retained where conceptually necessary. Evidence was appraised for design, measurement validity, treatment of self-selection and external validity, and synthesised thematically. The strongest evidence indicates that collective organisation improves women’s access to information, credit, group networks and some forms of household decision-making, whereas effects on income, productivity and market prices are smaller, less consistent and highly dependent on commodity, organisational maturity and access to working capital. Women-only structures widen access but do not by themselves secure active participation, and mixed organisations can deliver comparable decision-making gains where women are present in sufficient numbers. Recurrent risks include increased workloads, reproduction of class and caste hierarchies, male capture of commercialised commodities and dependence on external promoters. Extension that targets women directly, uses female facilitators and engages household relations shows promise, but rigorous evidence linking such support to the sustained performance of women-led enterprises is scarce. The literature is dominated by cross-sectional matching studies, short evaluation horizons and a concentration in India and East Africa. The review concludes that women-led producer organisations are best understood as conditional platforms rather than self-sufficient empowerment interventions, and that policy targets based on membership counts risk overstating achievements. Longitudinal, mixed-methods evaluations that measure enterprise viability alongside intrahousehold and collective agency outcomes are the most pressing research need.", "oa_url": "https://doi.org/10.9734/jsrr/2026/v32i104559", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["collective agency", "agricultural extension", "smallholder farmers", "access to credit", "household decision-making", "women's participation in agriculture", "commercial viability", "agricultural policy"], "topics": ["Adopsi teknologi & pertanian digital", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7214941402", "doi": "10.3389/fsufs.2026.1933343", "title": "Land resource misallocation and rural household development resilience in China’s urban–rural transition", "date": "2026-09-30", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Jinqiong Ouyang", "Yu HE", "Yihang Hu"], "abstract": "Market-oriented land allocation is central to rural development, household welfare, and food system stability in developing countries, yet spatial governance failures in China’s urban–rural transition raise concerns about how land resource misallocation, the price distortion between industrial and commercial/residential land created by local governments’ land-driven development strategy, affects rural household development resilience, defined as the ability of households to resist risks, adapt to changes, and achieve sustainable recovery in the face of external shocks, and who is left behind. Few studies have rigorously examined the link between misallocation and resilience, tested income diversity as a channel, or explored environmental perception as a moderator. Using China Family Panel Studies (CFPS) data (2012–2022) and provincial land transaction records, this study constructs household-level development resilience measures and employs two-way fixed effects, mediation, and moderation models to examine the association between land resource misallocation and rural household development resilience. The findings are as follows. (1) Land resource misallocation is robustly negatively associated with household development resilience; a one-unit increase in misallocation is associated with a 0.002-unit reduction in resilience, robust to instrumental variable estimation and multiple robustness checks. (2) Income diversity plays a partial mediating role, but its effect is paradoxical: land resource misallocation nominally increases the number of income sources, yet does so by displacing stable property and operating income with low-end precarious employment, creating a “false diversity” of more sources but lower quality that ultimately weakens rather than strengthens resilience. (3) Environmental risk perception positively moderates this relationship; the negative association weakens as environmental risk perception rises, consistent with an interpretation of perception as cognitive adaptive capacity. (4) The negative association is more pronounced among households with higher education, higher dependency ratios, agricultural employment, and exclusion from land transfer markets. These findings highlight that land governance reforms must move beyond factor allocation efficiency to incorporate livelihood ability, food-access capacity, and household development resilience goals.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1933343/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1933343/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["rural-urban transition", "income diversity", "environmental risk perception", "adaptive capacity", "land transfer market", "precarious employment", "China"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 35}, {"id": "W7214904896", "doi": "10.14719/pst.13934", "title": "An integrated analysis of socio-economic, communication and psychological drivers of information and communication technology utilisation among farmers", "date": "2026-09-30", "year": "2026", "journal": "Plant Science Today", "issn": "23481900", "publisher": "", "authors": ["S Sumesh", "R Pratima", "K Rakesh", "Samriti", "R Muskan", "Isha", "Himshikha", "K Ankit"], "abstract": "The present study was conducted in Solan district, Himachal Pradesh, to examine the socio-economic, communication and psychological characteristics of farmers using information and communication technology (ICT) tools in agriculture. A total of 120 ICT-using farmers were selected from 20 Gram Panchayats in the Solan and Kandaghat blocks through multistage random sampling. Data were collected using a structured interview schedule and analysed using descriptive statistics. Results revealed that 90.83 % of ICT users were male, with 95.83 % being literate, half completed senior secondary education. The majority of respondents (57.50 %) were solely dependent on agriculture and 78.33 % belonged to above poverty line (APL) households. Marginal landholdings were common (63.30 %) and 77.50 % lived in pacca houses. Friends (98.30 %), neighbours (98.30 %) and relatives (97.50 %) were the primary sources of agricultural information, while formal sources like agriculture extension officers (6.67 %) and Gram Sevaks were underutilised. Bank managers (56.67 %) and subject matter specialists (55.83 %) were the most consulted institutional sources. Mass media exposure was high for 51.67 % of respondents, with a low CV (18.67 %), indicating consistent media use. However, 79.17 % had low extension participation, showing poor engagement with formal advisory services. Psychologically, 58.33 % had medium decision-making ability and 60 % showed moderate risk orientation. Integrated socio-economic, communication and capacity-building interventions targeting smallholder farmers are essential for enhancing effective ICT utilisation in agriculture.", "oa_url": "https://horizonepublishing.com/journals/index.php/PST/article/download/13934/16651", "pdf_url": "https://horizonepublishing.com/journals/index.php/PST/article/download/13934/16651", "oa_status": "diamond", "cited_by": 0, "keywords": ["ICT adoption", "farmers", "agricultural information resources", "agricultural extension participation", "risk orientation", "decision-making ability", "smallholder farmers", "socioeconomic characteristics"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 30}, {"id": "W7214932147", "doi": "10.3390/agriculture16192117", "title": "Framework Proposal for Assessing the Sustainability Impacts of IoT-Enabled Disease Management in Viticulture", "date": "2026-09-30", "year": "2026", "journal": "Agriculture", "issn": "20770472", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Simona Stojanova", "Mojca Volk", "Argene Superina", "Andrej Kos", "Emilija Stojmenova Duh"], "abstract": "Digitalization is transforming the wine industry significantly. The application of different digital tools allows for more sustainable wine production practices, which is especially important in the age of climate change and the shift towards organic wine production. This study proposes an integrated methodological framework for assessing the sustainability value generated through digital vineyard management. The study integrates a systematic literature review of sustainability assessment in the wine sector and a case study with an estimation of managerial outputs resulting from digitalization and quantifies their sustainability value using the SROI (social return on investment) methodology. The literature review shows that SROI application within the wine industry is still an emerging research area and is more commonly used for assessing social farming initiatives. The case study demonstrates how digital vineyard management can generate measurable environmental and operational benefits and how these benefits can be translated into quantified sustainability value. The proposed framework shows a transparent pathway for quantifying value generated from digital information, decision-making and the resulting sustainability outcomes, contributing to the emerging field of digital sustainability assessment in viticulture. It can be useful for farmers, technology providers, policymakers and other stakeholders in understanding and communicating the sustainability impacts of digital technologies in vineyard management.", "oa_url": "https://doi.org/10.3390/agriculture16192117", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["Internet of Things", "viticulture", "sustainability assessment", "social return on investment", "wine industry", "digitalization", "organic wine production", "climate change adaptation"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 30}, {"id": "W7214907438", "doi": "10.3389/fsufs.2026.1963634", "title": "Full-process mechanization of tea production: technological advances and prospects from mechanization-friendly planting to mechanical harvesting", "date": "2026-09-30", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Xingjian Yang", "Yu Zhang", "Yapeng Wu", "Rui Zhang", "Xin Lu", "Zhong Tang"], "abstract": "To address labor shortages and rising production costs in the tea industry, as well as the limited adaptability of machinery to hilly and mountainous tea plantations, this study systematically screened and synthesized the literature published between 1990 and 2026 following the PRISMA framework, ultimately including 216 studies. The results indicate that tea plantation mechanization is transitioning from stand-alone machinery and manual assistance toward lightweight, precision-based, intelligent, and fully coordinated operations. However, several challenges remain, including inadequate adaptability to complex terrain, insufficient integration of agricultural machinery with agronomic practices, limited reliability and standardization of key components, inadequate accuracy and efficiency in shoot and leaf recognition, localization, and low-damage harvesting, and an insufficient understanding of the relationship between mechanized operations and tea quality. Future research should promote the development of standardized, machinery-compatible tea plantations; develop modular operation platforms, high-mobility chassis, active terrain-following systems, and flexible end effectors; advance the application of multimodal sensing, autonomous navigation, digital twins, and multi-machine coordination; and establish long-term evaluation systems for operational performance and tea quality across regions and seasons. These efforts will help build an integrated, full-process mechanization system that closely coordinates tea plant characteristics, agronomic practices, mechanical equipment, and information-based control, thereby supporting the efficient, high-quality, green, and sustainable development of the tea industry.", "oa_url": "https://doi.org/10.3389/fsufs.2026.1963634", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["mechanical harvesting", "precision agriculture", "hilly and mountainous terrain", "autonomous navigation", "digital twin", "tea quality", "labor shortage"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 30}, {"id": "W7214983909", "doi": "10.1007/s00299-026-03975-7", "title": "EgKT2-1, an inwardly rectifying Shaker-type potassium channel in oil palm that correlates with oil yield", "date": "2026-09-30", "year": "2026", "journal": "Plant Cell Reports", "issn": "07217714", "publisher": "Springer Science+Business Media", "authors": ["Houssein Monder", "Sandra Espéout", "Sabine Zimmermann", "Norbert Billotte", "Jean‐Luc Verdeil", "Stéphanie Bocs", "Jean OLLIVIER", "Reinout Impens", "Florence Jacob", "Isabelle Gaillard", "Térésa Cuellar"], "abstract": "The oil extracted from the mesocarp of oil palm (Elaeis guineensis, Jacq.) drupes is the world's leading source of vegetable oil. Oil palm cultivation requires large amounts of mineral nutrients supplied through fertilization, representing a major production cost. Among essential nutrients, potassium (K⁺) plays a critical role in plant growth and fruit development. However, the mechanisms underlying K⁺ transport and its relationship with yield remain poorly understood. Here, we identified and characterized EgKT2-1, a Shaker-like potassium channel belonging to the AKT2-like subfamily. Quantitative PCR analyses showed that EgKT2-1 is expressed in leaves, meristem, and during early fruit development, with higher transcript abundance during early fruit development coinciding with increased K⁺ accumulation. In situ hybridization localized EgKT2-1 transcripts to the root cortex and phloem tissues, leaf palisade parenchyma, and mesocarp cells during early fruit development. These expression patterns are consistent with a potential contribution of EgKT2-1 to K⁺ transport and allocation between source and sink tissues. Although sequence similarity places EgKT2-1 within the weakly rectifying AKT2-like subfamily, electrophysiological characterization in Xenopus laevis oocytes revealed inwardly rectifying channel activity, suggesting a potential role in K⁺ uptake. EgKT2-1 expression was higher in an oil palm progeny C3 which exhibited greater K⁺ allocation to aerial organs and greater oil yield. Together, these findings identify EgKT2-1 as an inwardly rectifying K⁺ channel potentially involved in K⁺ transport and redistribution during oil palm development and suggest a correlation between EgKT2-1 expression, K⁺ allocation, and oil yield variation.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s00299-026-03975-7.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s00299-026-03975-7.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["inwardly rectifying potassium channels", "oil palm", "potassium transport", "oil yield", "fruit development", "mesocarp", "phloem", "root cortex"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7214917430", "doi": "10.1080/13416979.2026.2738466", "title": "A preliminary checklist for biodiversity conservation in Japanese conifer plantation landscapes", "date": "2026-09-30", "year": "2026", "journal": "Journal of Forest Research", "issn": "13416979", "publisher": "Taylor & Francis", "authors": ["Yuichi Yamaura", "Kazuhiro Kawamura", "Satoshi Yamanaka", "Wataru Higashikawa", "Masato Hayamizu", "Nobuo Ishiyama", "Hiromi Yamagawa", "Satoshi Ito", "Futoshi Nakamura"], "abstract": "Tree plantations have simplified stand structure and composition and can come to dominate landscapes, thereby degrading biodiversity. To provide actionable guidance for wildlife-friendly conifer plantation forestry in Japan, we present a preliminary checklist of objectives and quantitative targets organized from landscape to stand levels, together with associated confidence levels based on available evidence. Landscape-level recommendations include maintaining ≥ 40% natural-forest cover within the landscape; designating ≥ 30% of plantations as semi‑natural stands with native broad-leaved trees and developed vertical structure; maintaining remnant natural‑forest patches regardless of size; prioritizing plantation-matrix improvement around natural-forest remnants and reserves; and ensuring ~10% of the production area remains in early‑successional stands (≤10 years old) with a minimum harvest units ≥ 1.0 hectare. For riverine ecosystems, we recommend retaining riparian buffers ≥ 10 meters on each side and promoting broad‑leaved trees. Stand‑level targets emphasize recruiting and retaining broad‑leaved trees to ≥10% of basal area across subcanopy and canopy strata, conserving understory cover to ≥10%, and implementing dispersed retention of broad-leaved trees together with aggregated retention in riparian forests, ridge-top natural-forest strips, and existing small broad-leaved patches. Other operational guidance during final harvesting includes retaining 10 (preferably 20–30) broad‑leaved canopy trees per hectare, favoring wind‑resistant forms with low height–diameter ratios, and retaining large trees and snags where safety permits. When canopy broad‑leaved trees are scarce, we recommend retaining ≥ 20 saplings or resprouts per hectare. We highlight monitoring components and call for periodic revision of objectives and targets under adaptive management, so practices are updated as evidence and experience accrue.", "oa_url": "https://doi.org/10.6084/m9.figshare.34037781", "pdf_url": "", "oa_status": "green", "cited_by": 0, "keywords": ["biodiversity conservation", "conifer plantations", "plantation landscapes", "species checklist", "forest biodiversity", "Japanese forests"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 0}, {"id": "W7214999462", "doi": "10.3390/aerobiology4040020", "title": "Aerobiological Profile of Tea Gardens in Northeastern Himalayan Regions in India and Its Association with Respiratory Allergy Among Tea Workers: A Comprehensive Technical and Clinical Synthesis", "date": "2026-09-30", "year": "2026", "journal": "Aerobiology", "issn": "28135075", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Kavita Ghosal"], "abstract": "Tea plantations of the Northeastern Himalayan region of India represent major tea-producing landscapes and support a large workforce. Their warm, humid climate, dense vegetation, and intensive processing activities generate diverse bioaerosols, including pollen, fungal spores, bacteria, and organic dust, with potential occupational respiratory health implications. This review synthesizes evidence on the aerobiological characteristics of tea-growing ecosystems and their association with respiratory allergy and other occupational respiratory disorders among tea workers. Literature from India and other major tea-producing regions was critically evaluated, focusing on the diversity, seasonal dynamics, and environmental determinants of airborne pollen and fungal spores, particularly in Assam, Darjeeling, Dooars, Terai, and adjoining Himalayan tea-growing areas. Fungal genera including Cladosporium, Aspergillus, Penicillium, Alternaria, and Curvularia, along with allergenic pollen from grasses, weeds, and surrounding vegetation, frequently constitute important components of the bioaerosol burden. Their abundance varies with temperature, humidity, rainfall, wind, and seasonal vegetation. Processing environments may further increase exposure through respirable tea dust and “tea fluff.” Available evidence from tea-worker studies indicates respiratory symptoms, ventilatory impairment, and allergic or sensitization responses associated with occupational tea-related exposures. However, direct evidence linking specific airborne pollen or fungal taxa detected in tea-growing environments to specific respiratory outcomes in tea workers remains limited. The available literature therefore supports a distinction between direct aerobiological observations, occupational exposure evidence, and clinical evidence, rather than assuming a direct exposure–disease relationship and highlights the need for standardized monitoring, respiratory health surveillance, engineering controls, and evidence-based workplace policies.", "oa_url": "https://doi.org/10.3390/aerobiology4040020", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["tea plantations", "tea workers", "occupational respiratory allergy", "bioaerosols", "airborne pollen", "fungal spores", "Cladosporium", "Aspergillus"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 0}, {"id": "W7214711042", "doi": "10.9734/jsrr/2026/v32i104556", "title": "Farmer Producer Organisations as Extension and Innovation Platforms: Beyond Collective Marketing towards Integrated Farmer Services", "date": "2026-09-29", "year": "2026", "journal": "Journal of Scientific Research and Reports", "issn": "23200227", "publisher": "Sciencedomain International", "authors": ["Manish Kanwat", "Santosh Kumar", "KH Naveen", "Keshab Gogoi"], "abstract": "Farmer producer organisations were promoted chiefly as instruments of collective marketing that would allow smallholders to capture economies of scale, reduce transaction costs and bargain more effectively with buyers. Policy expectations have since widened. In India, where the producer company form was created as a hybrid of the cooperative and the private company and where state promotion has expanded rapidly, these organisations are now expected to supply inputs, credit linkages, advisory services, digital information and support for sustainable intensification and climate adaptation. This critical narrative review examines whether the empirical and conceptual literature justifies treating farmer producer organisations as extension and innovation platforms rather than as marketing vehicles alone. Peer-reviewed literature and authoritative institutional sources were identified through structured searches of multidisciplinary scholarly indexes, supplemented by backward and forward citation tracking, and were appraised for design, identification strategy, context and relevance. The synthesis draws together three bodies of work that have rarely been read together: the economics of agricultural cooperatives and collective action, the literature on pluralistic extension and advisory services, and agricultural innovation systems research on intermediaries and platforms. The evidence indicates that membership is frequently associated with higher technology adoption, better access to inputs and credit and, in some settings, higher incomes, yet price gains from collective marketing are often modest and benefits are unevenly distributed. Advisory functions are typically embedded in input and output transactions rather than organised as independent, demand-led services, and knowledge effects appear strongest where organisations are linked to research, finance and market actors. Confidence is limited by the predominance of cross-sectional matching designs, small single-district samples, weak measurement of service quality and scarce evidence on cost, sustainability and spillovers. Exclusion of marginal, tenant and women farmers, thin capitalisation and dependence on promoting agencies remain unresolved constraints. The review proposes an evidence-derived framework that separates established from hypothesised pathways and identifies priorities for longitudinal, mixed-method and service-disaggregated research. Farmer producer organisations can complement, but are unlikely to substitute for, public extension unless their advisory role is deliberately financed, governed and evaluated.", "oa_url": "https://doi.org/10.9734/jsrr/2026/v32i104556", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["farmer producer organizations", "agricultural extension", "agricultural innovation systems", "collective marketing", "producer companies", "agricultural cooperatives", "advisory services", "technology adoption"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 51}, {"id": "W7214720836", "doi": "10.1093/jas/skag272.110", "title": "24. Market Dynamics in the U.S. Goat Meat (Chevon) Sector: Challenges and Opportunities.", "date": "2026-09-29", "year": "2026", "journal": "Journal of Animal Science", "issn": "00218812", "publisher": "Oxford University Press", "authors": ["Lila B. Karki", "Dharma Raj Katuwal", "Enrique N. Escobar"], "abstract": "Abstract In the U. S., goats account for less than 2% of total red meat production but remain crucial in small-scale farming and niche markets. Growing consumer demand for goat meat is driven by population growth, changing dietary habits, and an increasing ethnic population. However, domestic production has not sufficiently met this demand. This study aims to identify production challenges, supply chain issues, and trade factors that lead to reliance on imports in the U. S. goat meat industry. It uses secondary data from 2000 to 2024 and applies time- series analysis methods such as the Augmented Dickey- Fuller (ADF) test for stationarity, log-linear trend models, and structural break detection using the Bai-Perron method, with breakpoints confirmed through Supremum F-Tests and Chow tests, along with analysis of specific growth regimes and volatility. The results show that U.S. demand for goat meat greatly exceeds domestic production, reaching 31,868 metric tons in 2024, compared to about 9,960 metric tons produced domestically. ADF testing indicates that both import and export series are non-stationary at their levels but become stationary after differencing (p < 0.05), revealing underlying trends in trade data. Structural break analysis identifies a major shift in import patterns around 2017 (SupF=20.54, p = 0.0011), with import growth slowing after that point and volatility increasing significantly—by almost sixfold (p < 0.001) —suggesting greater market instability and vulnerability to external shocks. Imports make up approximately 48–67% of total consumption and are highly concentrated, with Australia supplying over 95%. Exports are minimal and have decreased since a structural break in 2004 (p < 0.05), indicating weak international competitiveness. The ongoing supply gap results from structural challenges, including small- scale farms dominating the industry, small herd sizes, limited adoption of improved genetics and feeding practices, limited access to slaughter and processing facilities, and a spatial mismatch between production regions and urban markets that impairs supply chain efficiency. The findings emphasize a structural imbalance in the U.S. goat meat industry, characterized by high demand, limited local production, and heavy reliance on imports. This situation increases vulnerability to global market shocks and supply disruptions. Addressing these issues requires increasing productivity through improved genetics, feeding, and herd management, as well as expanding slaughter and processing infrastructure. Additionally, improving supply chain coordination and supporting farmers through need-based extension programs can promote climate-resilient production practices, expand market access, and enable more informed decisions. Implementing these strategies is key to reducing reliance on imports, increasing domestic output, and ensuring the sector's long-term competitiveness and sustainability.", "oa_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC13620609/", "pdf_url": "", "oa_status": "green", "cited_by": 0, "keywords": ["goat meat", "meat imports", "supply gap", "structural breaks", "smallholder farming", "supply chain efficiency", "niche markets", "market dynamics"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 42}, {"id": "W7214761153", "doi": "10.3390/su18199953", "title": "Application of AI-Driven Clustering to Address Territorial Heterogeneity and Enhance Socio-Economic Resilience in Ecuadorian Agri-Food Supply Chains", "date": "2026-09-29", "year": "2026", "journal": "Sustainability", "issn": "20711050", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Israel D. Herrera-Granda"], "abstract": "Ecuadorian agri-food supply chains are characterized by strong territorial heterogeneity, crop perishability, and unequal production concentration, creating significant socio-economic and logistical challenges. To address these territorial disparities, this study employs an AI-driven clustering approach to classify Ecuador’s 23 continental provinces by their agri-food production and supply chain integration profiles. Using official 2024 provincial tabulations from the National Institute of Statistics and Censuses of Ecuador, seven variables were analyzed: harvested banana area, banana production, cocoa production, rice production, corn production, potato production, and banana yield. The methodology combined descriptive statistics and Pearson correlations with unsupervised machine learning techniques, specifically hierarchical agglomerative clustering and k-means algorithms after z-score standardization. The descriptive results showed extreme dispersion across provinces, with coefficients of variation exceeding 100% for all variables and marked right skew. The final four-cluster solution (k = 4, BSS/TSS = 78.65%, average silhouette = 0.43) differentiated: (cluster 1) a potato-specialized Andean profile represented by Carchi; (cluster 2) a broad group of low-intensity provinces requiring inclusive logistical integration; (cluster 3) medium-scale banana provinces with high yields; and (cluster 4) the dominant tropical production core formed by Guayas and Los Rios. The typology explains 78.65% of the standardized variability and provides the territorial evidence base required for designing differentiated supply-chain planning, resilience strategies, and public policies tailored to each provincial typology.", "oa_url": "https://doi.org/10.3390/su18199953", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["agri-food supply chains", "regional heterogeneity", "socio-economic resilience", "banana production", "cocoa production", "supply chain integration", "regional specialization", "Ecuadorian provinces"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 38}, {"id": "W7214770364", "doi": "10.1093/jas/skag272.374", "title": "PS5-12. Evaluating the Effects of Dietary Fat Source on Growth Performance, Carcass Characteristics, and Gas Flux in Finishing Steers.", "date": "2026-09-29", "year": "2026", "journal": "Journal of Animal Science", "issn": "00218812", "publisher": "Oxford University Press", "authors": ["Erin N Burke", "Leonardo G Sitorski", "Marco T Genelhu Carreira", "Irene Alexandre Reis", "Sydney M. Bowman-Schnug", "Ashley K Schilling-Hazlett", "Velasquez Rios, Cesar Armando, author", "Kimberly R Stackhouse-Lawson", "Sara E Place"], "abstract": "Abstract The objective of this study was to evaluate the influence of supplemental dietary fat source on growth performance, carcass characteristics, and gas flux in finishing steers. Steers (N = 177) arrived at the CSU research feedlot and were stratified by arrival body weight (334 kg ± 13.73) then randomly assigned to one of four treatments: 1) palm oil (PALM; 4% inclusion; DM basis), 2) beef tallow (TAL; 4%), 3) soybean oil (SOY; 4%), or 4) no supplemental fat (CON). The experiment was a completely randomized design and animal was the experimental unit. Following a 17-day covariate period on a common finishing diet, a 7-day step-up phase was initiated (2% fat source inclusion; DM basis) before cattle were transitioned to their respective experimental diets for 115 days. Pens were equipped with 5 SmartFeed intake systems and a GreenFeed emission monitoring system (C-Lock Inc., Rapid City, SD) used to measure individual dry matter intake (DMI) and enteric methane emissions (CH4). Individual body weight was collected every 28 days. Weekly diet samples were collected from each treatment and composited for wet chemistry analysis at Dairy One Laboratory (Ithaca, NY). Weekly samples of each fat source were also collected and sent to Michigan State University (Lock Lab, East Lansing, MI) for fatty acid composition analysis. Upon completion of the trial, cattle were harvested at a commercial abattoir and carcass data were collected. Estimated beginning hot carcass weight, carcass gain, and carcass feed conversion were calculated using initial body weight, hot carcass weight, and predictive equations. Data were analyzed using LSMeans comparisons with Tukey adjustment, with the fixed effects of treatment and appropriate covariates using JMP Student Edition 19 (SAS Institute Inc., Cary, NC). Significance was declared at P < 0.05. Inclusion of SOY resulted in greater average daily gain (ADG; P = 0.03), hot carcass weight (P = 0.02), carcass gain (P = 0.02), and calculated yield grade (P = 0.01) compared to CON. Supplemental PALM and TAL reduced CH4 emissions (P < 0.01) compared to CON and SOY, and reduced CH4 yield (g CH4/kg of DMI; P < 0.01) relative to CON. The addition of SOY and TAL to the diet reduced CH4 intensity (g CH4/kg of ADG; P < 0.01) compared to CON. All fat sources reduced carcass gain intensity (g CH4/kg of carcass gain; P < 0.01) compared to CON. These results indicate that dietary fat source can influence both growth performance and methane emissions in finishing cattle. Supplemental SOY improved ADG, whereas PALM and TAL reduced CH4 emissions relative to CON. Strategic selection of supplemental fat source may provide feedlot producers with a nutritional management approach to influence performance and enteric methane emissions in finishing systems.", "oa_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC13620707/", "pdf_url": "", "oa_status": "green", "cited_by": 0, "keywords": ["dietary fat source", "finishing steers", "enteric methane", "palm oil", "beef tallow", "soybean oil", "growth performance", "carcass characteristics"], "topics": ["Kelapa sawit", "Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 29}, {"id": "W7214934873", "doi": "10.1111/1746-692x.70048", "title": "Can the CAP Deliver a Green Transition in Baltic, Central and Eastern Europe?", "date": "2026-09-29", "year": "2026", "journal": "EuroChoices", "issn": "14780917", "publisher": "Wiley", "authors": ["Štefan Bojnec", "Marián Tóth", "Jan Pokrivcak"], "abstract": "Summary The 2023–2027 Common Agricultural Policy (CAP) is presented by the European Commission as a key instrument for supporting the green transition in agriculture across the Baltic, Central and Eastern European (BCEE) region. However, its effectiveness remains uneven. While CAP instruments can support biodiversity conservation, nutrient management, and rural sustainability, their impact is constrained by fragmented farm structures, administrative complexity, and differences in national implementation. In practice, area‐based payments continue to favour larger farms, limiting smaller farms’ participation in green measures. As a result, the CAP serves not only as an environmental policy but also as a significant distributional instrument. Achieving a more effective transition will require simpler eco‐schemes, stronger advisory support, and more targeted measures to improve smallholders’ access to CAP support.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/1746-692x.70048", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/1746-692x.70048", "oa_status": "hybrid", "cited_by": 0, "keywords": ["Common Agricultural Policy", "green transition", "agricultural policy", "farm size", "area-based payments", "smallholder farmers", "eco-schemes", "distributional effects"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 28}, {"id": "W7214798650", "doi": "10.1016/j.envadv.2026.100758", "title": "Intact forest carbon dynamics and indicative carbon economy in Southeast Asia: A remote sensing and random forest approach", "date": "2026-09-29", "year": "2026", "journal": "Environmental Advances", "issn": "26667657", "publisher": "Elsevier BV", "authors": ["Dhia Zalfa Zahira", "Anjar Dimara Sakti", "Ketut Wikantika"], "abstract": "Intact tropical forests store high amounts of carbon biomass, but this long-stored carbon has not been widely quantified at the regional scale. This study integrates multi-source remote sensing data and Random Forest (RF) to model above- and below-ground biomass carbon (AGBC and BGBC) in intact forests across Southeast Asia from 2000 to 2020. Intact forests were operationally defined as continuously forested areas that remained free from deforestation, cropland, and oil-palm expansion—criteria tailored to the dominant anthropogenic drivers of forest loss in Southeast Asia. Over the study period, intact forest extent declined by approximately 59.35%, reflecting major disturbance pressures across the region. The RF model demonstrated strong predictive performance against the reference data and the ESA CCI biomass dataset, with results of R AGBC 2 = 0.899 and R BGBC 2 = 0.874, then R AGBC 2 = 0.645 and R BGBC 2 = 0.632, respectively. Total forest biomass carbon declined from 32,786.73 ± 6.15 MgC (2000) to 19,913.93 ± 4.23 MgC (2020). In addition, to illustrate the magnitude of these losses, an indicative non-market valuation was applied using two carbon price scenarios. The results show a decrease from USD 776 billion to USD 471 billion based on regional prices and from USD 9.02 trillion to USD 5.48 trillion based on global recommendations. These findings provide quantitative evidence for urgent prioritisation of forest conservation in Southeast Asia, and the spatially explicit carbon stock estimates produced here offer a science-based foundation for strengthening REDD+ commitments, NDCs, and equitable carbon economy frameworks supporting indigenous and forest-dependent communities across Southeast Asia.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2666765726000761/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2666765726000761/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["intact forest landscapes", "forest carbon dynamics", "carbon economy", "carbon sequestration", "forest carbon stocks", "remote sensing of forests", "random forest"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 26}, {"id": "W7214977518", "doi": "10.1080/21645698.2026.2739106", "title": "Tropical vulnerability and temperate resilience: molecular and physiological insights into cold stress adaptation in oil palm", "date": "2026-09-29", "year": "2026", "journal": "GM crops & food", "issn": "21645698", "publisher": "Landes Bioscience", "authors": ["Qiufei Wu", "Muhammad Imran", "Guanming Chen", "Xianhai Zeng", "Lixia Zhou"], "abstract": "Cold stress is a major abiotic constraint limiting the growth and productivity of oil palm (Elaeis guineensis). Its high sensitivity to chilling causes physiological impairment, metabolic disruption, and reduced oil yield and quality. This review summarizes physiological, biochemical, and molecular mechanisms of cold stress responses in oil palm, with comparative insights from rapeseed and soybean. Key pathways, including Ca2+ signaling, MAPK cascades, and the ICE-CBF/DREB network, coordinate membrane lipid remodeling, osmotic adjustment, antioxidant defense, and hormonal regulation. Key genes (EgCBF, EgICE1, EgNCED, EgFAD2, EgSAD, EgP5CS) and transcription factors (EgWRKY, EgNAC, EgMYB) contribute to stress adaptation. However, these responses may be insufficient under prolonged or recurrent chilling, potentially disrupting lipid remodeling, water relations, and plant performance. Advances in GWAS, QTL mapping, multi-omics, genomic selection, and genome editing provide opportunities to improve cold resilience, particularly against episodic chilling events and abrupt temperature fluctuations that may become increasingly important under climate change.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/21645698.2026.2739106?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/21645698.2026.2739106?needAccess=true", "oa_status": "gold", "cited_by": 0, "keywords": ["cold stress", "chilling tolerance", "oil palm", "ICE1", "calcium signaling", "MAPK signaling", "membrane lipid remodeling", "osmotic adjustment"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7214742788", "doi": "10.1186/s12934-026-03129-0", "title": "Enhancing acetate-based biosurfactant production by Pseudomonas putida KT2440 through fermentation optimization", "date": "2026-09-29", "year": "2026", "journal": "Microbial Cell Factories", "issn": "14752859", "publisher": "BioMed Central", "authors": ["Carina V. Michel", "Christopher Weike", "Laura N. Breuer", "Luca A. I. Hampe", "Miriam Schneider", "Giancarlo Franciò", "Walter Leitner", "Till Tiso", "Lars M. Blank"], "abstract": "Abstract Background There is an increasing demand for sustainable chemicals, although “green premium” can be rarily achieved. In this context, biosurfactants emerge as promising substitutes for petroleum- or palm-oil-based surfactants due to their potentially lower environmental impact. 3-(3-hydroxyalkanoyloxy)alkanoic acids (HAAs) are biosurfactants composed of dimeric esterified hydroxy fatty acids. They serve as precursor molecules for rhamnolipids. Here, acetate was chosen as potentially CO 2 -derived carbon source to replace conventional sugar-based feedstocks for HAA production using the versatile bacterium Pseudomonas putida KT2440 as heterologous production host. Results In this study, a fed-batch fermentation for microbial HAA production with acetate as sole carbon source was developed and optimized. First, different pH values were evaluated to determine optimal cultivation conditions, and a pH of 7.8 was identified as the optimal setpoint. To enhance the overall productivity of the fermentation process, different feeding strategies were investigated. Acetate feeding was controlled either by dissolved oxygen (DO)-triggered substrate addition or by pH-coupled feeding using acetic acid as titrant and carbon source. Both feeding strategies resulted in periods of carbon limitation, which promoted HAA degradation. To overcome this challenge, urea was investigated as an alternative nitrogen source in the pH-coupled feeding strategy. Here, the highest reported HAA concentration of 1 g L⁻¹ was achieved, with more than 3.5-fold increases in space-time and product-to-substrate yields compared to the ammonium-based pH-coupled feeding. As a next step, the implementation of CO 2 -derived acetate as carbon source was tackled to improve the overall carbon footprint of the bioprocess. To this end, different substrate mixtures obtained from chemocatalytic CO 2 conversion were evaluated for biocompatibility, growth, and HAA production. The results demonstrate the suitability of the CO 2 -derived acetate-formate mixture for the bioprocess without purification, achieving growth and HAA production comparable to the reference. Conclusion This study demonstrates the successful establishment of a bioprocess for heterologous production of HAAs using acetate as carbon source. Urea as alternative nitrogen source not only enhanced process performance and simplified process control but also improved the overall sustainability of the fermentation process. Finally, the successful valorization of CO 2 -derived acetate further enhances its role as a next-generation feedstock in an emerging bioeconomy.", "oa_url": "https://link.springer.com/content/pdf/10.1186/s12934-026-03129-0.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1186/s12934-026-03129-0.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["biosurfactants", "Pseudomonas putida KT2440", "acetate carbon source", "fed-batch fermentation", "urea nitrogen source"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7214752025", "doi": "10.1016/j.array.2026.101295", "title": "A (p,q,r)-spherical fuzzy CODAS framework for sustainable crop selection in agriculture", "date": "2026-09-29", "year": "2026", "journal": "Array", "issn": "25900056", "publisher": "Elsevier BV", "authors": ["Alhanouf Alburaikan", "Muhammad Rahim", "Maggie Aphane", "Hamiden Abd El‐Wahed Khalifa"], "abstract": "Crop selection is an important decision problem in precision agriculture and sustainable farm management, particularly in environmentally diverse and climate-sensitive regions. This paper proposes a (p,q,r)-spherical fuzzy ((p,q,r)-SF) extension of the combinative distance-based assessment (CODAS) method for evaluating crop alternatives under uncertain expert judgments. The proposed framework integrates a parameterized spherical fuzzy representation, a generalized distance measure, entropy-based criterion weighting, and the CODAS ranking procedure. The (p,q,r)-SF structure represents membership, abstinence, and non-membership information through three power parameters subject to the corresponding admissibility condition. A parameter-selection procedure is incorporated to identify a feasible parameter configuration for the considered decision problem. The framework is applied to the selection of five crops—maize, tomato, apple, onion, and potato, using nine criteria related to agronomic, economic, environmental, and operational considerations. Assessments provided by three agricultural specialists, including an agricultural extension officer, a local agronomist, and an experienced farmer, are expressed using (p,q,r)-SF numbers. The proposed framework is applied to aggregate expert assessments, determine criterion weights, and rank the crop alternatives. The results identify apple as the highest-ranked alternative, followed by maize and potato. Comparative and sensitivity analyses are conducted to examine the ranking behavior of the proposed framework under the considered decision conditions and parameter configurations. The findings demonstrate the applicability of the proposed approach to crop selection under imprecise information. However, the results are specific to the selected region, criteria, expert assessments, and parameter configurations. The framework provides a structured decision-support approach for integrating agronomic, economic, and environmental considerations in sustainable crop selection.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2590005626006181/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2590005626006181/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["spherical fuzzy sets", "CODAS", "crop selection", "sustainable agriculture", "multi-criteria decision making", "agricultural decision support"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7214637506", "doi": "10.1186/s40066-026-00638-4", "title": "Exploring factors influencing the use of internet in the household by women small-scale farmers in rural South Africa: evidence from GHS 2019", "date": "2026-09-28", "year": "2026", "journal": "Agriculture & Food Security", "issn": "20487010", "publisher": "BioMed Central", "authors": ["Faith Sabelo Mbamba", "Philomene Nsengiyumva"], "abstract": "This study adds to the empirical evidence of information and communication technology (ICT) use by women smallholder farmers in South Africa. The study draws on quantitative data collected by Statistics South Africa. The General Household Survey (GHS) for 2019 was manipulated to meet study objectives. The GHS questionnaire was used to sample households, and special attention was given to women farmers who have access to buyers of agricultural products through internet access in the household. A stratified design was used for primary units, and systematic sampling for dwelling units. The Statistical Package for the Social Sciences (IBM SPSS Statistics 30.0.0) was used for analysis of statistical data. Findings indicated that rural farmers from Free State largely access internet to reach formal and international agricultural markets. Whilst, in other provinces farmers access internet mostly to reach local buyers from the district. Yet, gaining access to the internet access remains a predicament considering it is accessed by limited number of farmers. The Whites predominantly access internet to reach all agricultural market over other racial groups. The farmers with secondary education largely use internet and tend to access both local, formal, and international agricultural markets. To test association amongst variables, Chi-square tests showed a significant association. The Phi and Cramer’s V tests showed a moderate and strong relationship amongst the variables. Logistic regression reveals that all variables, age; race; education; just to name a few, are leading factors that explain internet accessibility by women farmers. The study fundamentally recommended that the government should establish internet access platforms that can be accessed by farmers for free or that which will charge affordable rates to attain agricultural and market information.", "oa_url": "https://link.springer.com/content/pdf/10.1186/s40066-026-00638-4.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1186/s40066-026-00638-4.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["internet use", "rural South Africa", "agricultural markets", "ICT adoption", "internet access barriers", "agricultural information", "market access", "Free State"], "topics": ["Akses & informasi pasar petani", "Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 58}, {"id": "W7214595669", "doi": "10.1007/s43621-026-04900-4", "title": "Determinants of livelihood diversification intensity among smallholder farmers in North Wollo Zone, Ethiopia", "date": "2026-09-28", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Ebrahim Endris", "Yimer Aragaw Hussen", "Mohammed Ebrahim"], "abstract": "Livelihood diversification is a key strategy through which smallholder households manage climatic, economic, and production risks. Existing studies in Ethiopia have examined rural households’ choice of livelihood strategies, yet far less attention has been paid to the intensity of diversification to explore the depth and balance of income portfolios, particularly in the North Wollo Zone. This study addresses that gap by examining livelihood diversification intensity among smallholder farmers in the North Wollo Zone of Ethiopia. Primary data were collected from 384 rural households using a multistage sampling procedure. Diversification intensity was measured with the Simpson diversity index (SDI) and analyzed using a fractional probit model. Results indicate that nearly two-thirds (65.89%) of surveyed households pursued additional livelihood activities alongside their principal livelihood sources. The diversification index in the study area was moderate (mean SDI = 0.278; observed maximum = 0.575). On-farm activities remained the dominant income source, while 48.4% and 45.6% of households participated in non-farm and off-farm activities, respectively. Econometric results show that mobile-phone ownership, credit use, and male household headship are positively associated with diversification intensity, whereas older age, larger landholdings, and irrigation use are negatively associated. Major constraints include limited access to finance, inadequate rural infrastructure, poor market access, and human-capital gaps (particularly in education and skills). The study recommends prioritizing rural credit and mobile-phone access, strengthening market linkages, and targeting women and asset-poor households to build more diverse and resilient livelihoods in the study area.", "oa_url": "https://doi.org/10.1007/s43621-026-04900-4", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["livelihood diversification", "smallholder farmers", "North Wollo", "rural households", "off-farm activities", "mobile phone ownership", "rural credit access", "household headship"], "topics": ["Akses & informasi pasar petani", "Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7214653215", "doi": "10.3389/frsc.2026.1843807", "title": "Synergies and trade-offs of nature-inclusive architecture in dense cities: between human health and urban biodiversity", "date": "2026-09-28", "year": "2026", "journal": "Frontiers in Sustainable Cities", "issn": "26249634", "publisher": "Frontiers Media", "authors": ["Weijie Zhong", "Xiangning Li"], "abstract": "As global urbanization intensifies, high-density cities increasingly embrace vertical development to accommodate population growth while limiting urban sprawl. Yet verticalization often comes at the expense of direct access to natural environments, leading to reduced opportunities for human-nature interaction and declining urban biodiversity. Biophilic design frames architecture as an interface for integrating natural elements, processes, and experiences into the built environment, with a primary concern for human health and well-being (Kellert, 2008;Zhong et al., 2022). It differs from green architecture, which is often evaluated through energy, material, and life-cycle environmental performance (Ragheb et al., 2016). Nature-inclusive cities focus more broadly on incorporating biodiversity goals into urban development, district planning, green-blue infrastructure, and real estate projects (Mattijssen et al., 2023;Monti, 2019). Since urban residents spend nearly 90% of their time indoors (Ma et al., 2024), buildings become critical spaces for reconfiguring human-nature relationships. Building-integrated green spaces can also serve as vertically distributed ecological nodes, supplementing limited ground-level greenery and providing habitats for urban flora and fauna. This article therefore explores nature-inclusive architecture, which integrates living organisms, habitat conditions, and ecological processes into buildings to promote human health and urban biodiversity.In dense cities, nature-inclusive architecture is often materialized through three-dimensional green spaces (e.g., sky terraces, green balconies, and vertical gardens), representing a shift from horizontal greening to volumetric and vertically distributed ecological systems (Zhong et al., 2026). However, optimistic narratives of nature-inclusive architecture often mask the uneven performance in practice; despite the potential for mutual benefits between human well-being and non-human habitat needs, this is by no means guaranteed. Integrating nature into architecture necessitates profound trade-offs, such as human demands for comfort, safety, and ease of maintenance, which sometimes clash with the \"messy\" nature of functional ecosystems. This article critically examines the synergies and trade-offs of nature-inclusive architecture in dense cities, emphasizing the delicate considerations for multi-species symbiosis. It argues that not all types of green spaces yield the same effects. By categorizing three-dimensional green spaces according to the spatial verticality (sky, elevated, and ground) and openness (open, semi-enclosed, and enclosed), the discussion highlights the differentiated strengths and limitations of varied types in supporting human health and urban biodiversity. This typological perspective underscores the need to move beyond generic applications of vertical greening and towards more context-sensitive and performanceoriented design approaches that acknowledge both the potentials and constraints of nature-inclusive architecture.Synergies: co-benefits between health and biodiversityNature-inclusive architecture can create urban microhabitats by providing nesting, feeding, or resting spaces for birds, arthropods, and other organisms (Wooster et al., 2022). A ten-year assessment of an intensive green roof with a bioreceptive façade at a French school recorded 345 species (including 207 plants, 100 invertebrates, 20 birds, and a few reptiles and bats), showcasing biodiversity levels comparable to nearby parks (Lewandowski et al., 2026). Distributed among buildings, various green spaces can form ecological networks for wildlife while bringing urban dwellers into closer contact with other species (Fuller et al., 2007). People who regularly watched and fed garden birds reported feeling more relaxed and connected to nature (Cox & Gaston, 2016). Observing pollinators, seasonal changes of plants or bird activities in rooftop gardens, balconies, or other spaces can strengthen residents' nature connectedness and emotional attachment. A study also found that two weeks of nature intervention during the winter can enhance positive affect, hope, and nature connectedness (Passmore et al., 2022).In this way, ecological habitat provision and human psychological connection to nature can become mutually reinforcing rather than isolated.Nature-inclusive architecture links biodiversity and environmental comfort because plant traits influence habitat provision, shading, evapotranspiration, air filtration, and sound attenuation. A survey of vertical greenery systems in Singapore shows that vegetated walls support greater animal diversity than bare walls, cooling building surfaces during the day and providing insulation at night (Hecht et al., 2025). On an extensive green roof in Rome, native Mediterranean perennials outperformed better than Sedum album in terms of plant health, coverage, and flowering; meanwhile, the temperature in the planted area was 2.9-4.4 °C lower than in the adjacent concrete area (Bellini et al., 2025). A comparative roof study also identified vegetation cover, plant assemblage, season, and urban location as determinants of thermal performance (Robbiati et al., 2024). Vegetation can remove airborne pollutants, although dense planting may restrict airflow in poorly ventilated settings and affect airquality outcomes (Chen et al., 2025). On extensive green roofs, vegetation and substrate together reduced noise by 1-4 dBA, with performance influenced by plant cover, substrate, moisture, and gaps in the planting (Lu et al., 2025). Hence, biodiversity and environmental comfort can be jointly enhanced when plant traits and system configurations are matched to local climate, water availability, substrate conditions, target species, and ecological goals.The synergy arises when nature-inclusive architecture offers not only vegetation covering but also nurtures a richer diversity of species. Research indicates that environments featuring diverse elements such as plants, birds, and butterflies are more effective at boosting perceived restorativeness and subjective vitality (Hung, 2025). Perceived bird biodiversity contributed to emotional well-being through perceived restorativeness during nature walks (Marselle et al., 2016). Office workers also rated living roofs more favorably than bare concrete roofs, with tall, green, grassy, and flowering vegetation receiving the highest preference and restoration ratings (Lee et al., 2014). Moreover, biodiversity in nature-inclusive architecture fosters richer sensory experiences, such as birdsong, the rustling of leaves, and floral scents, expanding beyond mere ornamental landscaping. Multisensory biophilic environments have the potential to enhance residents' satisfaction and cognitive performance, assisting in stress reduction (Aristizabal et al., 2021). Therefore, increasing species richness can make spaces appear more vibrant, attractive, and restorative, thereby enhancing the overall experiential quality of natural environments.Environmental preferences influence whether the spaces are entered, used, and revisited, as well as how people interact with nature. Nature-inclusive architecture providing \"lush\" environments and rich in species is more effective at stimulating people's willingness to participate in physical activities, such as walking or exploration (Bell et al., 2021;Markevych et al., 2017). In Barcelona, overall green-space quality was associated with greater use and moderate-to-vigorous physical activity, with bird biodiversity and amenities relevant to the outcomes (Knobel et al., 2021). At a Memory Clinic in Malmö, a rooftop garden featuring a visible entrance, looped path, and central lawn supported spontaneous walks, outdoor breaks, and organized exercise (Oher et al., 2025). Biodiversity can therefore support active engagement when it is combined with accessible routes, suitable amenities, safety, and spatial configurations accommodating different activities. By harmonizing ecological richness with human preference, nature-inclusive architecture functions as a proactive intervention that simultaneously promotes health and biodiversity.Accessible shared green spaces can support social well-being when they enable interaction and collective care. A survey of 1,249 Singapore residents found that frequent garden visits and stronger experiential connections to nature were associated with a sense of belonging and greater social cohesion (Oh et al., 2022). Public-access community gardens in Berlin also generated environmental learning and a sense of place, although outcomes depended on participation structures and the balance between gardening and social objectives (Bendt et al., 2013). Collaborative planting, observation, and maintenance can make biodiversity visible and socially valued, cultivating environmental stewardship (Fink, 2016). It contributes to protecting local biodiversity while transforming human social activities into a vital force for ecosystem conservation. Hence, nature-inclusive architecture holds the potential to become a socio-ecological infrastructure that fosters the health and well-being of humankind and other species.Trade-offs: constraints and contradictions of nature-inclusive architectureIn nature-inclusive architecture, trade-offs exist between the benefits derived from exposure to \"nature\" and the risks of \"causing harm\" (Bell et al., 2021). Biodiversity can boost health through restorative experiences, and exposure to diverse environmental microbiomes is crucial for immune balance and the prevention of inflammatory disorders; it may also introduce allergens, pests, or risks of zoonotic diseases (Gandy, 2023). Health and safety requirements often encourage strictly controlled planting, yet ecological value depends partially on contact with living systems, such as soil organisms, insects and \"dangerous wildlife\" (Methorst et al., 2020). This poses the tension between reducing risk exposure and maintaining beneficial ecological connections. Plant selection further complicates this trade-off. The debate on \"botanical sexism\" indicates that the preference for planting male trees to minimize fruit and seed production may reduce maintenance demands but potentially increase pollen exposure and allergy risks (Hazbei et al., 2025;Katz et al., 2024). Species selection should therefore balance habitat value, reproductive diversity, safety, and maintenance requirements.Incorporating natural elements into the built environment to create vibrant spaces sometimes inadvertently creates \"ecological traps\" that harm urban wildlife (Zuñiga-palacios et al., 2021). The use of large glass curtain walls to enhance visual contact with nature can lead to bird collisions and fatalities. At Chicago's McCormick Place, 21 years of monitoring identified illuminated windows as one of the major predictors of fatal bird collisions; reducing lighted window area to low levels was estimated to cut mortality by about 60% (Van Doren et al., 2021). Spaces designed to maximize human use through foot traffic, recreational activities, lighting, or commercial operations may further degrade habitat quality. Near heavily used forest trails, bird density and species richness were 13% and 4% lower than at sites farther from trails (Bötsch et al., 2018). This creates a sharp trade-off between spatial activation and ecological conservation, as the features that vitalize green spaces for human benefits from nature connectedness can undermine livability for other species. Nature-inclusive projects should integrate safe habitats and quiet refuges for wildlife alongside spaces designed for human use.The easier it is to maintain green spaces in buildings, the more likely they are to become decorative features rather than functional habitats, presenting a trade-off between operational convenience and ecological authenticity. Many projects integrating nature achieve visual success largely by being meticulously maintained (pruning and replacing plants more often) and simplifying the species composition to ensure manageability (Zhong et al., 2024). A review of 92 studies found a consistent negative association between mowing intensity and plant diversity, while responses among invertebrates varied across taxa and maintenance regimes (Hu & Lima, 2024). True habitats are rarely as neatly trimmed as these. Ecological processes depend on change, succession, decomposition, and the formation of microhabitats, the processes that may appear chaotic from the perspective of building management. Differentiated mowing, selective pruning, and retaining dead branches, fallen leaves or dead stems where safety permits can promote seasonal growth, spontaneous colonization, and habitat heterogeneity.Humans perceive nature not only with love (biophilia) but also with fear and aversion, known as \"biophobia\" (Wilson, 1993). Nature-inclusive architecture sometimes prioritizes human preferences and excludes species that are \"less appealing\" but ecologically vital, such as spiders or snakes, which may trigger negative emotional responses. A survey of 600 residents in Greece found that likeability was the strongest predictor of whether people wanted more encounters with a wildlife taxon, with butterflies and songbirds among the most preferred species (Hu & Lima, 2024). This human-centered filtering forms the gap between the perceived \"nature\" and the actual needs of a functioning ecosystem.Marginalizing species that lack visual appeal may exclude groups with different values, hindering the ecological functions necessary to support broader urban biodiversity. Designs incorporating ecological interpretation hold the potential to enhance the acceptance of \"undesirable\" species and other ecologically valuable elements.The benefits people derive from nature-integrated architecture are often unevenly distributed.Wealthier neighborhoods typically feature more diverse vegetation and better-maintained green spaces, reflecting a \"luxury effect\" (Eyster et al., 2024;Hazbei et al., 2025). Improved greening may increase land and property values, but it can lead to green gentrification and the displacement of low-income residents, especially where green spaces are scarce and housing protections are weak (Ceballos & Jatoespino, 2026). The social performance of building-integrated greenery should therefore be assessed through affordability, shared access, and the distribution of benefits across neighborhoods.Nature-inclusive architecture encompasses various types of green spaces that differ in their potential contributions to health and biodiversity. The preceding discussion indicates that synergies emerge when green spaces provide habitats, environmental comfort, perceptible nature experiences, and opportunities for physical activity and shared stewardship. These spaces may also introduce safety risks, ecological disturbance, high maintenance demands, and unequal access. Understanding the strengths and challenges of different types of green spaces can inform design decisions that enhance synergies and manage trade-offs. Taking three-dimensional green spaces as an example, they can be classified into nine types based on the openness and verticality of spaces (Table 1).Table 1 Strengths and challenges of various spatial types of three-dimensional green spaces in buildings. This typology translates the preceding synergies and trade-offs into a context-sensitive and performance-oriented framework. Context-sensitive design responds to spatial position, microclimate, access, and surrounding ecology; performance-oriented design considers factors such as health experience, habitat quality, environmental comfort, maintenance demand, risk exposure, and accessibility.Nature-inclusive architecture, particularly through three-dimensional green spaces, offers a promising yet complex pathway for aligning dense urban development with ecological and health goals. Its contributions to human health and urban biodiversity depend on how synergies and trade-offs are addressed. It can support stress reduction, cognitive performance, positive emotions, physical activity and social cohesion, while creating challenges related to hygiene and safety, wildlife disturbance, maintenance, ecological function, accessibility, and social equity. Hence, the effectiveness of natureinclusive architecture relies more on the configuration, perception, and experience of the biodiverse environment than on the mere presence of greenery. Different spatial types present distinct benefits and limitations, highlighting the need for tailored design rather than a one-size-fits-all approach. The proposed typology can guide the selection and combination of three-dimensional green spaces according to site conditions and intended health and biodiversity outcomes. When design decisions address trade-offs and accommodate both human and non-human needs, nature-inclusive architecture can function as socio-ecological infrastructure in dense urban environments.", "oa_url": "https://www.frontiersin.org/journals/sustainable-cities/articles/10.3389/frsc.2026.1843807/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-cities/articles/10.3389/frsc.2026.1843807/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["biophilic design", "urban biodiversity", "human health", "dense urban areas", "vertical greening", "vertical gardens", "human-nature interaction", "blue-green infrastructure"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7214637201", "doi": "10.3390/su18199888", "title": "How Does E-Commerce Participation Promote Farmers’ Green Production Behavior? Evidence from the China Rural Revitalization Survey", "date": "2026-09-27", "year": "2026", "journal": "Sustainability", "issn": "20711050", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Pengju Han", "Lingjuan Cheng"], "abstract": "Promoting farmers’ green production behavior is essential for ensuring the quality and safety of agricultural products and advancing sustainable agricultural development. As information and communication technologies become increasingly integrated into agriculture, rural e-commerce has emerged as an important means of reshaping agricultural product marketing and farmers’ production decisions, while providing new impetus for green agricultural transformation. Based on 1950 crop-growing farm households from the 2020 China Rural Revitalization Survey (CRRS), this study estimates the effect of e-commerce participation on farmers’ green production behavior using ordinary least squares (OLS), two-stage least squares (2SLS), and mechanism analysis. The empirical results show that e-commerce participation significantly promotes farmers’ green production behavior, and this effect is stronger in areas with higher logistics accessibility. The mechanism analysis further suggests that farmland transfer-in and credit access may serve as potential pathways through which e-commerce participation influences farmers’ green production behavior. These findings highlight the need to improve rural e-commerce services and logistics infrastructure and strengthen farmland transfer and rural financial services to reinforce the role of e-commerce participation in promoting farmers’ green production behavior.", "oa_url": "https://doi.org/10.3390/su18199888", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["rural e-commerce", "sustainable agriculture", "agricultural product marketing", "access to credit", "rural finance", "agricultural product quality and safety", "China"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 28}, {"id": "W7214562996", "doi": "10.1007/s43621-026-04697-2", "title": "A stocktake of opportunities and knowledge gaps in advancing digital agriculture in Quebec", "date": "2026-09-27", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Sambiani Donald-Yendoubouam Tindjiete", "Terence Épule Épule", "Daniel Etongo", "C. H. Peng", "Paul Célicourt"], "abstract": "Abstract Sustainable development has become a key priority for the agricultural sector, both globally and in Quebec. Digital agriculture, as an important component of sustainable agricultural systems, represents a promising pathway toward achieving sustainable development goals. However, despite the recognized benefits of digital agriculture, the opportunities, limitations, and research gaps associated with its contribution to sustainable development in Quebec remain insufficiently understood. This study applies a systematic tracking approach to identify applications of digital technologies in Quebec’s agricultural sector and evaluate their potential contributions to provincial sustainable development objectives while highlighting gaps and opportunities for their enhanced deployment. A total of 59 peer-reviewed publications and grey literature reports were identified and analyzed. Overall, 14 categories of digital technologies were documented within Quebec’s agricultural sector. Their representation in the scientific literature was primarily concentrated in three dominant categories: web/mobile applications and software (31%), machine learning and sensors (14%), and satellite technologies (13%). The identified digital technologies have significant potential to support sustainable development objectives in Quebec agriculture through improved pesticide monitoring, soil health assessment and conservation, fertilizer management optimization, water-use efficiency, and biodiversity conservation. Collectively, these technologies could be combined in 65 distinct ways to support sustainable development goals; however, only 54% of this potential is currently being exploited in Quebec. This highlights substantial opportunities for expanding the role of digital agriculture in addressing sustainability challenges. The study also reveals important knowledge gaps, particularly regarding the social dimensions influencing the diffusion and adoption of digital technologies in agriculture. A limited understanding of the factors affecting Quebec farmers’ adoption decisions remains a major barrier to maximizing the benefits of digital agriculture. Addressing these social and behavioral dimensions will be essential for accelerating the transition toward more sustainable, digitally enabled agricultural systems in Quebec.", "oa_url": "https://doi.org/10.1007/s43621-026-04697-2", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["digital agriculture", "sustainable agriculture", "Quebec agriculture", "pesticide monitoring", "soil health", "fertilizer management", "water use efficiency", "biodiversity conservation"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 19}, {"id": "W7214618881", "doi": "10.1111/ntwe.70047", "title": "Epistemological Friction: Embodied Expertise and the ‘Last Mile’ of Agricultural Automation in the US Tree‐Fruit Industry", "date": "2026-09-27", "year": "2026", "journal": "New Technology Work and Employment", "issn": "02681072", "publisher": "Wiley", "authors": ["M. Anne Visser", "Alex Bladimir Hernandez"], "abstract": "ABSTRACT Autonomous and AI‐driven agricultural technology is often framed as a panacea for labour dependency. While proponents envision autonomous technologies seamlessly optimising farming, this rationalised model misunderstands the reality of on‐farm integration. Based on an ethnographic and compar
