s/articles/10.3389/fsufs.2026.1940600/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["agroecology", "agricultural transformation", "labor mobility", "off-farm employment", "rural migration", "rice cultivation", "agricultural intensification", "smallholder farmers"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 44}, {"id": "W7213983148", "doi": "10.3389/fsufs.2026.1961960", "title": "Communication channels for promoting regenerative agricultural practices among maize farmers: preferences and predictors in Ghana’s transitional belt", "date": "2026-09-22", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Fred Ankuyi", "Ernest Laryea Okorley", "Fatimah Von Abubakari", "Enoch Kwame Tham-Agyekum"], "abstract": "Agricultural extension, knowledge exchange, behavioural change, and smallholder innovation are fundamental to accelerating sustainable agricultural transformation and strengthening climate-resilient food systems in Africa. Effective knowledge exchange enables farmers to adopt environmentally sustainable practices that improve soil health, enhance productivity, and contribute to food and nutrition security. However, limited evidence exists on how farmers’ communication preferences influence the adoption of regenerative agricultural practices (RAPs). This study examined determinants of maize farmers’ preferred communication channels for receiving RAP information in Ghana’s transitional belt. A cross-sectional survey was conducted among 385 maize farmers selected through a multistage sampling procedure. Data were collected using a structured interview schedule administered to the selected respondents. Data were analysed using descriptive statistics, one-way analysis of variance, chi-square tests, and multinomial logistic regression. Mass communication emerged as the most preferred channel (38.7%), followed by individual (37.1%) and group communication (24.2%). Despite being the least preferred, group communication was associated with significantly higher adoption of RAPs than mass and individual channels. Communication preferences were significantly influenced by education, sex, farming experience, land ownership, market incentives, location, and farm fragmentation. The findings demonstrate that communication effectiveness depends not only on information access but also on opportunities for interaction, peer learning, and contextualised advisory support. The study recommends integrating mass communication with participatory group-based and targeted interpersonal extension approaches to enhance RAPs adoption. This supports SDG 2 (Zero Hunger), SDG 12 (Responsible Consumption and Production), SDG 13 (Climate Action and SDG 15 [Life on Land]). By linking communication preferences with regenerative agriculture adoption, this study extends agricultural communication theory and provides evidence for designing farmer-centred extension systems that strengthen resilient agricultural and food systems across sub-Saharan Africa.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1961960/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1961960/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["communication channels", "maize farmers", "agricultural extension", "mass communication", "group discussion", "personal communication", "technology adoption", "farmer preferences"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 42}, {"id": "W7214014954", "doi": "10.3390/land15101775", "title": "Farmland Transfer Contract Stability and Green Production Technology Adoption: Evidence from Guizhou, China", "date": "2026-09-22", "year": "2026", "journal": "Land", "issn": "2073445X", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Qiong Shi", "Mingyong Hong", "Zhen Hu", "Fan Yang", "Long Qian"], "abstract": "Agricultural green transformation is essential for high-quality agricultural development and rural modernization, and farmers’ adoption of green production technologies is central to this process. Although many studies have examined such adoption, limited attention has been paid to farmland transfer contract stability. Using survey data from 1211 farm households in Guizhou Province, China, this study examines how farmland transfer contract stability affects farmers’ adoption of green production technologies. Logit and negative binomial models estimate adoption decisions and adoption intensity, while the control function approach and propensity score matching address endogeneity and selection bias. The results show that contract stability significantly increases both the likelihood and intensity of green production technology adoption, with renewal intention exerting the strongest effect. Mechanism analysis indicates that contract stability works mainly by enhancing farmers’ perceived stability of long-term green returns and promoting mechanization investment/service use. Partly substitute for the effect of contract stability on adoption intensity. The effect on adoption intensity is strongest among medium-scale farmers. Cooperatives weaken the effect of transfer duration but strengthen that of renewal intention, while science and technology commissioners complement contract stability, particularly for written contracts and renewal intention. These findings suggest that improving farmland transfer contract systems and coordinating land institutions with green incentive policies can advance agricultural green transformation.", "oa_url": "https://doi.org/10.3390/land15101775", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["agricultural green transformation", "transfer time", "agricultural cooperatives", "written contracts", "Guizhou"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7213978892", "doi": "10.1108/jadee-02-2025-0093", "title": "Perceptual and sociocultural determinants of agricultural entrepreneurship in developing countries: a GEM data analysis", "date": "2026-09-22", "year": "2026", "journal": "Journal of Agribusiness in Developing and Emerging Economies", "issn": "20440839", "publisher": "Emerald Publishing Limited", "authors": ["Ghulam Raza", "Muhibul Haq", "Raza Ali", "Kratzer Jan", "Robin Bell", "Naveed Yasin"], "abstract": "Purpose Responding to calls for greater understanding of the behavioural drivers of agricultural entrepreneurship, this study examines how perceptual and sociocultural factors, together with key demographic characteristics, influence individuals' engagement in early-stage agricultural entrepreneurship in developing economies. Design/methodology/approach This study uses data from the Global Entrepreneurship Monitor (GEM) Adult Population Survey (2020). Logistic regression analysis is applied to examine the influence of perceptual factors (opportunity perception, fear of failure and entrepreneurial self-efficacy), sociocultural factors (entrepreneurial role models, social status of entrepreneurs, media coverage and entrepreneurship as a desirable career choice) and demographic characteristics (age, gender and household income) on individuals' engagement in early-stage agricultural entrepreneurship across 20 developing countries. Findings Findings indicate that entrepreneurial self-efficacy is the only perceptual factor with an independent effect on engagement in agricultural entrepreneurship. When the variables were aggregated into broader perceptual and sociocultural constructs, both constructs were significantly associated with engagement in agricultural entrepreneurship, indicating the relevance of both individual perceptions and the broader sociocultural environment. Analysis also reveals a significant gender difference, with women less likely than men to engage in early-stage agricultural entrepreneurial activity. Research limitations/implications Findings indicate that entrepreneurial self-efficacy is the only perceptual factor with an independent effect on engagement in agricultural entrepreneurship. When the variables were aggregated into broader perceptual and sociocultural constructs, both constructs were significantly associated with engagement in agricultural entrepreneurship, indicating the relevance of both individual perceptions and the broader sociocultural environment. Analysis also reveals a significant gender difference, with women less likely than men to engage in early-stage agricultural entrepreneurial activity. Social implications Fostering agricultural entrepreneurship could help address poverty, unemployment, and gender disparities in developing countries, as the vast majority are associated with agriculture. Originality/value This study contributes to the agricultural entrepreneurship literature by providing empirical evidence on the behavioural drivers of engagement in agricultural entrepreneurship in developing economies. By examining perceptual, sociocultural and demographic determinants using cross-country GEM data, the study advances understanding of the respective roles of individual capabilities and sociocultural environments in agricultural entrepreneurial engagement in agricultural systems where agriculture remains central to rural livelihoods and economic development.", "oa_url": "https://www.emerald.com/jadee/article-pdf/doi/10.1108/JADEE-02-2025-0093/11867341/jadee-02-2025-0093en.pdf", "pdf_url": "https://www.emerald.com/jadee/article-pdf/doi/10.1108/JADEE-02-2025-0093/11867341/jadee-02-2025-0093en.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["agricultural entrepreneurship", "early-stage entrepreneurship", "entrepreneurial self-efficacy", "opportunity perception", "fear of failure", "entrepreneurial role models", "media coverage", "gender differences"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7214016500", "doi": "10.3389/fsufs.2026.1936130", "title": "Factors associated with farmers’ multidimensional participation in e-commerce", "date": "2026-09-22", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Mingyang Yin", "Zhengyin Li", "Juan Xie", "Yan Yan"], "abstract": "Introduction As an important ICT-enabled business model, rural e-commerce has attracted growing attention, yet existing studies predominantly focus on binary adoption while overlooking heterogeneity in farmers’ participation depth, participation breadth, and platform choice. This study examines the multidimensional characteristics of farmers’ e-commerce participation. Methods Using data from 2,508 farm households in the 2020 China Rural Revitalization Survey, this study examines factors associated with four dimensions of e-commerce participation and uses ISM to identify the hierarchy of factors associated with participation decisions. Results (1) E-commerce training is positively associated with participation decision, depth, and breadth and with the probabilities of choosing social and traditional e-commerce. The household head’s education is positively associated with participation decision, depth, and breadth and negatively associated with the probability of remaining offline. In contrast, age is negatively associated with participation decision and depth and with the probabilities of choosing social and traditional e-commerce. (2) Cultivated land area is positively associated with participation decision and depth and with the probabilities of choosing social and traditional e-commerce. Organizational participation is positively associated with participation decision and depth, while average household education is positively associated with participation decision, depth, and breadth. Village e-commerce service stations are positively associated with participation decision and depth and with the probability of choosing social e-commerce. Local non-farm industrial development is positively associated only with participation breadth. (3) Within the ISM hierarchy of factors associated with participation decisions, e-commerce training is identified as a surface direct factor; organizational participation and village e-commerce service stations as shallow indirect factors; cultivated land area and average household education as middle-level indirect factors; and the household head’s age and education as deep-seated root factors. Discussion These findings demonstrate the multidimensional nature of farmers’ e-commerce participation and show that the same factor may have differentiated associations across dimensions. Policies should therefore shift from general encouragement to dimension-specific support through targeted training, organizational services, village e-commerce facilities, resource matching, and locally adapted industrial support.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1936130/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1936130/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["rural e-commerce", "e-commerce adoption", "e-commerce training", "social commerce", "cultivated land area", "household education", "household head education", "household head age"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 36}, {"id": "W7213985211", "doi": "10.1016/j.ssaho.2026.103656", "title": "Drivers of advisory chatbot adoption in smallholder agriculture: A MICMAC analysis of farmer intermediary perceptions in the Sundarbans, India", "date": "2026-09-22", "year": "2026", "journal": "Social Sciences & Humanities Open", "issn": "25902911", "publisher": "Elsevier BV", "authors": ["Rangin Lahiri", "Partha Das", "Biswajit Mahakur", "Ayan Samaddar", "Sambhu Das", "Subrata Saha"], "abstract": "In low-literacy, climate-vulnerable agricultural settings, smallholder farmers rarely evaluate new technologies independently; adoption is mediated through trusted institutional intermediaries. However, the systemic factors driving intermediary-perceived adoption of AI advisory tools remain unmapped. This study applies the Matrice d'Impacts Croisés-Multiplication Appliquée à un Classement (MICMAC) method to examine the systemic drivers of the adoption of generative AI-based agricultural chatbot s , namely, Krishi Dishari, based on the responses of thirty Gram Unnayan Karmi (GUK) intermediaries in the Sundarbans, India, a region facing salinity intrusion and extreme climate challenges. Using a structured bilingual influence matrix survey, the study mapped and classified twelve socio-technical variables by their driving and dependence power. The results indicate that institutional trust is a critical systemic linkage variable, with smartphone access serving as the primary technical driver and social learning emerging as the dominant diffusion mechanism. Furthermore, native language comfort (Bengali) emerged as a key transmission driver, confirming that linguistic accessibility is a prerequisite rather than an enhancement for technology adoption in low digital-literacy contexts. Consequently, this study offers a framework, although transferability warrants exhaustive validation, indicating that AI-based advisory services in vulnerable agricultural settings depend on institutional trust and social learning, not only on technological innovation.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2590291126012246/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2590291126012246/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["smallholder farmers", "institutional trust", "social learning", "smartphone access", "language access", "low digital literacy", "saltwater intrusion", "climate change vulnerability"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 35}, {"id": "W7214065701", "doi": "10.1111/1477-9552.70081", "title": "Low‐Carbon Transition in China's Agrifood System: Potential, Pathways and Global Implications", "date": "2026-09-22", "year": "2026", "journal": "Journal of Agricultural Economics", "issn": "0021857X", "publisher": "Wiley", "authors": ["Yumei Zhang", "Jingjing Wang", "Zhang Ruizeng", "Tiantian Sun", "Shenggen Fan"], "abstract": "ABSTRACT Global agrifood systems must undergo a low‐carbon transition to achieve Paris Agreement temperature goals. Accounting for 13% of global agrifood systems emissions, China has a critical role to play; yet without further action, China's agrifood emissions will continue to rise, jeopardising its carbon neutrality commitment. This study employs a mixed‐methods approach combining a narrative literature review and integrated modelling to: (1) characterise the emissions of China's agrifood system, (2) project carbon emission reduction and carbon sequestration potential under multiple domestic policy scenarios, and (3) provide wider implications for developing countries. Under the baseline scenario, holding current trends and policies constant, annual emissions are projected to rise slowly from a baseline of 1.6 billion tons in 2021 to 1.83 billion tons of CO 2 eq by 2060, driven primarily by the expansion of the livestock sector and growing energy use. However, our modelling results suggest that a combination of measures, including productivity improvements, the adoption of low‐carbon technologies, food loss and waste reduction, production structure adjustment, and a low‐carbon energy transition, could reduce emissions by over 60% or 1.1 billion tons CO 2 eq by 2060 relative to the baseline. At the same time, carbon sequestration alone could ensure carbon neutrality, with potential reductions of 1.8 billion tons CO 2 eq annually, thereby contributing to the national carbon neutrality goal. These results underscore that synergistic, system‐wide interventions substantially outperform isolated measures. China's experience offers a valuable reference for other countries in formulating sustainable agricultural policies and pursuing low‐carbon transitions.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/1477-9552.70081", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/1477-9552.70081", "oa_status": "bronze", "cited_by": 1, "keywords": ["low-carbon transition", "agri-food systems", "agricultural emissions", "carbon neutrality", "livestock emissions", "carbon sequestration", "food loss and waste reduction", "agricultural policy scenarios"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7213986514", "doi": "10.1016/j.gecco.2026.e04433", "title": "Adaptive management of human–elephant conflict in the anthropocene: An importance–performance analysis in Dong Nai Biosphere Reserve, Vietnam", "date": "2026-09-22", "year": "2026", "journal": "Global Ecology and Conservation", "issn": "23519894", "publisher": "Elsevier BV", "authors": ["Van Viet Nguyen", "Thi Thanh Thuy Phan", "I Wayan Koko Suryawan", "Lee Chun-Hung"], "abstract": "The Anthropocene has intensified human–wildlife interactions, making Human–Elephant Conflict (HEC) a major challenge for biodiversity conservation and rural livelihoods across Southeast Asia. This study assessed community adaptive capacity for sustainable human–elephant coexistence in the Dong Nai Biosphere Reserve (DNBR), Vietnam, using an integrated analytical framework that combined Importance–Performance Analysis (IPA), Exploratory Factor Analysis (EFA), and Hierarchical Cluster Analysis (HCA). Data were collected from 430 residents living in HEC-prone areas. The IPA results revealed persistent gaps between the perceived importance and performance of several adaptive management measures, particularly in communities lacking electric fencing. EFA identified three dimensions of perceived adaptive capacity: Resource-based Adaptation (F1), Inclusive Governance Mechanisms (F2), and Local Collective Action (F3). These dimensions corresponded closely with the clusters identified by HCA, which grouped adaptive management indicators into coherent strategic clusters and highlighted the interconnected roles of material resources, institutional arrangements, and community participation in managing HEC. The findings suggest that preventive infrastructure, institutional enhancement, livelihood diversification, agro-ecological adaptation, ecological knowledge integration, and participatory governance constitute key foundations for long-term human–elephant coexistence. Policy interventions should therefore adopt an integrated approach that strengthens resource-based adaptation, promotes inclusive governance, and supports collective learning and action. By linking community perceptions with the adaptive capacity framework, this study provides a practical framework for enhancing socio-ecological resilience and advancing human–wildlife coexistence in protected landscapes in the Anthropocene.", "oa_url": "https://doi.org/10.1016/j.gecco.2026.e04433", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["human-elephant conflict", "adaptive management", "importance-performance analysis", "Asian elephant", "conservation management", "Anthropocene"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7214014335", "doi": "10.3390/systems14101196", "title": "Two-Stage Pre-Sale Financing Strategy for Agricultural Products Supply Chain Considering Capital Constraints", "date": "2026-09-22", "year": "2026", "journal": "Systems", "issn": "20798954", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Yuxiu Liang", "Lindu Zhao"], "abstract": "In the agricultural production cycle, farmers face financial constraints both before planting and before harvesting, which can substantially restrict production decisions and operational efficiency. With the rapid development of agricultural e-commerce and supply chain finance, platform loans and pre-sale financing have become important channels through which farmers can obtain the funds needed for agricultural production. This study develops a two-stage financing portfolio decision model for an agricultural product supply chain and examines the farmer’s optimal financing strategy, planting quantity, and pricing decisions under exogenously given platform loan and pre-sale financing conditions. The results show that the loan interest rate and commission rate significantly influence the farmer’s choice of financing strategy. Specifically, holding other conditions constant, a higher loan interest rate increases the farmer’s incentive to adopt pre-sale financing, whereas a higher commission rate reduces the incentive to adopt it. Numerical simulations further identify the decision boundaries of the two-stage financing portfolio strategies under different parameter conditions. This study provides theoretical insights into farmers’ financing decisions and the selection of multi-stage financing strategies in agricultural product supply chains.", "oa_url": "https://doi.org/10.3390/systems14101196", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["capital constraints", "price setting", "loan interest rates", "commission rates", "agricultural e-commerce", "supply chain finance"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 18}, {"id": "W7213921129", "doi": "10.3389/fsufs.2026.1869050", "title": "Factors influencing the adoption of climate-smart agriculture practices among smallholder farmers in Melani and Msobomvu villages, Eastern Cape Province", "date": "2026-09-21", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Sibonise Lufume", "Lindokuhle Gwala", "Leocadia Zhou"], "abstract": "Climate-Smart Agriculture (CSA) is widely recognised as an effective approach for improving agricultural productivity, strengthening resilience to climate change, and enhancing food security among small-scale farmers. However, the adoption of CSA practices remains uneven in many rural communities, including Melani and Msobomvu villages in the Raymond Mhlaba Local Municipality, Eastern Cape Province, South Africa. This study investigated farmers’ awareness and understanding of climate-smart agriculture practices, identified the barriers limiting CSA adoption, and examined the socio-economic and institutional factors influencing adoption decisions. A descriptive research design within a quantitative research approach was employed. Data were collected from 158 randomly selected small-scale farmers using a structured questionnaire and analysed using descriptive statistics, including frequencies, percentages, means, and standard deviations. One-Way Analysis of Variance (ANOVA) was used to determine the significance of selected socio-economic and institutional factors influencing CSA adoption. The findings revealed that respondents generally possessed a good awareness and understanding of climate-smart agriculture practices, although awareness differed across technologies. Rainwater harvesting (80%), crop diversification (71%), conservation agriculture (68%), and soil conservation (68%) recorded the highest levels of awareness, whereas awareness was comparatively lower for drought-tolerant crop varieties (57%), climate information services (55%), and improved livestock management (49%). The study further identified farmer resistance to change, inadequate financial resources, and limited extension materials as the major barriers limiting CSA adoption. One-Way ANOVA indicated that financial constraints, market access, knowledge of climate-smart agriculture technologies, and extension support were statistically significant factors influencing adoption decisions ( p < 0.05).", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1869050/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1869050/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["climate-smart agriculture", "technology adoption", "smallholder farmers", "farmer awareness", "barriers to adoption", "socioeconomic factors", "institutional factors", "rainwater harvesting"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 55}, {"id": "W7213914878", "doi": "10.1080/23311932.2026.2734636", "title": "The impact of digital technology adoption on farm profitability for smallholder sunflower farmers: empirical evidence from Singida, Tanzania", "date": "2026-09-21", "year": "2026", "journal": "Cogent Food & Agriculture", "issn": "23311932", "publisher": "Cogent OA", "authors": ["Ally Mwatima", "Abiud January Bongole", "Hilda Abraham Mwangakala"], "abstract": "This study examined the impact of digital technology adoption on farm profitability among smallholder sunflower farmers in Iramba District, Singida Region, Tanzania. Using cross-sectional data from 174 farmers collected through structured questionnaires, the study employed an Endogenous Switching Regression (ESR) model and complementary OLS, conventional 2SLS, and heteroskedasticity-generated instrumental-variable robustness checks. The ESR estimates indicate a positive Average Treatment Effect on the Treated, suggesting higher predicted profitability among current adopters, while the negative Average Treatment Effect on the Untreated indicates that current non-adopters may not obtain similar gains under adoption. However, although the OLS adoption coefficient is positive and statistically significant, the conventional 2SLS and Lewbel-IV adoption coefficients are substantially smaller and statistically insignificant. These results indicate that the estimated profitability effect is sensitive to identification assumptions. Digital skills and education emerge as more consistent determinants of profitability. The study concludes that digital technologies can support farm profitability, but benefits depend on farmer readiness and complementary capabilities rather than adoption alone.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/23311932.2026.2734636?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/23311932.2026.2734636?needAccess=true", "oa_status": "diamond", "cited_by": 0, "keywords": ["digital technology adoption", "farm profitability", "smallholder farmers", "digital skills", "farmer education", "endogenous switching regression", "identification assumptions", "complementary capabilities"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7213903725", "doi": "10.1016/j.pdisas.2026.100719", "title": "Advancing community-based disaster risk reduction in volcanic landscape: A spatially integrated approach for resilient tourism villages", "date": "2026-09-21", "year": "2026", "journal": "Progress in Disaster Science", "issn": "25900617", "publisher": "Elsevier BV", "authors": ["Hertiari Idajati", "Azizan Marzuki", "Khafizh Salsabila Widya", "Gde Abhicanika Pranata Dyaksa", "Shinta Novia Vera", "Muhammad Ifaldy Amrila Zulkarnain"], "abstract": "Global disaster risk reduction initiatives prioritize resilience. Indonesian tourism villages emphasize appeal and community empowerment, however they have specific disaster risks. Mount Semeru's eruptions–pyroclastics flows, lava flows, ashfall, and lahars–together with landslides and the susceptibility of rural livelihoods, render Pronojiwo a volcanic hazard-prone area. This study develops a disaster-resilient tourism village strategy, geographically integrated mixed-method study employs literature review, field observation, Focus Group Discussion (FGD), participatory mapping, GIS-based disaster risk assessment, thematic analysis, and Strengths, Weaknesses, Opportunities, and Threats (SWOT) analysis. The results show Pronojiwo as a multi-hazard tourist system, contains almost 80% of its territory among moderate-to-high hazard zones, with specific vulnerabilities in Sumberurip and Supiturang. Tourism management must enhance the incorporation of catastrophe risk due to capacity constraints. The model delineates a distinct village system with Sidomulyo as the tourism nucleus, Sumberurip as the diversification and transition zone, and Supiturang as the resilient and educative catastrophe tourism village. This study is distinctive as it employs Geographic Information System (GIS)-based risk assessment for accurate spatial comprehension, community mapping for local insights, and Community-Based Disaster Risk Reduction (CBDRR) principles for implementable and locally governed solutions. This comprehensive framework enhances geographical zoning, tourism product creation, institutional functions, and safety regulations, rendering it a more cohesive and actionable Disaster Risk Reduction (DRR) strategy by integrating community participation and local knowledge into risk mapping, preparedness training, early-warning dissemination, evacuation planning, and coordinated responsibilities among village institutions, tourism actors, and local communities according to each village's risk profile and tourism function.", "oa_url": "https://doi.org/10.1016/j.pdisas.2026.100719", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["community-based disaster risk reduction", "volcanic landscapes", "volcanic hazards", "tourism communities", "disaster resilience"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 41}, {"id": "W7213892699", "doi": "10.1016/j.jrurstud.2026.104404", "title": "From motivation to action: Exploring the triggering mechanism of digital transformation in farmer cooperatives", "date": "2026-09-21", "year": "2026", "journal": "Journal of Rural Studies", "issn": "07430167", "publisher": "Elsevier BV", "authors": ["Yangyang Zheng", "Hao Ding", "Rumiao Li"], "abstract": "As a pivotal vehicle for upgrading the agricultural industry, farmer cooperatives play both a foundational and strategic role in advancing rural industrial revitalization through digital transformation. Drawing on the perspective of network embeddedness, this study analyzes the triggering mechanisms and operational logic underlying the digital transformation of 35 farmer cooperatives in Zhejiang Province, China. The findings reveal that digital transformation among farmer cooperatives follows a processual triggering logic of “motivation—conditions—path—performance.” Alleviating labor shortages and meeting market demand serve as key motivations for farmer cooperatives to embark on digital transformation. Under conditions of strong dynamic capabilities of responsible personnel and government support, these motivations translate into action. The pathway of gradual adaptive restructuring facilitates the effective application of digital technologies. Positive feedback on economic performance further strengthens the momentum for continuous transformation, while feedback on environmental and social performance improves the conditions for continuous transformation. This study not only elucidates the internal logic of digital transformation among farmer cooperatives but also offers theoretical and practical insights for optimizing policy design and accelerating agricultural digitalization.", "oa_url": "https://doi.org/10.1016/j.jrurstud.2026.104404", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["digital transformation", "agricultural cooperatives", "rural industrial revitalization", "network embeddedness", "trigger mechanism", "labor shortage", "market demand", "dynamic capabilities"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7213923654", "doi": "10.1016/j.rechem.2026.103897", "title": "Dual valorization of oil palm empty fruit bunches: acetyl-modified lignin and lignin-derived graphene quantum dots for sustainable photothermal conversion", "date": "2026-09-21", "year": "2026", "journal": "Results in Chemistry", "issn": "22117156", "publisher": "Elsevier BV", "authors": ["Harits Atika Ariyanta", "Kaswati Nur Utami", "Shifa Ratih Prihati", "Wirya Sarwana", "Sudirman", "Mahardika F.Rois", "Sigit Priatmoko", "Dicky Annas", "Holilah"], "abstract": "Lignin derived from oil palm empty fruit bunches (EFB) represents an abundant renewable aromatic resource but remains underutilized in advanced solar-energy materials. Herein, a dual-valorization strategy was developed by converting EFB lignin into two complementary photothermal components, namely acetylated lignin (Ace-L) and palm lignin-derived graphene quantum dots (PL-GQDs). Ace-L served as the primary photothermal matrix, whereas PL-GQDs functioned as broadband light absorbers and nanoscale heat-generating domains. Structural characterization confirmed successful lignin acetylation while preserving the aromatic framework, and PL-GQDs with graphitic characteristics and particle sizes of approximately 2–5 nm were successfully synthesized. The resulting materials were integrated into a photothermoelectric film and a solar-driven aerogel. The optimized film (F-GLa50%) achieved an apparent photothermal conversion efficiency of 23.2% under one-sun irradiation and the optimized aerogel (SDLA-AceG) exhibited an evaporation rate of 944.7 g m −2 h −1 with a solar steam generation efficiency of 59.2%, while maintaining stable performance over six consecutive cycles and sustained steam generation under saline conditions up to 10 wt% NaCl. Mechanistic investigation revealed that the synergistic interaction between Ace-L and PL-GQDs simultaneously improves light harvesting, interfacial heat utilization, and structural compatibility, resulting in enhanced photothermal conversion in both material platforms. This work demonstrates an effective approach for simultaneously upgrading EFB lignin into two high-value photothermal materials for renewable electricity generation and solar-driven water purification.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2211715626008714/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2211715626008714/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["empty fruit bunch", "lignin valorization", "acetylated lignin", "photothermal conversion", "solar steam generation", "solar evaporation", "saline water desalination"], "topics": ["Kelapa sawit", "Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 33}, {"id": "W7213904292", "doi": "10.3390/foods15183349", "title": "Postharvest Management of Fruits: Navigating the Affordability, Efficacy, and Non-Destructive Quality Evaluation of Thermal Versus Non-Thermal Interventions", "date": "2026-09-21", "year": "2026", "journal": "Foods", "issn": "23048158", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Kishenthi Kerisnan", "Kivaandra Dayaa Rao Ramarao", "Sze‐Looi Song", "Chandran Somasundram", "Zuliana Razali", "Sarmila Muthukrishnan", "Saiful Irwan Zubairi", "Mohammed Wasim Siddiqui"], "abstract": "Postharvest losses (PHLs) present a critical bottleneck to global food security, with fresh fruit losses reaching 23-40% due to rapid physiological deterioration, mechanical stress, and microbial decay. This review evaluates the metabolic cascades, including respiration kinetics, transpiration, and hormone-mediated factors, that govern fruit degradation. We reviewed thermal and non-thermal treatments for affordability, including thermal interventions such as hot water treatment (HWT), microwave treatment, and radio frequency treatment, alongside emerging non-thermal preservation modalities such as edible coatings, cold plasma atmospheric treatments, and ultrasound processing. The review places particular emphasis on climacteric tropical fruits such as mango, papaya, banana, and citrus, for which postharvest losses and preservation challenges are especially acute due to their climacteric nature. To address the quality tracking highlighted by modern commercial chains, this review integrates an assessment of non-destructive quality evaluation technologies, focusing on near-infrared (NIR) spectroscopy, hyperspectral imaging (HSI), and electronic noses (E-noses). Overall, this review seeks to deliver a unified blueprint, arguing that sustainable postharvest preservation can benefit from context-specific hurdle-technology concepts that align accessible postharvest treatments with monitoring networks. We synthesise current evidence on individual thermal, non-thermal, and sensing technologies and use this to motivate potential hurdle strategies and treatment-monitoring pairings for diverse fruit supply chains.", "oa_url": "https://doi.org/10.3390/foods15183349", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["post-harvest losses", "fruit preservation", "heat treatment (food and biological processing)", "non-thermal processing", "hot water treatment", "microwave treatment", "radiofrequency therapy", "edible coatings"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7213776282", "doi": "10.1186/s12889-026-29541-0", "title": "Environmental health literacy of local villagers in Northern Thailand with high seasonal PM 2.5 air pollution; a mixed method study", "date": "2026-09-21", "year": "2026", "journal": "BMC Public Health", "issn": "14712458", "publisher": "BioMed Central", "authors": ["Linda Aurpibul", "Patumrat Sripan", "Arunrat Tangmunkongvorakul"], "abstract": "Seasonal PM2.5 air pollution remains a major public health challenge in northern Thailand. Environmental health literacy (EHL) may influence how communities understand pollution-related health risks and adopt protective behaviors; however, little is known about EHL among rural populations living in highly affected areas. We conducted a mixed-methods study from December 2023 to August 2024 among villagers residing in a rural district of Chiang Mai Province, Thailand, where seasonal air pollution occurs annually. Eligible participants lived in the area for at least two years. Data were collected using a paper-based questionnaire and focus group discussions to assess knowledge, perceptions, and responses to air pollution. Forty villagers participated; 25 (63%) were female, with a median age of 39 years (interquartile range [IQR] 34–56). Most participants completed primary or secondary education (83%), and 80% were maize farmers. Hypertension, allergy, and asthma were reported by 15%, 12.5%, and 7.5% of participants, respectively. Villagers demonstrated good awareness of seasonal air pollution, recognized both short- and long-term health consequences, and reported modifying daily activities to reduce exposure. Participants described complying with government recommendations and measures aimed at reducing burning practices. However, they perceived that air quality had not improved despite these efforts. While recognizing agricultural burning and forest fires as major contributors to PM2.5 pollution, participants emphasized that eliminating burning was difficult because of livelihood and economic constraints. They expressed willingness to participate in community-based solutions but highlighted the need for sustainable support systems, including alternative agricultural practices, reliable water supplies, occupational training, and market access. Villagers living in a high-exposure area of northern Thailand demonstrated meaningful EHL and willingness to adopt protective behaviors. However, individual and community actions alone may be insufficient to address a complex environmental problem driven by structural and socioeconomic factors. Sustainable, multi-sectoral approaches that combine public engagement, livelihood support, and effective policy implementation are needed to reduce air pollution and protect community health.", "oa_url": "https://doi.org/10.1186/s12889-026-29541-0", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["environmental health literacy", "PM2.5 pollution", "rural villagers", "agricultural burning", "forest fires", "protective behavior", "livelihood constraints", "community-based solutions"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 24}, {"id": "W7213770399", "doi": "10.3389/fsufs.2026.1944907", "title": "Determinants of farmers’ intention to adopt agricultural e-commerce livestreaming: a sequential mixed-methods study in Beijing", "date": "2026-09-20", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Chanyuan Zuo", "Yuan Li", "Qin Zhang", "Yongsheng Jin"], "abstract": "Agricultural e-commerce livestreaming provides farmers with a new digital means of connecting with consumers, expanding sales channels, and improving market access. However, farmers differ in their willingness to adopt this marketing channel. This study employs a sequential mixed-methods design, integrating grounded theory, structural equation modeling (SEM), and artificial neural networks (ANN) to examine the factors influencing farmers’ willingness to adopt agricultural e-commerce livestreaming in Beijing. First, semi-structured interviews with 26 farmers from suburban Beijing were conducted and analyzed using grounded theory, identifying five antecedent constructs: individual livestreaming readiness, perceived technological feasibility, agricultural product–livestreaming fit, livestreaming ecosystem support, and perceived economic value. Second, based on 300 valid questionnaires, SEM was used to examine the relationships between these constructs and adoption intention. An ANN model was subsequently developed to assess the nonlinear predictive contributions of the factors. The results show that all five constructs are significantly and positively associated with farmers’ livestreaming adoption intention. ANN sensitivity analysis indicates that the constructs rank in relative predictive importance as follows: perceived economic value, agricultural product–livestreaming fit, livestreaming ecosystem support, perceived technological feasibility, and individual livestreaming readiness. This order is consistent with the numerical ranking of the standardized SEM path coefficients. The findings indicate that farmers’ adoption of agricultural e-commerce livestreaming depends not only on whether the technology is easy to use, but also on expected economic returns, the fit between agricultural products and livestreaming-based selling, external organizational and institutional support, and farmers’ own readiness to operate livestreaming businesses. This study extends research on farmers’ participation in digital markets and the adoption of agricultural marketing channels, and provides practical guidance for governments, digital platforms, cooperatives, and other agricultural organizations to reduce adoption barriers, improve market access, and enhance the economic feasibility of livestreaming operations.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1944907/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1944907/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["agricultural e-commerce", "live streaming", "farmers", "technology adoption intention", "agricultural marketing channels", "perceived economic value", "digital markets", "market access"], "topics": ["Akses & informasi pasar petani", "Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 57}, {"id": "W7213652898", "doi": "10.1016/j.ssaho.2026.103540", "title": "Economic sustainability of livestock system in southern Ethiopia: Navigating ownership, market dynamics, and resilient strategies", "date": "2026-09-19", "year": "2026", "journal": "Social Sciences & Humanities Open", "issn": "25902911", "publisher": "Elsevier BV", "authors": ["Teklu Gebretsadik Wana", "Meaza Zenebe"], "abstract": "Livestock systems play a central role in rural livelihoods, food security, and asset accumulation in Sub-Saharan Africa, yet empirical evidence on the joint determinants of livestock ownership, commercialization, and mortality, particularly across species and agro-ecological zones, remains limited. Existing studies often analyze these outcomes separately and fail to integrate economic theory and institutional dynamics adequately. This study addresses this gap by examining the economic sustainability of livestock systems in Southern Ethiopia using cross-sectional data from the 2018/19 Agricultural Household Survey, which covers 39,274 households. Grounded in household production and agricultural investment theory, the analysis employs Probit models to estimate the probability of livestock ownership and mortality incidence, and Tobit models to account for censored outcomes in livestock quantities owned, sold, and lost. The results reveal substantial spatial and species-specific heterogeneity. Cattle ownership is highest in South Omo and Konso, while poultry ownership is widely distributed across mixed-farming zones (regional average 52.1%). Landholding size and household labor are consistently positive and statistically significant determinants of livestock ownership and sales (p < 0.01), supporting asset-based investment theory. Access to extension services significantly reduces livestock mortality (p < 0.05), while participation in safety-net programs is associated with lower sales intensity, suggesting liquidity constraints among vulnerable households. Mortality incidence is significantly influenced by household size, use of hired labor, and disease-control variables across most species (p < 0.01). Model diagnostics confirm the appropriateness of Tobit specifications for censored livestock quantities, and robustness checks show stability across alternative specifications. The findings highlight that livestock sustainability is jointly shaped by resource endowments, institutional support, and market integration, with substantial heterogeneity across agro-climatic contexts. The study concludes that improving access to livestock health services, market data, and credit, while also building capacity among smallholder farmers, is essential to reducing mortality and boosting productivity. Incorporating gender-sensitive and climate-smart livestock management into the regional agricultural policy framework would enhance resilience and support sustainable rural livelihoods. These results have significant policy implications for Ethiopia's Livestock Master Plan (LMP) and Growth and Transformation Plan II (GTP II). Aligning these suggestions with Ethiopia's Livestock Master Plan and the Sustainable Development Goals (SDGs 1, 2, 5, 8, and 13) can enable the region to develop an inclusive, market-oriented, and resilient livestock economy that supports rural livelihoods while addressing ecological and climatic challenges. Strengthening these institutional linkages is essential for enhancing resilience and economic sustainability in mixed crop–livestock systems in Southern Ethiopia and similar developing-country contexts.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S259029112601106X/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S259029112601106X/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["livestock production systems", "livestock ownership", "livestock mortality", "livestock commercialization", "economic sustainability", "cattle", "poultry", "livestock sales"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7210295202", "doi": "10.1080/17531055.2026.2730512", "title": "British policy and unequal development in rural Tanganyika, 1920–1961", "date": "2026-09-19", "year": "2026", "journal": "Journal of Eastern African Studies", "issn": "17531055", "publisher": "Taylor & Francis", "authors": ["Sascha Klocke"], "abstract": "Since the mid-2000s, debates on the economic and social legacies of colonial rule in sub-Saharan Africa have seen a revival, including on questions of agricultural change, welfare, inequality, and the role of colonial policy. Existing research has largely focused on wealthier peasant-export colonies and on settler colonies. The dynamics of poorer peasant colonies remain less understood. This paper examines Tanganyika, a British mandate territory from 1920 to 1961, where colonial administrations officially prioritised peasant development and the expansion of African agriculture. Drawing on a newly constructed dataset on African agricultural production at national and provincial levels, the paper analyses trends in cash crop production and food security, situating quantitative evidence within an analysis of colonial policy and African cultivators’ agency. The findings show substantial growth in African agricultural production, particularly after World War II, driven primarily by African farmers responding to market opportunities, rather than by colonial intervention. However, agricultural development was highly uneven, regional inequalities widened, and food shortages remained recurrent. Limited market access, paternalistic, regulatory policies, and the colonial administration’s failure to secure African cooperation are identified as major constraints on cash crop expansion and food security.", "oa_url": "https://www.tandfonline.com/doi/pdf/10.1080/17531055.2026.2730512?needAccess=true", "pdf_url": "https://www.tandfonline.com/doi/pdf/10.1080/17531055.2026.2730512?needAccess=true", "oa_status": "hybrid", "cited_by": 0, "keywords": ["Tanganyika", "British colonial policy", "uneven development", "cash crop production", "food security", "agricultural development", "regional disparities", "market access"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 35}, {"id": "W7213673590", "doi": "10.9734/jsrr/2026/v32i104527", "title": "Journal of Scientific Research and Reports Volume 32, Issue 10, Page 79-86, 2026; Article no.JSRR.165477 ISSN: 2320-0227 Evaluation of Pineapple (Ananas comosus) Wine Sediment as a Dietary Ingredient for Weaner Pigs: Effects on Growth Performance, F", "date": "2026-09-19", "year": "2026", "journal": "Journal of Scientific Research and Reports", "issn": "23200227", "publisher": "Sciencedomain International", "authors": ["Geoffrey Nkwocha A.", "Maxwell Edih", "A.N. Eleazar", "Emmanuel O. Ahaotu", "O. I. Prudent", "K. U. Anukam"], "abstract": "This study evaluated the relationships among feed intake, weight gain, and feed conversion ratio (FCR) in weaner pigs fed diets containing pineapple (Ananas comosus) wine sediment meal (PWSM). Thirty-two cross-bred Large White × Landrace weaner pigs, aged 8–10 weeks and with an average initial live weight of 10.50 ± 0.50 kg, were assigned to four dietary treatments and fed for 35 days. Feed intake was recorded daily, body weight was measured weekly, FCR was calculated, and Pearson correlation analysis was used to examine associations among the performance variables. Economic evaluation was based on prevailing market prices of the dietary ingredients. Daily feed intake showed very weak, positive, and non-significant correlations with daily weight gain (r = 0.027, P = 0.932) and FCR (r = 0.017, P = 0.957). In contrast, daily weight gain was strongly and negatively correlated with FCR (r = −0.818, P = 0.001), indicating that greater daily gain was associated with improved feed efficiency. The performance and economic results indicated that moderate PWSM inclusion supported growth performance and reduced feed cost per kilogram of weight gain under the experimental conditions. Overall, feed intake alone did not explain the observed variation in growth or feed efficiency, whereas daily weight gain showed a clear inverse association with FCR. PWSM may therefore serve as an alternative dietary ingredient for weaner pigs when used at an appropriate inclusion level.", "oa_url": "https://doi.org/10.9734/jsrr/2026/v32i104527", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["pineapple", "weaned piglets", "dietary ingredients", "growth performance", "feed conversion ratio", "feed intake", "weight gain", "feed cost"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7213534592", "doi": "10.3389/fsufs.2026.1898755", "title": "Does hands-on trial experience weaken the negative association between yield-security FoMO and digital nutrient-management technology adoption? Evidence from China", "date": "2026-09-18", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Xia Li", "Ahmad Hanis Izani Abdul Hadi", "Yeong Sheng Tey", "Shaufique Fahmi Sidique", "Nolila Mohd Nawi"], "abstract": "Excessive fertilizer use remains a major challenge for environmentally sustainable agricultural development in China, particularly in smallholder-based perennial production systems characterized by delayed feedback and production uncertainty. Although portable digital nutrient decision-support technologies may help improve fertilizer-use efficiency, their adoption among farmers remains uneven. Drawing on survey data from 675 kiwifruit farmers in Shaanxi Province, this study applies a multivariate probit model to examine the associations of cognitive evaluations, yield-security fear of missing out (FoMO), and hands-on trial experience with farmers’ adoption of soil testers, chlorophyll meters, and agro-advisory mobile applications. The results show that perceived ease of use and perceived relative advantage are positively associated with adoption, whereas yield-security FoMO is negatively associated with all three adoption outcomes in the baseline models. However, when the item most directly related to individual production-risk concerns is excluded, the negative association remains significant for soil testers and chlorophyll meters but becomes insignificant for agro-advisory mobile applications. Hands-on trial experience was positively associated with the adoption of soil testers and chlorophyll meters, but its association with agro-advisory mobile application adoption was not statistically significant. It was also associated with a weaker negative FoMO–adoption relationship for soil testers and chlorophyll meters, but no statistically significant moderating relationship was observed for agro-advisory mobile applications. These findings highlight the potentially important, but technology-specific, role of structured experiential learning in addressing behavioral barriers and supporting digital nutrient-management transitions in perennial smallholder agriculture.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1898755/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1898755/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["fear of missing out", "technology adoption", "chlorophyll meter", "perceived ease of use", "perceived relative advantage", "fertilizer use efficiency", "smallholder farming", "experiential learning"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7213537784", "doi": "10.9734/ejnfs/2026/v18i102153", "title": "From Historical Agrarian Institutions to Global Development Partnerships: Pathways to Agricultural Transformation and Food Security in Ebonyi and Imo States, South-Eastern Nigeria", "date": "2026-09-18", "year": "2026", "journal": "European Journal of Nutrition & Food Safety", "issn": "23475641", "publisher": "Sciencedomain International", "authors": ["Peace Chimarauche Amanze", "Helen Anyanwu", "Chibueze Uzoma Chibundu"], "abstract": "This study examined how historical agrarian institutions and global development partnerships influence agricultural transformation and food security in Ebonyi and Imo States, South-eastern Nigeria. A cross-sectional survey design was adopted, and data were collected through a structured questionnaire administered to registered smallholder farmers, agricultural cooperative leaders, extension officers, and officials of relevant agricultural institutions. Of the 400 questionnaires administered, 387 valid responses were analysed using descriptive statistics and Partial Least Squares Structural Equation Modelling (PLS-SEM) in SmartPLS 4. The findings showed that historical agrarian institutions and global development partnerships had significant positive effects on agricultural transformation, while agricultural transformation had a significant positive effect on food security. Historical agrarian institutions and global development partnerships also exerted significant direct effects on food security. Mediation analysis further indicated that agricultural transformation partially mediated the relationships between each of the two explanatory constructs and food security. The model explained 56.8% of the variance in agricultural transformation and 64.7% of the variance in food security, with satisfactory predictive relevance. Overall, the findings indicate that agricultural transformation in the study area is shaped by the interaction of historically embedded agrarian arrangements and contemporary development cooperation. The study therefore supports institutionally responsive agricultural policies, stronger collaboration with development partners, and measures that improve farmers’ access to productive resources, extension services, finance, markets, and appropriate agricultural innovations.", "oa_url": "https://doi.org/10.9734/ejnfs/2026/v18i102153", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["agricultural transformation", "food security", "smallholder farmers", "agricultural cooperatives", "agricultural extension", "development cooperation", "Ebonyi State", "Imo State"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 46}, {"id": "W7213546179", "doi": "10.1007/s10705-026-10525-w", "title": "Grounds for comparison: linking Arabica cup scores to soil fertility and plant nutrition in rust-resistant cultivars and traditional American coffees", "date": "2026-09-18", "year": "2026", "journal": "Nutrient Cycling in Agroecosystems", "issn": "13851314", "publisher": "Springer Science+Business Media", "authors": ["Chase  Scott Kasmerchak", "Taya Brown", "Heidi Allen Asensio", "Devon Barker", "Juan Charuc", "Andrew J. Margenot"], "abstract": "Abstract The cup quality of rust-resistant Arabica ( Coffea arabica L.) × Robusta ( C. canephora Pierre ex Froehner) cultivars is thought to be inferior to traditional Arabicas, but few studies have examined the extent to which coffee cup scores are affected by local variation in soil fertility and plant nutrition. We evaluated coffee cup quality using the Specialty Coffee Association’s 100-point Q-grading system and characterized the timing and formulation of soil and foliar nutrient additions across 23 fields in south-central Guatemala managed by smallholder farmers, then compared relationships between soil extractable and total leaf and green bean nutrient concentrations and coffee cup scores for traditional versus rust-resistant Arabica cultivars. All cultivars had similar coffee cup qualities and obtained final cup scores suitable for special coffee market access (> 80.0 points). The timing of nutrient additions closely aligned with local weather conditions, but formulations of foliar nutrient additions differed markedly between cultivars. In > 80% of fields, soil inorganic N, K, Mg and B and leaf S, Zn, Cu, and B concentrations were below minimum thresholds generally ideal for crop production. Despite potential nutrient deficiencies, most cup qualities were positively correlated with leaf Zn for traditional cultivars (R 2 adj = 0.23–0.82) and soil K for rust-resistant cultivars (R 2 adj = 0.34–0.78). Our study demonstrates rust-resistant Arabicas grown in this region of Guatemala can have similarly appealing coffee cup flavor profiles and organoleptic qualities as Bourbon and Typica lineages. However, a larger network of sites is needed to establish reliable soil and/or foliar indicators of coffee cup quality across variable management practices and soil conditions.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s10705-026-10525-w.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s10705-026-10525-w.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["coffee cup quality", "soil fertility", "plant nutrition", "foliar nutrient application", "leaf nutrient content", "zinc deficiency", "soil potassium", "specialty coffee"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 35}, {"id": "W7213562005", "doi": "10.1007/s43621-026-04538-2", "title": "Machine learning and remote sensing for smallholder precision agriculture in Ethiopia", "date": "2026-09-18", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Abrha Asefa"], "abstract": "While machine learning (ML) and remote sensing (RS) are frequently heralded as the definitive solutions for agricultural resilience in Sub-Saharan Africa, a profound ‘implementation gap’ persists between laboratory-validated computational maturity and field-level utility for smallholder farmers. This systematic review, conducted under preferred reporting items for systematic reviews and meta-analyses (PRISMA) 2020 guidelines, critically analyzes why sophisticated models optimized for large-scale monocultures fail within the fragmented, intercropped landscapes of Ethiopia. By synthesizing empirical evidence across four domains—in-season crop yield forecasting, digital soil mapping, real-time biotic stress detection, and agro-meteorological modeling—the review uncover a fundamental scale mismatch between coarse-resolution satellite observations and sub-hectare micro-plots. The critique identifies localized data scarcity, hardware constraints, and the ‘last-mile’ connectivity divide as the primary friction points obstructing the transition from macro-level pixels to actionable, site-specific agricultural intelligence. Moving beyond simple summary, the study propose a strategic roadmap centered on decentralized edge computing, tinyML optimizations, and a restructuring of extension services to integrate digital intelligence into daily smallholder decision-making. These structural shifts are essential to bridge the digital divide and secure Ethiopia’s national food security against escalating climate variability. This review foregrounds the significance of digital agriculture within the context of the sustainable development goals (SDGs), specifically addressing SDG 2 (zero hunger) and SDG 13 (climate action) by enhancing crop productivity and building resilience in smallholder systems.", "oa_url": "https://doi.org/10.1007/s43621-026-04538-2", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["machine learning", "remote sensing", "implementation gap", "crop yield prediction", "digital soil mapping", "scale mismatch", "intercropping", "edge computing"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 34}, {"id": "W7213549155", "doi": "10.1016/j.mcat.2026.116346", "title": "Novel MoP catalyst supported on activated carbon derived from pyrolyzed heavy fuel oil for converting palm oil to jet fuel oil via hydrodeoxygenation", "date": "2026-09-18", "year": "2026", "journal": "Molecular Catalysis", "issn": "24688231", "publisher": "Elsevier BV", "authors": ["Araya Smuthkochorn", "Napat Kaewtrakulchai", "Apiluck Eiad‐ua", "Kajornsak Faungnawakij", "Noriaki Sano", "Panya Thanwisai", "Natthawan Prasongthum", "Tawatchai Charinpanitkul"], "abstract": "Molybdenum phosphide supported on activated carbon (MoP-AC) catalysts were successfully prepared from pyrolyzed heavy fuel oil (HFO) as a novel catalyst for hydrodeoxygenation (HDO) of palm oil to produce jet fuel oil. A facile preparation of activated carbon (AC) support was conducted via pyrolysis of HFO in temperatures range of 400 to 700°C and activation with designated ratios of KOH to C (0.5-2.0:1.0). Typical AC samples with a large surface area of 1527.4 m 2 /g were successfully synthesized using KOH to C ratio of 1:1 at 700°C. Then, MoP-AC catalysts were synthesized by wet impregnation with MoP loading of 5 – 20 wt%. SEM and TEM analyses revealed that MoP nanoparticles were uniformly dispersed on surface of MoP-AC with MoP loading of 5 wt%. An increase in MoP loading resulted in agglomeration of MoP nanoparticles. The key finding is that MoP-AC catalyst with 5 wt% loading exhibited 100% palm oil conversion with a liquid hydrocarbon yield of 54% at a temperature of 420°C. As desirable products, 90.4% jet fuel oil and 9.6% diesel oil was achieved. Furthermore, the short-term stability of MoP-AC catalysts with 24-hr on-stream operation was confirmed with the catalyst performance of 100% palm oil conversion and 89.2 % jet fuel oil selectivity. These results highlight a promising route for turning HFO, a byproduct of crude oil refining, into an alternative carbon-based catalyst support for producing renewable jet fuel.", "oa_url": "https://doi.org/10.1016/j.mcat.2026.116346", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["molybdenum phosphide", "activated carbon support", "heavy fuel oil", "palm oil", "hydrodeoxygenation", "jet fuel production", "renewable jet fuel", "KOH activation"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 31}, {"id": "W7213493045", "doi": "10.1016/j.vas.2026.100868", "title": "Local disease risk management practices and barriers to vaccination against peste des petits ruminants among smallholder sheep and goat farmers in northern Nigeria", "date": "2026-09-17", "year": "2026", "journal": "Veterinary and Animal Science", "issn": "2451943X", "publisher": "Elsevier BV", "authors": ["Ladi Amos Chabiri", "Rebecca Weka", "Matthew Yakop Gukut", "Usman Adamu Rayyanu", "Mayowa Peter Olabode", "Victoria Isioma Ifende", "Thomas Duniya Bidoli", "Muhammad-Bashir Bolajoko", "Pwaveno Huladeino Bamaiyi", "Maryam Muhammad", "Marion Bordier", "Alexis Delabouglise"], "abstract": "Background and objectives: Peste des Petits Ruminants (PPR) remains a major constraint to small ruminant production in Nigeria, threatening rural livelihood and food security, despite the existence of a national control program. Empirical evidence on farmers' management practices and reasons for low vaccination uptake remains limited. This study aims to explore local management practices, perceptions, and barriers to vaccination among smallholder farmers in Bauchi, Kano and Plateau states. Method: A socioeconomic study was conducted in 52 villages across the three states, with a total of 104 gender-disaggregated focus group discussions using participatory approaches to elicit participants' perception of SR farming and management practices of disease outbreak matching the clinical and epidemiological features of PPR. Qualitative data were thematically analysed to identify dominant disease management strategies and perceived vaccination barriers. Spatial comparison of management profiles across study locations was undertaken to assess clustering patterns and contextual variation. Results: Small ruminants were mostly valued for their contribution to households' essential expenditures and religious celebrations and diseases were considered the highest threat to these contributions. Four distinct disease management profiles emerged, determined by the use of disease prevention practices and by responses to disease outbreaks with medical treatments or depopulation. Management profiles exhibited spatial clustering across the three states. Ten major obstacles to vaccination were identified, including limited awareness, poor vaccine access, preference for curative care, reliance on indigenous remedies. Contributions: The findings underscore the need for community-driven vaccination campaigns that consider local knowledge and practices, improve vaccine accessibility, and integrate trusted local health service providers into government-led PPR control programs.", "oa_url": "https://doi.org/10.1016/j.vas.2026.100868", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["peste des petits ruminants", "vaccination", "smallholder farmers", "sheep", "goats", "disease risk management", "barriers to vaccination", "Northern Nigeria"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 38}, {"id": "W7108446414", "doi": "10.1111/rec.70540", "title": "Performance of planted native seedlings in felled strips within Pinus radiata plantation forest", "date": "2026-09-17", "year": "2026", "journal": "Restoration Ecology", "issn": "10612971", "publisher": "Wiley", "authors": ["Grace R. Marshall", "Bruce Manley", "Sarah V. Wyse"], "abstract": "Abstract Introduction Exotic plantations could facilitate native forest restoration through a managed transition utilizing partial harvest, poisoning, or natural senescence of the plantation. Objectives To explore canopy gap creation and herbivore exclusion in a Pinus radiata plantation on planted seedlings of three native tree species. Methods Growth and survival of planted seedlings were compared using a randomized split‐plot block design with three replicates of strip harvesting treatments and an unharvested control in a mid‐rotation (14‐year‐old) P. radiata plantation in Hawke's Bay, New Zealand. Felled strips were 50 m long with widths of 9–27 m. Unharvested controls were 50 m × 9 m, giving a total of nine strips and three controls. A deer fence around half of each strip excluded ungulates. Height, root collar diameter, and position of Podocarpus totara , Leptospermum scoparium , and Fuscospora solandri seedlings were measured at establishment and after 2.5 years. Survival and browse were monitored at 6‐monthly intervals. Results All species had significantly greater growth and survival in strip treatments compared to the control. However, no strip treatment produced greater seedling performance across all species. Leptospermum scoparium and F. solandri in the medium and wide strips with ungulate exclusion experienced reduced growth due to increased competition with exotic grasses without grazing pressure. However, seedlings of F. solandri and P. totara that were browsed also experienced increased mortality. Conclusions Gap creation improves growth and survival of planted native seedlings. Smaller gaps could be more effective where exotic grasses are common and grazing pressure is low.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/rec.70540", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/rec.70540", "oa_status": "hybrid", "cited_by": 0, "keywords": ["Pinus radiata plantations", "strip harvesting", "native tree seedlings", "Podocarpus totara", "Leptospermum scoparium", "ungulate browsing", "herbivore exclusion", "seedling growth and survival"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7213445290", "doi": "10.1016/j.rse.2026.115677", "title": "Using ICESat-2 ATL08 heights and Landsat time series to assess the age-height relationship of southern yellow pines in the US", "date": "2026-09-17", "year": "2026", "journal": "Remote Sensing of Environment", "issn": "00344257", "publisher": "Elsevier BV", "authors": ["Sonia Sharma Banjade", "Randolph H. Wynne", "Valerie A. Thomas", "Patrick C. Green", "Todd A. Schroeder"], "abstract": "It is critical to understand the age-height relationship in actively managed pine plantations to evaluate forest productivity and inform sustainable forest management practices. This study utilized the spaceborne lidar data from ICESat-2 ATL08 and Landsat-derived disturbance maps to assess the site index for actively managed pine plantations across the southeastern United States. Specifically, we (1) assessed the agreement between ICESat-2 ATL08 canopy heights and airborne laser scanning (ALS) data, (2) showed the distribution of canopy height by age for the actively managed pine stands, and (3) compared the site index guide curve derived using ICESat-2 and Landsat data with the FIA-derived site index guide curve. We analyzed over 137,998 ICESat-2 ATL08 segments intersecting pine plantation locations and LCMS Fast Loss. We identified plantation ages by subtracting the LCMS Fast Loss year from the ICESat-2 acquisition date. Actively managed stands were defined as those experiencing both thinning and harvesting. ICESat-2 ATL08 heights were compared to heights derived using airborne laser scanning (ALS) data from the USGS 3D Elevation Program. The heights were highly correlated in the assessed region (R 2 = 0.90), providing confidence in ICESat-2 ATL08 heights. Despite the challenges with LCMS misclassifying thinning events as clear-cut disturbances, we developed a model using quantile regression relating the logarithm of ICESat-2 ATL08 height to the reciprocal of age, resulting in a regional site index guide curve. The ICESat-2-derived site index (19.9 m) closely matched the FIA-derived site index (19.8 m) at the base age of 25 years, as supported by the Cramér-von Mises test, indicating that the site index guide curves are statistically similar. The resulting site index map provides insights into spatial variability in regional forest productivity, emphasizing the utility of remote sensing data for large-scale forest monitoring and management", "oa_url": "https://doi.org/10.1016/j.rse.2026.115677", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["canopy height", "site index", "southern pine", "pine plantations", "airborne laser scanning", "forest productivity", "forest management", "quantile regression"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 0}, {"id": "W7213288511", "doi": "10.3390/su18189481", "title": "Relational Drivers and Technical Efficiency in Indonesian Banana Value Chains: A Multi-Actor Regression-DEA Analysis", "date": "2026-09-16", "year": "2026", "journal": "Sustainability", "issn": "20711050", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Dikky Indrawan", "Iskandar Zulkarnaen Siregar", "Asaduddin Abdullah", "Alim Setiawan Slamet", "Heti Mulyati", "Iman Kasiman Nawireja", "Indah Yuliasih", "Xue-Ming Yuan", "Chaik Ming Koh", "Puay Guan Goh", "Roni Jayawinangun", "Ghina Kamilia"], "abstract": "Background: Indonesia is the world’s third-largest banana producer, yet its value chains remain structurally fragmented, with pervasive information asymmetries and substantial technical inefficiencies among smallholder farmers. Research integrating relational governance determinants with frontier efficiency analysis across upstream, middle, and downstream actors remains limited. Methods: A cross-sectional survey comprising 251 respondents (237 farmers, 5 wholesalers, and 9 retailers) was conducted across Cianjur, Lumajang, and Lampung, of whom 194 provided valid complete cases (181 farmers, 5 wholesalers, and 8 retailers). Constructs used reflective multi-item scales adapted from established supply chain governance literature; validity and reliability were confirmed through confirmatory factor analysis (Cronbach’s α = 0.731–0.941; composite reliability = 0.746–0.940; average variance extracted = 0.348–
