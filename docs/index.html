armers, and 27.2% logistics professionals, the analysis explores IoT familiarity, practical exposure, perceived barriers, investment intentions, and factors associated with wider IoT integration across different positions in the agri-food system. The findings reveal moderate familiarity with IoT, while 61.3% of respondents reported practical exposure through use or observation. Perceived IoT usefulness did not differ significantly across professional groups, whereas several implementation barriers showed role-specific differences. Investment intention was positively associated with perceived usefulness (odds ratio = 3.56, p < 0.001) and positive expectations regarding the future role of IoT (odds ratio = 1.85, p = 0.016), while difficulty in converting IoT-generated data into useful information was negatively associated with investment intention (odds ratio = 0.71, p = 0.004). Perceived financial cost was not independently significant (p = 0.203). By linking broadly shared perceptions of IoT value with role-specific implementation conditions, the study provides implications for targeted support measures, capacity-building initiatives, and digitalization policies aimed at facilitating implementation and the wider practical integration of IoT into sustainable agri-food logistics.", "oa_url": "https://doi.org/10.3390/su181910139", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["Internet of Things", "agri-food logistics", "supply chain sustainability", "perceived usefulness", "investment intention", "implementation barriers", "IoT adoption", "digitalization"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7220437658", "doi": "10.3390/agriculture16192143", "title": "Understanding Farmers’ Behavioral Intention to Adopt Digital Agricultural Technologies Under Climate Change: An Extended TPB Model from a Climate-Vulnerable Paddy Community in Sri Lanka", "date": "2026-10-04", "year": "2026", "journal": "Agriculture", "issn": "20770472", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["H. B. T. P. Jayathilaka", "Shiyan Zhai", "Baye Terefe", "V. P. I. S. Wijeratne", "Yuke Feng", "Changchang Dong"], "abstract": "Digital Agricultural Technology (DAT) adoption remains poorly understood in climate-vulnerable tropical islands. To address this gap, this study examines how demand, supply, and environmental dimensions interact to shape farmers’ adoption decisions, applying the extended Theory of Planned Behavior. The data were collected from 400 farmers selected randomly in the Anuradhapura District, Sri Lanka, using a structured questionnaire. The analyses were conducted a Partial Least Squares Structural Equation Model. Four behavioral segments were identified: confident adopters (29.5%), utility-driven emerging adopters (42%), uncertain users (20.5%), and skeptical users (8%). Climate change awareness (β = 0.712), attitude (β = 0.297), social norms (β = 0.197), perceived behavioral control (β = 0.130), perceived usefulness (β = 0.162), access to infrastructure (β = 0.098), and risk aversion (β = 0.142) positively influenced farmers’ intention toward DAT. Climate change awareness strongly influenced attitudes, highlighting the central role of environmental dimensions. Institutional support had no significant effect. Behavioral intention and actual adoption (β = 0.575) influenced the willingness to continue DAT. Policymakers should move from ‘one-size-fits-all’ digital extensions to segment-specific interventions: peer-led networks for confident adopters, subsidies for utility-driven farmers, social learning for uncertain users, and in-person training for skeptical users. The study provides context-specific evidence that demonstrates how behavior shapes farmers’ adoption pathways under climate change, addressing SDGs 1, 2, 9, 12, 13, and 15.", "oa_url": "https://doi.org/10.3390/agriculture16192143", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["climate change vulnerability", "extended theory of planned behavior", "climate change awareness", "paddy farmers", "perceived usefulness", "perceived behavioral control", "risk aversion", "institutional support"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7218351374", "doi": "10.9734/jsrr/2026/v32i104563", "title": "The Future of Agricultural Extension and Economics: Integrating Artificial Intelligence, Behavioural Science, Climate Resilience and Inclusive Markets", "date": "2026-10-03", "year": "2026", "journal": "Journal of Scientific Research and Reports", "issn": "23200227", "publisher": "Sciencedomain International", "authors": ["Manish Kanwat", "Santosh Kumar", "Naveen Kh", "Keshab Gogoi"], "abstract": "Agricultural extension is being reshaped by four simultaneous pressures: the arrival of low-cost digital and artificial-intelligence-based advisory tools, the reframing of farmer decision-making by behavioural economics, the intensification of climate risk and the restructuring of agri-food markets. These developments are usually reviewed in separate literatures, which obscures how they interact in determining whether advice changes practice and whether practice change raises and protects smallholder incomes. This critical narrative review examines that interaction. Peer-reviewed economics, agricultural, computer-science and climate-services literature published from 2004 to July 2026 was identified through multidisciplinary scholarly indexes, economics repositories, institutional sources and citation tracking, and was appraised with particular attention to identification strategy, external validity, field validation and distributional analysis. The evidence indicates that digitally delivered advice produces modest but cost-effective improvements in adoption, whereas effects on yields, prices and incomes are inconsistent. Image-based diagnostic models achieve high accuracy on curated datasets but lose performance under field conditions, and large language models remain supported mainly by design studies, benchmark tests and surveys of extension staff rather than by evaluations of farm outcomes. Behavioural mechanisms, particularly limited attention, present bias and social learning through well-chosen messengers, are well documented, yet generic nudges and behavioural framings frequently show small or null effects. Climate information services and risk-reducing technologies can crowd in investment, but uptake is strongly conditioned by farmers' resources, gender and trust. Market information alone rarely improves farm-gate prices where intermediaries hold bargaining power, and gains appear larger when market access rewards quality or relaxes liquidity constraints. The review proposes an integrated framework in which advisory technology is necessary but insufficient, and in which risk, liquidity, market structure and social position determine the returns to information. Priorities include field trials of generative advisory systems with safety outcomes, bundled designs that address several binding constraints, evaluation at scale and governance arrangements for agricultural data. The central conclusion is that the future of extension depends less on the sophistication of advisory algorithms than on their integration with institutions that manage risk and distribute market gains.", "oa_url": "https://doi.org/10.9734/jsrr/2026/v32i104563", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["agricultural extension", "large language models", "behavioral economics", "climate resilience", "agri-food market", "smallholder income", "technology adoption", "nudging"], "topics": ["Akses & informasi pasar petani", "Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 58}, {"id": "W7218780787", "doi": "10.1016/j.indic.2026.101555", "title": "Multidimensional sustainability assessment of Indonesia's emerging konjac agrifood system: A case study in Sidenreng Rappang", "date": "2026-10-03", "year": "2026", "journal": "Environmental and Sustainability Indicators", "issn": "26659727", "publisher": "Elsevier BV", "authors": ["Syaharuddin Alrif", "Rahim Darma", "Muhammad Hasbi", "Reza Asra"], "abstract": "Konjac ( Amorphophallus muelleri ), locally known as porang, is an emerging bio-based commodity with the potential to support rural livelihoods, export diversification, and domestic value addition in Indonesia. However, production expansion may not generate sustainable outcomes unless ecological suitability is supported by technological capacity, resilient markets, inclusive social arrangements, and effective institutional coordination. This study assessed the multidimensional sustainability and transition readiness of the konjac agrifood system in Sidenreng Rappang Regency, South Sulawesi. Transition readiness was diagnosed from dimensional performance, disparities among dimensions, root mean square leverage scores, and policy priorities. An adapted RAPFISH multidimensional scaling approach termed RAP-Konjac assessed 27 attributes across economic, social, environmental, technological, and institutional dimensions using 32 purposively selected key informants. The system was moderately sustainable overall (mean index 57.41), but varied substantially across dimensions. Environmental sustainability achieved the highest index (67.73), whereas technology was the lowest (48.80) and was the only less sustainable dimension. Monte Carlo analysis confirmed classification stability. Leverage analysis identified supply chain efficiency, export market dependence, industrial processing, agricultural extension, partnership effectiveness, seed variety conservation, and pest and disease management as priority intervention points. The findings demonstrate that ecological potential alone is insufficient for sustainable transformation. Policy should prioritize post-harvest and processing technologies, domestic value addition, market diversification, extension, inclusive partnerships, and ecological safeguards. Nevertheless, the assessment is limited by its case study scope, purposive informant selection, stakeholder scoring, and cross-sectional design; thus, findings are context-specific and require validation through longitudinal research and applications in other konjac-producing regions.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2665972726004447/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2665972726004447/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["konjac", "Amorphophallus muelleri", "RAPFISH", "transition readiness", "leverage analysis", "supply chain efficiency", "agricultural extension", "pest and disease control"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7220388580", "doi": "10.3390/su181910109", "title": "Soil Health Under Climate Change: A Review of Climate Impacts, Sustainable Management Strategies, and Future Directions", "date": "2026-10-03", "year": "2026", "journal": "Sustainability", "issn": "20711050", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Muhammad Irfan", "Gamal El Afandi", "Santosh Sapkota", "Md Rafique Ahasan Chawdhery"], "abstract": "Soil health is fundamental to sustainable agriculture, crop productivity, and vital ecosystem services. However, climate change increasingly threatens the functional integrity of soil due to rising temperatures, altered precipitation patterns, elevated atmospheric carbon dioxide levels, and extreme weather events. These factors accelerate soil degradation and disrupt the physical, chemical, and biological processes essential for maintaining soil health. This review synthesizes recent evidence regarding the impacts of climate change on soil health and crop production, while also evaluating sustainable management strategies designed to enhance agricultural resilience. Techniques such as conservation agriculture, organic matter management, diversified cropping systems, and integrated nutrient management can improve soil structure, nutrient cycling, water retention, carbon sequestration, and overall crop productivity. Furthermore, emerging technologies offer new opportunities for real-time, site-specific, and data-driven soil management. These technologies include remote sensing, geographic information systems, artificial intelligence, digital agriculture, and advanced soil monitoring tools. Additionally, policy and socioeconomic factors—particularly financial incentives, extension services, and institutional support—are critical in encouraging farmers to adopt these practices. Despite recent advancements, challenges such as economic barriers, technological limitations, regional variability, and a lack of long-term evidence hinder the widespread implementation of sustainable soil health practices. This review provides an integrated perspective that links climate-driven changes in soil’s physical, chemical, and biological properties with sustainable management practices, emerging technologies, and policy support. It highlights the interactions and trade-offs among these components to promote climate-resilient and sustainable agricultural systems.", "oa_url": "https://doi.org/10.3390/su181910109", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["soil health", "climate change impacts on soil", "soil degradation", "sustainable soil management", "conservation agriculture", "soil organic matter management", "diversified cropping systems", "integrated nutrient management"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 30}, {"id": "W7216066205", "doi": "10.3390/su181910073", "title": "Co-Designing Local Water Security: A Participatory Comparative Case Study of Perceived Climate Risks in Northeastern Thailand", "date": "2026-10-02", "year": "2026", "journal": "Sustainability", "issn": "20711050", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Chaiwatchara Promjittiphong", "Phongphat Maijandee", "Bundid Sumret", "Phuthida Praelaun"], "abstract": "Khon Kaen Province in Northeastern Thailand is repeatedly exposed to both floods and droughts, undermining agricultural livelihoods. This study examines perceived climate risks and adaptive governance through a participatory action research (PAR) approach at four reservoir communities of the Khon Kaen Irrigation Project—Huai Sai, Huai Toei, Huai Yang, and Laloeng Wai. Using a mixed-methods design, the study combined semi-structured interviews with 12 irrigation officials, focus group discussions with Joint Management Committees, community workshops with 240 residents, and a household survey (N = 400). Perceived risk levels, evaluated using a study-specific composite index based on the IPCC AR6 framework, were moderate at Huai Sai (11.02) and low at Huai Toei (8.81), Huai Yang (7.90), and Laloeng Wai (7.68). Because perceived hazard, exposure and vulnerability showed substantially overlapping 95% confidence intervals across sites, collective response capacity was the dimension that varied most widely across sites and the dimension to which the index is structurally most sensitive. Through participatory STEEP prioritization workshops, all four communities identified economic drivers as their primary concern, reflecting seasonal income fragility alongside strong social capital. To address these economic priorities within local water constraints, a pilot agricultural prototype—cultivating Hom Thong banana under localized drip irrigation—was co-designed with provincial agricultural and irrigation agencies. The prototype was installed to specification, and the stand had established and reached full vegetative growth approximately two months after planting; no participant feedback, satisfaction or yield data were collected during the reporting period. This comparative case study documents the process of co-designing a localized, risk-informed adaptive strategy with communities and public agencies, and the feasibility of implementing it at one site; whether such strategies build community resilience remains to be tested.", "oa_url": "https://doi.org/10.3390/su181910073", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["water security", "adaptive governance", "irrigation project management", "flood and drought risk", "community resilience", "co-design", "drip irrigation", "banana cultivation"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7216009437", "doi": "10.1186/s40066-026-00623-x", "title": "Analysis of the maize and groundnut seed value chains in central and northern Tanzania", "date": "2026-10-02", "year": "2026", "journal": "Agriculture & Food Security", "issn": "20487010", "publisher": "BioMed Central", "authors": ["MacDonald Bright Jumbo", "James Kyalo Mwololo", "Julius Manda", "Philip Kamau", "Wills Munthali", "P. Okori", "Dan Makumbi", "Hapson Mushoriwa", "Irmgard Hoeschle‐Zeledon", "Mateete A. Bekunda", "Walter Chivasa", "BM Prasanna"], "abstract": "Abstract Background Maize and groundnut are important crops in Tanzania; therefore, understanding their seed value chains (VCs) is critical for improving the seed systems. The study aimed at establishing key components for model maize and groundnut seed VCs by understanding the formal and informal seed VCs to provide relevant recommendations for; improving these value chains, propose interventions that would encourage more investment by seed companies, and improve access to quality seed by farmers. The study used data collected through survey, with a sample size of 252 and 162 seed producing households for maize and groundnut, respectively, conducted using structured questionnaire. VC actors including; seed companies, agricultural research institutions, agrodealers, seed regulatory authority, public seed production agency, extension staff and Ministry of Agriculture, were also interviewed. Porter’s value chain approach was applied to analyse the various components of the VC and identify the links between the key nodes and understand their operational functions. Results The maize seed producing households were dominated by men (71%) while for groundnut, women (69%) were engaged in seed production. Government agricultural extension services are the main source of information; 30% and 58%, for maize and groundnut, respectively. Seed companies were the main producers of maize seed (51.7%) while for groundnut, public research institutions were the main seed producers. Most of business enterprises were owned by men (83.3%). Compared to maize, the formal seed sector is weak for groundnut in Tanzania, with very few private seed companies being engaged in seed production and supply. Most groundnut seeds are accessed through agrodealers and seed associations that produce quality declared seed (QDS). Community seed banks were recognized as an efficient option for providing improved groundnut varieties to smallholder farmers. There are no prominent seed companies aggressively operating for both crops in central Tanzania. Excessive reliance on farm-saved seed by farmers was identified as one of the major factors negatively affecting the demand for certified seed. Stakeholder analysis of the seed production and supply chain showed that there was poor coordination between key stakeholders involved in the seed VC. Conclusion This study provides recommendations for strengthening the seed value chains in Tanzania by addressing identified gaps along the VC components. Future studies can build from the outcomes of this study and generate more information, especially on market and different seed systems, as these have great influence on demand and supply of seed.", "oa_url": "https://link.springer.com/content/pdf/10.1186/s40066-026-00623-x.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1186/s40066-026-00623-x.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["seed systems", "seed companies", "community seed banks", "farm-saved seed", "stakeholder coordination", "agricultural extension"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7215048149", "doi": "10.3389/fsufs.2026.1847726", "title": "Impact of cluster-farm participation on wheat efficiency and commercialization: practices from Northwest Ethiopia", "date": "2026-10-01", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Jianmin Cao", "Gizachew Wosene", "Desalegn Wondim"], "abstract": "Introduction Cluster farming has increasingly been promoted as a collective agricultural approach to improve smallholder productivity, market integration, and rural livelihoods in Ethiopia. Using Collective Action Theory, this study examines the factors influencing farmers’ participation in wheat cluster farming and its impact on production efficiency, and household wheat commercialization. Methods A multi-stage sampling procedure was used to collect cross-sectional data from 384 wheat-producing households in Northwest Ethiopia. The association between cluster farming participation and wheat efficiency and commercialization level was estimated using an endogenous switching regression model. Results The probit results show that sex, family size, land size, livestock holding, cooperative membership, extension contact, cluster farming-specific training and awareness are positively associated with participation in cluster farming, while distance from the cluster farming site is negatively associated with participation. The ESR estimates further suggest that participation in cluster farming has a significant positive impact on production efficiency and commercialization. The estimated ATT shows that participation increases technical efficiency (0.383), allocative efficiency (0.252), economic efficiency (0.105), and commercialization level (0.252). Similarly, the ATU estimates indicate significant potential benefits for non-participating households if they participate, with increases of 0.398, 0.291, 0.152, and 0.274 in TE, AE, EE, and HCI, respectively. The robustness propensity score matching result also confirms the ESR findings. Conclusion The results imply that collective farming is associated with farm performance through better access to productive resources, improved institutional support, reduced transaction costs, and enhanced market integration. The results highlight the need for fostering inclusive cluster farming through specific extension services, support to cooperatives, and better access to cluster sites, which is associated with the efficiency and commercialization level of farmers.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1847726/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1847726/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["cluster farming", "wheat production", "production efficiency", "collective action", "smallholder farmers", "agricultural cooperatives", "agricultural extension", "technical efficiency"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 51}, {"id": "W7215120523", "doi": "10.3389/fsufs.2026.1877088", "title": "From income diversification to market vulnerability: the risk–reward dynamics in Tanzanian horticultural value chains", "date": "2026-10-01", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Eziacka Mathew Mpelangwa", "Betty Waized", "Ruth Smith", "Jonas Cromwell", "Susannah M. Sallu", "Stephen Whitfield"], "abstract": "Introduction Export-oriented horticulture can generate substantial income and create market opportunities for smallholders, yet the governance of exchange may simultaneously create, redistribute or intensify risks. This study examines how governance arrangements shape risk–reward dynamics in orange, avocado and snow peas export value chains in Tanga Region, Tanzania. The cases represent informal, semi-formal and formal coordination, respectively. Methods Drawing from Social Exchange Theory, the study analyses how trust, dependency, power asymmetry and commitment operate through pricing, grading, payment, technical support and market access. Evidence was generated from 20 focus group discussions involving 179 participants, 23 in-depth interviews and nine key informant interviews, and analysed through deductive and inductive qualitative content analysis. Results Findings show that governance does not merely determine access to rewards; it conditions where risks emerge, how they are transmitted, and who ultimately bears them. Informal orange exchange sustained flexible market participation but exposed farmers to opaque pricing, selection and counting practices. Semi-formal avocado arrangements facilitated export access while concentrating grading, information and purchasing power among intermediaries. Formal coordination of snow peas reduced production and market-entry constraints through bundled services, but dependence on a dominant buyer concentrated systemic exposure, magnifying losses following the buyer withdrawal. Discussion Across cases, governance also mediated economic consequences of production and climatic shocks. The study demonstrates that greater coordination does not inherently reduce vulnerability, rather, it reconfigures risk. Effective governance therefore requires transparency, accountability, enforceable safeguards, diversified market access and mechanisms for sharing concentrated risks, while preserving the benefits generated by coordination.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1877088/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1877088/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["horticultural value chains", "market vulnerability", "value chain governance", "smallholder farmers", "orange", "avocado", "snow peas", "social exchange theory"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 50}, {"id": "W7215031512", "doi": "10.1016/j.ssaho.2026.103712", "title": "Personality traits, nutritional knowledge, and social capital as determinants of livelihood diversification under disaster risk: Evidence from livestock households in rural Indonesia", "date": "2026-10-01", "year": "2026", "journal": "Social Sciences & Humanities Open", "issn": "25902911", "publisher": "Elsevier BV", "authors": ["Jaisy Aghniarahim Putritamara", "Agus Eko Nugroho", "Tina Sri Purwanti", "Agussabti", "Sitti Bulkis", "David Ponka"], "abstract": "Building resilience in rural livelihoods against disasters and climate change is a major global challenge. Most existing models of livelihood diversification and disaster adaptation focus mainly on structural and economic factors, with less attention to the household behavioral and psychological characteristics that shape adaptive decision making under repeated shocks. This study examines how personality traits mediate the relationships between nutritional knowledge, market integration, and social capital, and the livelihood diversification strategies of livestock-raising households. In doing so, it addresses a gap in disaster risk and rural development research, which rarely incorporates psychological traits into diversification models. The research focuses on livestock households in disaster-prone regions of Indonesia: Aceh, Nusa Tenggara Timur, and South Sulawesi. Using data from a cross-sectional survey of 602 such households (response rate ≈ 94%), the study applied Partial Least Squares Structural Equation Modeling (PLS-SEM) to examine mediation and moderation relationships among structural, cognitive, and behavioral factors. The measurement model showed reliability and validity (CR ≥ 0.70; AVE ≥ 0.50 with all indicator loadings above 0.70). The results indicate that nutritional knowledge and social capital are positively associated with livelihood diversification, both directly and indirectly through personality traits. Market integration, by contrast, had no significant direct association with diversification but did operate indirectly through personality traits, showing the importance of behavioral pathways that connect structural opportunities to livelihood strategies. Among the structural model factors, personality traits showed the strongest direct association with diversification, which suggests that behavioral dispositions are important determinants of livelihood diversification. Farm size significantly moderated the relationship between personality traits and diversification, meaning that resilience strategies differ by operational scale. By incorporating psychological factors into diversification models, this study offers new empirical evidence that livelihood resilience arises from the interaction between external resources and internal behavioral capacities. These findings suggest the potential value of combined interventions that pair nutrition education with behavioral skill building, strengthen market participation alongside entrepreneurial and risk management skills, and tailor social capital efforts to differences in farm scale. This research contributes to disaster risk and rural development scholarship by proposing a behavioral structural framework that integrates psychological traits with nutrition knowledge, market integration, and social capital to explain livelihood diversification among climate-vulnerable agricultural households.", "oa_url": "https://doi.org/10.1016/j.ssaho.2026.103712", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["personality traits", "nutrition knowledge", "social capital", "livelihood diversification", "disaster risk", "rural households", "household resilience"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 50}, {"id": "W7215069280", "doi": "10.3389/fsufs.2026.1930171", "title": "Determinants of farmers’ willingness to adopt technologies for the agroecological and precision management of potato pests and diseases in Rwanda", "date": "2026-10-01", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Judicael S. O. Ganta", "Antoine Karangwa", "Peace Bamurigire", "Nicodème V. Fassinou Hotegni", "Enoch Gbenato Achigan-Dako", "Vincent de Paul Bigirimana"], "abstract": "Introduction Potato ( Solanum tuberosum L. ) production in Rwanda is limited by pests and diseases, resulting in significant yield losses and increased use of synthetic pesticides. Despite growing interest in sustainable agriculture, few studies provide empirical evidence on farmers’ knowledge of agroecological pest management practices and precision agriculture in Rwanda. This study assessed farmers’ management practices, awareness and perceptions of agroecological practices and precision agriculture technologies, as well as factors that may influence the willingness to adopt precision agriculture tools in smallholder potato systems. Methods A farm household survey using a semi-structured questionnaire was conducted among 223 potato farmers in three districts of Rwanda (i.e., Rubavu, Gicumbi, and Nyamagabe) in July 2025. Descriptive statistics, Chi square tests, and Fisher’s exact tests were used to analyze farmers’ practices and perceptions. A Firth-penalized logistic regression model, constructed based on a purposeful selection of covariates strategy, was used to identify factors associated with farmers’ willingness to adopt precision agriculture technologies. Results Findings revealed that pests and diseases were the main production constraints, with bacterial wilt, viruses, late blight, and whiteflies being the most frequently cited. Farmers primarily used synthetic pesticides to manage aerial pests and foliar diseases, while preventive agronomic practices were used to manage soil-borne pests and diseases. The use of biopesticides remained extremely limited and farmers were aware of the negative impacts of pesticide misuse and expressed a strong willingness to adopt better pest management practices. Knowledge of precision agriculture technologies was mainly limited (79%). Farmers associated precision agriculture primarily with mechanization, whereas awareness of drones, sensors and digital decision-support tools was limited. They demonstrated highly positive perceptions toward precision agriculture (90%) and a strong willingness to learn more (87%). The results of the logistic regression showed that mobile phone usage (OR = 20.58, p < 0.01) and the willingness to adopt agroecological practices (OR = 67.73, p < 0.001) were associated with a higher likelihood of expressing willingness to adopt precision agriculture technologies. Discussion These results highlight the opportunity to integrate precision agroecology approaches in Rwanda. Mobile-based advisory systems and low-cost digital technologies could serve as effective entry points for promoting sustainable potato production systems among smallholder farmers.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1930171/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1930171/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["precision agriculture", "agroecological pest management", "technology adoption", "smallholder farmers", "farmer perceptions", "mobile phone use", "biopesticides", "bacterial wilt"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 48}, {"id": "W7215123040", "doi": "10.3389/fsufs.2026.1914989", "title": "Does rural digitalization improve food production security? Evidence from China’s digital village construction policy", "date": "2026-10-01", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Meng Zhao", "Jianhua Wang", "Jiaqing Zhang", "Zixuan Ai"], "abstract": "Introduction Food production security (FPS) remains a core challenge for developing economies. Although rural digitalization serves as a fundamental strategy to reshape agricultural systems in developing countries, its impact on food supply resilience remains underexplored. Methods This study investigates the impact of rural digitalization on regional FPS by exploiting China’s Digital Village Construction policy as a quasi-natural experiment. We employ the DID model on a panel dataset comprising 334 prefecture-level cities from 2015 to 2024. Results The empirical results demonstrate that rural digitalization significantly improves regional FPS. Specifically, the digital intervention increases the FPS of treated cities by an average of 8.2 percent. Regarding the mechanisms, we find that rural digitalization enhances FPS by facilitating smallholders’ food production viability and promoting food-oriented land reallocation. Furthermore, heterogeneity analyses reveal that the impact is more pronounced in regions equipped with superior agricultural socialized services, advanced agricultural industry structures, and major food producing area designations. Discussion These findings demonstrate that comprehensive rural digitalization strengthens the resilience of food production systems in developing economies and offer guidance for other Global South countries pursuing similar rural development paradigms.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1914989/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1914989/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["rural digitalization", "food supply resilience", "smallholder farmers", "agricultural socialized services", "agricultural industry structure", "rural development", "China"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 44}, {"id": "W7221315575", "doi": "10.1016/j.srs.2026.100520", "title": "Mapping long-term fractional forest cover dynamics in the Leuser Ecosystem, Indonesia by integrating historical imagery and Landsat observations spanning the 1960s to 2020", "date": "2026-10-01", "year": "2026", "journal": "Science of Remote Sensing", "issn": "26660172", "publisher": "Elsevier BV", "authors": ["Muhammad Budi", "Dan‐Xia Song", "Tao He"], "abstract": "A B S T R A C T The Leuser Ecosystem (LE), Indonesia, is one of the most important tropical forest landscapes, yet its long-term fractional forest cover (FFC) dynamics remain poorly documented because observations extending into the pre-Landsat era are limited. We integrated Corona imagery from 1965, Landsat MSS observations from 1972–1974, and multi-sensor Landsat data from 1988–2020 to reconstruct long-term FFC dynamics. Object-based image analysis (OBIA) was applied to Corona imagery to derive a 30 m historical FFC baseline, while PlanetScope-3B reference FFC was used to train a random forest (RF) model for Landsat-based FFC estimation, generating isolated FFC snapshots from the available MSS observations for 1972–1974. An adapted continuous change detection and classification (CCDC) framework subsequently reconstructed vegetation-index (VI) trajectories and generated date-specific daily FFC estimates from 10 January 1988 to 17 November 2020. Independent validation showed good agreement with PS-3B reference FFC (R 2 = 0.71, RMSE = 0.16), while complementary cross-product assessments using GFW-FFC for 2000 and 2010 (R 2 = 0.55 and 0.49, respectively) and three non-Landsat FFC products for 2020 revealed substantial product-dependent differences in cross-product agreement. Trend analysis for 1988–2020 identified significant positive FFC trends over 77.39% of the analyzed area, negative trends over 6.40%, and no significant trend over 16.21%. However, positive FFC did not necessarily represent natural forest recovery; selected trajectories in documented oil-palm and plantation landscapes showed post-disturbance FFC increases consistent with plantation establishment and canopy maturation. This study extends the temporal perspective of tropical FFC monitoring and provides a transferable framework for interpreting long-term forest-cover dynamics and supporting conservation and land-management planning.", "oa_url": "https://doi.org/10.1016/j.srs.2026.100520", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["Leuser Ecosystem", "historical satellite imagery", "CORONA imagery", "Landsat MSS", "Landsat time series", "Continuous Change Detection and Classification", "oil palm expansion", "plantation establishment"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7220704366", "doi": "10.1016/j.soisec.2026.100253", "title": "Perceptions and Adaptive Responses to Soil Salinity in Irrigated Systems of the Abaya–Chamo Lakes Basin, Ethiopia", "date": "2026-10-01", "year": "2026", "journal": "Soil Security", "issn": "26670062", "publisher": "Elsevier BV", "authors": ["Yohannes Golida Apira", "Dereje Tsegaye Salfeko", "Tizita Endale", "Azmera Walche"], "abstract": "Soil salinization threatens agricultural sustainability, food security, and essential soil functions in arid and semi-arid regions, including Ethiopia's Abaya–Chamo Lakes Basin. This study assessed smallholder farmers' perceptions of soil salinity and their adaptive strategies within irrigated farming systems. A mixed-methods design was employed, drawing on household survey data from 380 farmers selected through multistage stratified random sampling across five purposively selected kebeles, complemented by key informant interviews, focus group discussions, and field observations. Data were analyzed using both descriptive and inferential statistical techniques: descriptive statistics summarized household profiles, farm-level attributes, and socioeconomic conditions, while multinomial logistic regression identified the determinants of adaptation choices. Most farmers rated salinity severity as severe (98.9%) and chronic (50.5%), while technical awareness of salinity dynamics remained moderate (51.3%). Salinity moderately affected cultivated land for 53.9% of respondents and caused severe yield losses for 65.0% of farmers, particularly in banana (43.2%) and maize (33.9%) production systems. Farmers' vulnerability was compounded by heavy dependence on on-farm income (47.9%) and limited livelihood diversification (81.6%). Dissatisfaction with institutional support for salinity management was widespread (91.9%), reflected in a low mean satisfaction score of 1.45. Farming experience, landholding size, labor availability, and income diversification significantly influenced adaptation and coping decisions. The findings reveal a capacity–vulnerability paradox, whereby better-resourced farmers adopt more advanced adaptation measures yet may still incur larger absolute income losses. Strengthening resilience in the study area therefore requires integrated interventions that combine technical salinity management, enhanced institutional support, and livelihood diversification.", "oa_url": "https://doi.org/10.1016/j.soisec.2026.100253", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["soil salinity", "irrigated agriculture", "adaptive response", "farmer perceptions", "saline soils", "waterlogging"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 41}, {"id": "W7220952818", "doi": "10.1002/ndr2.70150", "title": "First Report of Fusarium oxysporum f. sp. cubense Tropical Race 4 Causing Fusarium Wilt to Bananas in Ecuador", "date": "2026-10-01", "year": "2026", "journal": "New Disease Reports", "issn": "20440588", "publisher": "Wiley", "authors": ["S. Pachacama", "Diane Mostert", "J. Guevara", "M. Fernández", "Hernando Regalado", "W. Enríquez", "L. Rivera", "Carlos Muentes", "M. Iza‐Arteaga", "I. Garzón", "Freddy Magdama", "E. Paredes"], "abstract": "Banana (Musa spp.) is one of Ecuador's most important export commodities, valued at USD 3.6 billion in 2024, equating to nearly 3% of the national gross domestic product (GDP). The industry notably contributes to the advancement of the socio-economy of the country by employing around 2 million people throughout the supply chain (Sistema de Información Pública Agropecuaria 2026). In August 2025, typical vascular wilt symptoms were observed in three Cavendish banana plants on a 7-ha farm located in the Santa Rosa canton in El Oro province, Ecuador (3°27′12.22″ S, 79°55′55.86″ W). Affected plants displayed wilting and progressive leaf yellowing. Upon internal examination of the pseudostem, a distinct dark red to brown vascular discoloration was observed (Figure 1). Pseudostem samples were collected from two diseased plants, from which fungal isolations were made. Small pseudostem pieces where healthy and diseased tissue met were surface sterilized with a 70% ethanol solution for 30 s, plated onto potato dextrose agar (PDA) amended with 0.04 g/L streptomycin, and incubated for 7 days at 25°C. The two fungal colonies that developed, one from each diseased plant, were then purified, single-spored and deposited in the culture collection at Stellenbosch University (CAV 6135 and CAV 6136). Cultural and morphological characteristics of the two isolates were studied by growing the cultures on PDA and carnation leaf agar (CLA). White colonies with purple centers developed on PDA, while falcate macroconidia with two to five septa, abundant microconidia borne in false heads on short monophialides, and globose chlamydospores were observed on CLA after 10 days. Observed characteristics were typical of those of the Fusarium oxysporum species complex (Leslie and Summerell 2006). Molecular identification was then performed using a F. oxysporum f. sp. cubense tropical race 4 (Foc TR4)-specific polymerase chain reaction (PCR; Li et al. 2013) and two qPCR assays (Aguayo et al. 2017; Matthews et al. 2020). DNA extracted from the two Ecuadorian isolates was positively identified with amplification similar to that of the positive control. Vegetative compatibility (VCG) testing was also conducted by pairing nit mutants generated from the two Ecuadorian isolates with universal VCG testers of VCG 01213/16, and heterokaryon formation confirmed complementation (Leslie and Summerell 2006) (Figure 2). To confirm pathogenicity, the two Ecuadorian isolates and a reference strain of Foc TR4 (CAV 789, from Australia) were infected on 2-month-old Cavendish banana plants. Three plants were inoculated per isolate, and the experiment was repeated. During inoculation, roots were immersed in a conidial suspension (1 × 106 conidia/mL) for 2 h, while the negative control plants were treated with sterile water. Plants were planted in a 1:1:1 soil:sand:peat substrate and kept under controlled environmental conditions (27°C, 60% relative humidity). Within 4 weeks, the Foc TR4-inoculated plants developed typical Fusarium wilt symptoms, including foliar yellowing and internal rhizome necrosis. Negative control plants remained symptomless (Figure 3). The pathogen was re-isolated from symptomatic tissues and identified as Foc TR4 with a loop-mediated isothermal amplification assay (Ordóñez et al. 2019), thus fulfilling Koch's postulates and confirming the presence of the pathogen in Ecuador. The detection of Foc TR4 represents a significant threat to banana production in Ecuador and highlights the importance of continued surveillance and containment efforts.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/ndr2.70150", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/ndr2.70150", "oa_status": "diamond", "cited_by": 0, "keywords": ["Fusarium oxysporum f. sp. cubense", "tropical race 4", "Fusarium wilt", "banana", "plant pathogenic fungi", "first report", "Ecuador"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 35}, {"id": "W7221790056", "doi": "10.1016/j.jfca.2026.109590", "title": "Retail-driven variations in heavy metal contamination of commercial fruits and associated health risks in Bangladesh", "date": "2026-10-01", "year": "2026", "journal": "Journal of Food Composition and Analysis", "issn": "08891575", "publisher": "Elsevier BV", "authors": ["Arthita Barua", "Mahdi Al Hasan Rahat", "Ayesha Begum", "Tasnea Khanom", "Mohammad Mozibul Haque", "Mohammad Moniruzzaman", "Sha Md. Shahan Shahriar"], "abstract": "Increasing fruit consumption requires effective monitoring of heavy metal contamination; however, supply chain-specific data remain limited. Therefore, this study quantified As, Pb, Cd, Cr, and Hg in five commercially important fruits (banana, guava, mango, papaya, and pineapple) collected from production sites, local markets, and supermarkets in Chattogram, Bangladesh, to assess contamination risks across the supply chain. Quantification via ICP-MS revealed that Cr was the most prevalent contaminant, peaking in mangoes (1.958 mg/kg). Hg concentrations in guavas (0.691 mg/kg) and bananas (0.478 mg/kg) exceeded the FAO/WHO limit. As no certified reference value for Hg was available, these results are considered preliminary and require independent confirmation. A strong correlation between As and Hg (r = 0.69) suggested a possible common source, whereas Pb exhibited a distinct pattern in the principal component analysis. The Hazard Index (HI) reached 24.60, with Hg accounting for 65.7% of the non-carcinogenic risk. The cumulative carcinogenic risk exceeded the acceptable threshold (1.0 × 10⁻⁴), primarily due to Cr, although these estimates are conservative because ICP-MS measured total Cr rather than Cr (VI). This study provides the first baseline data on heavy metal contamination in commercial fruits across the Chattogram supply chain, highlighting the need for targeted regulatory monitoring despite the study's cross-sectional design and limited sample size.", "oa_url": "https://doi.org/10.1016/j.jfca.2026.109590", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": [], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 34}, {"id": "W7215127260", "doi": "10.3389/frfst.2026.1931174", "title": "Oil palm fiber extract as a fermentable functional ingredient: in vitro gastrointestinal carbohydrate hydrolysis, feline fecal fermentation, and microbiota-associated metabolite production", "date": "2026-10-01", "year": "2026", "journal": "Frontiers in Food Science and Technology", "issn": "26741121", "publisher": "Frontiers Media", "authors": ["Kristina Dea Ivanalie", "Uchenna Kalu Akpi", "Yada Duangnumsawang", "Chutha Takahashi Yupanqui", "Santad Wichienchot"], "abstract": "Obesity-associated gastrointestinal disturbances in companion animals have increased interest in dietary ingredients that may modulate intestinal fermentation and microbial metabolism. This study evaluated the in vitro gastrointestinal digestion, fecal fermentation, microbiota responses, and metabolite production associated with oil palm fiber extract (OPF) in a feline gastrointestinal model. OPF, commercial feline diet (CFD), OPF-supplemented CFD (OPF+CFD), and commercial weight-control diet (WCD) were subjected to simulated gastrointestinal digestion followed by 24 h of anaerobic fecal fermentation. Fecal samples from nine cats were pooled to prepare a common inoculum. Carbohydrate hydrolysis of OPF following simulated gastrointestinal digestion was 4.01% ± 0.54%, indicating limited hydrolysis under the experimental conditions. Phenolic and flavonoid-equivalent responses were retained after digestion, although values exceeding 100% were interpreted as increased assay responses rather than recovery above the initial values. During fermentation, OPF was associated with increased concentrations of acetate, propionate, and butyrate, together with changes in branched-chain fatty acids. Microbiome profiling indicated treatment-associated changes in bacterial community composition and diversity patterns. LC-QTOF-MS analysis detected several phenolic-related metabolites in OPF-containing treatments after fermentation, including hydroxyphenylpropionic acid- and coumarin-related compounds. However, these metabolites were tentatively annotated, and their formation from specific OPF precursors was not directly demonstrated. Because each treatment was represented by a single fermentation vessel using the pooled fecal inoculum, analytical replicates were not considered independent biological replicates; consequently, microbiome and fermentation findings were interpreted descriptively. Overall, the results provide preliminary in vitro evidence that OPF can undergo gastrointestinal processing and subsequent fecal fermentation, with associated changes in fermentation metabolites and microbial community profiles. Further studies using independent donors, biological fermentation replicates, quantitative metabolite validation, and controlled feeding trials are required to establish the physiological relevance, efficacy, and safety of OPF in cats.", "oa_url": "https://www.frontiersin.org/journals/food-science-and-technology/articles/10.3389/frfst.2026.1931174/pdf", "pdf_url": "https://www.frontiersin.org/journals/food-science-and-technology/articles/10.3389/frfst.2026.1931174/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["feline diet", "cats", "gastrointestinal digestion", "fecal fermentation", "gut microbiota", "short-chain fatty acids", "branched-chain fatty acids", "phenolic metabolites"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7214895210", "doi": "10.1016/j.nxmate.2026.103666", "title": "Groove angle and quenching medium in shielded metal arc welding of mild steel: Multi-criteria decision analysis, machine learning and energy absorption", "date": "2026-10-01", "year": "2026", "journal": "Next Materials", "issn": "29498228", "publisher": "Elsevier BV", "authors": ["Ignatius Echezona Ekengwu", "Bonaventure Onyeka Ekengwu", "Ikechukwu Geoffrey Okoli", "Obiora Clement Okafor"], "abstract": "Weld groove geometry and post-weld cooling regime are among the least systematically investigated factors influencing the performance of arc-welded joints, and even when they have been studied, the analysis has almost always been limited to a single optimisation criterion. This paper re-examines shielded metal arc welding of AISI/SAE 1020 mild steel across a 55–60° single-V groove range and three quenching media (air, water, palm oil), using six mechanical responses, and advances the analysis in four directions. First, a normalised Type III effect-share analysis establishes the practical rather than merely statistical weight of each factor: the quenching medium accounts for 70.3–94.6% of the estimated effect across the six responses, while groove angle accounts for 4.4–25.7%, and the factor interaction never exceeds 3.2%. Second, the tensile records are reconciled against the reported applied loads, recovering the specimen cross-sections actually used and permitting two derived responses that the original analysis did not report: the modulus of toughness, which orders the media 8.68, 5.96 and 3.66 MJ m⁻³ for air, water and palm oil, and the Hollomon strain-hardening exponent, obtained on true stress and true plastic strain axes, which falls from 0.528 for air-cooled weldments to 0.292 and 0.253 for water- and oil-quenched material. Third, four independent multi-criteria schemes, namely Shannon-entropy-weighted grey relational analysis, equal-weight grey relational analysis, the technique for order of preference by similarity to ideal solution, and Derringer–Suich desirability, are applied to the same candidate set, and all four return the same ordering. Fourth, machine-learning surrogates of the recovered stress–strain records locate where the medium acts: over the strain interval common to all three media a functional analysis of variance attributes only 1.16% of the stress variance to the medium, and truncating the comparison at that strain reverses the ordering, so the advantage of air cooling is one of extensibility rather than strength. Gaussian-process sampling returns credible intervals near ±9% on the toughness values and preserves the ranking in every draw. The convergence of four aggregation philosophies, combined with the independent evidence of the energy-absorption analysis, establishes a 60° single-V groove with unforced air cooling as a weight-robust rather than merely method-dependent optimum for structural weldments in thin-section low-carbon steel.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2949822826020836/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2949822826020836/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["groove angle", "quenching media", "shielded metal arc welding", "mild steel", "weld bead geometry", "energy absorption", "multi-criteria decision making", "machine learning"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7219643386", "doi": "10.1016/j.japr.2026.100789", "title": "Comparative Study on Growth Performance, Carcass Yield, and Gut Morphology of Broilers Fed Soy Oil, Poultry Fat, Acidulated Fat, or Palm Oil", "date": "2026-10-01", "year": "2026", "journal": "The Journal of Applied Poultry Research", "issn": "10566171", "publisher": "Elsevier BV", "authors": ["Shijinaraj Manjankattil", "Jinquan Wang", "Sabin Poudel", "Karla Casco Valeria", "Matthew B. Hughes", "Olivia Lockyear", "Ansel Steele", "Muhammad Naeem", "Samuel J. Rochell", "D.V. Bourassa"], "abstract": "This study evaluated four dietary fat sources on growth performance, carcass yield, and intestinal morphometry in broiler chickens. A total of 1,152 male YPM × Ross 708 chicks were randomly assigned to 48 pens and fed diets containing soybean oil (SO), poultry fat (PF), acidulated fat (AF), or palm oil (PO). Body weight and feed intake were recorded weekly to calculate weight gain, feed intake, and feed conversion ratio (FCR). Intestinal development was assessed on day 42 by measuring villus height, crypt depth, and villus-to-crypt ratio. On day 43, nine birds per pen were processed to determine yields of breast fillet, thigh, drumstick, wing, and carcass yield. Data were analyzed using PROC ANOVA in SAS with significance at P ≤ 0.05. No differences were observed among treatments for final body weight or FCR. However, transient effects occurred during production. On day 28, SO had greater body weight gain (736 ± 13.7 g) than PF (675 ± 27 g). On day 35, PO showed higher feed intake (1,394.1 ± 42.3 g) than PF (1,288.7 ± 13.9 g). By day 42, PO had lower feed intake (1,461.1 ± 55.8 g) than SO (1,593.4 ± 31.2 g). No differences were detected in carcass yield, parts yield, or intestinal morphometry (P > 0.05). Breast yield ranged from 28.29–28.71%, wings 9.84–10.07%, thighs 13.29–13.55%, drumsticks 12.25–12.44%, and carcass yield 76.78–77.79%. These findings indicate that these fat sources can be used interchangeably in broiler diets without affecting performance or carcass traits.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S1056617126001261/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S1056617126001261/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["broiler chickens", "dietary fat source", "soybean oil", "poultry fat", "palm oil", "growth performance", "feed conversion ratio", "carcass yield"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7220833526", "doi": "10.1016/j.lwt.2026.120072", "title": "Functional, nutritional, and sensory enhancement of emmer wheat bread using lupine and indigenous plant ingredients", "date": "2026-10-01", "year": "2026", "journal": "LWT", "issn": "00236438", "publisher": "Elsevier BV", "authors": ["Shimelse Abate Emiru", "Biresaw Demelash Abera"], "abstract": "Underutilized plant resources can enhance bread’s nutritional and functional quality while valorizing local crops and agro-industrial by-products. However, combining cereals, legumes, fruit by-products, and indigenous leafy vegetables involves trade-offs among nutritional quality, digestibility, technological properties, and sensory acceptability. Their limited utilization, particularly in low-income countries such as Ethiopia, highlights the need for systematic formulation optimization. This study developed and optimized composite bread from emmer wheat flour, white lupine flour, banana peel powder, Urtica simensis leaf powder, and Amaranthus caudatus leaf powder using a constrained D-optimal mixture design, with clove powder fixed at 1%. Eight composite formulations and a control were evaluated for proximate composition, functional properties, bread quality, in vitro starch digestibility, predicted glycemic index (pGI), and sensory characteristics. Scheffé mixture models and multi-response desirability optimization were applied to identify the optimum formulation. Increasing incorporation of the plant ingredients significantly ( p < 0.05) increased protein, dietary fiber, resistant starch, water absorption capacity, oil absorption capacity, and swelling power, while reducing pGI. The optimum formulation (M5; 50% emmer wheat, 10% white lupine, 15% banana peel, 15% U. simensis , and 10% A. caudatus ) had predicted values of 14.6% protein, 6.8% dietary fiber, 15.0% resistant starch, pGI of 67.1, loaf volume of 388 cm 3 , specific volume of 1.50 cm 3 /g, and sensory score of 7.6. Although ingredient incorporation reduced loaf volume and specific volume, M5 maintained acceptable sensory and technological performance. Overall, the findings demonstrate the potential of combining locally available plant resources and agro-industrial by-products to develop nutritionally improved and sustainable functional bread.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S0023643826010844/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S0023643826010844/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["banana peel powder", "Amaranthus caudatus", "agro-industrial by-products", "in vitro starch digestibility", "predicted glycemic index", "resistant starch", "dietary fiber", "sensory acceptability"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7221105002", "doi": "10.1016/j.indcrop.2026.124484", "title": "Synthesis of slow-release nano-fertilizer from plasma nitrogen and banana peel cellulose", "date": "2026-10-01", "year": "2026", "journal": "Industrial Crops and Products", "issn": "09266690", "publisher": "Elsevier BV", "authors": ["Stewart Kyebogola", "Richard Ndemo Onwonga", "Stella Kabiri", "Onesimus Semalulu", "Swidiq Mugerwa", "Russell Shelley Yost", "Samuel Ikendi", "Godfrey Sseruwu"], "abstract": "The increasing demand for affordable nitrogen fertilizers could promote the use of low-cost non-thermal plasma nitrogen (PN) harvesting from the atmosphere and from water sources. Similar to urea, PN faces challenges in the controlled release of nitrogen. In this study, PN was electrocatalyzed to form an N-rich ammonium chloride salt, which was graft-polymerized with banana peel cellulose nanofibrils (BPCNF) to develop a nano-plasma N (NPN) compound for slow nitrogen release. For comparison, urea was also encapsulated in BPCNF to produce nano-urea (NU). To evaluate agronomic performance, a screenhouse experiment was conducted to assess the fertilizing effect of NPN on maize. Structural and chemical characterizations of NPN and NU provided evidence for semi-interpenetrating polymer networks (semi-IPNs) and component interactions that help control moisture diffusion, thereby improving nutrient retention in the soil. The produced nano-fertilizers demonstrated excellent water absorption, with swelling values of 235% for NPN and 226% for NU. They also enhanced the soil's water retention capacity by extending the time to reach 50% field capacity by two days from nine days. These responses enable efficient water use and reduce irrigation frequency. Moreover, the nano-fertilizers exhibited controlled nitrogen release, with 93% and 76.2% released for NU and NPN, respectively, after 29 days, indicating the need to meet European standards. Similar to NU, NPN application in maize increased growth, biomass, and grain yield by up to 37, 36, and 30%, compared to urea and PN. The Nitrogen Recovery Efficiency increased up to 60% and 83% for NU and NPN, respectively, improving the economic yield per fertilizer nutrient. These benefits combined with an eco-friendly production process that leverages plasma and nanotechnology, strengthen the potential of NPN to address fertilizer challenges in sustainable agriculture.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S092666902601873X/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S092666902601873X/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["slow-release fertilizer", "nanofertilizers", "ammonium chloride", "graft copolymerization", "semi-interpenetrating polymer network", "urea encapsulation", "maize yield", "nitrogen recovery efficiency"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 21}, {"id": "W7221778344", "doi": "10.1016/j.afres.2026.102539", "title": "Encapsulation of a vitamin E- and carotene-rich lipophilic extract by β-cyclodextrin inclusion complexes", "date": "2026-10-01", "year": "2026", "journal": "Applied Food Research", "issn": "27725022", "publisher": "Elsevier BV", "authors": ["Nidia Casas‐Forero", "Leydi Quintero-Torres", "Lina Pulido-Salas", "Natalia Carolina Londoño Univio", "Mary Luz Olivares-Tenorio", "Jesús Alberto García-Núñez"], "abstract": "Lipophilic extracts rich in vitamin E and carotenes contain compounds of nutritional interest for food applications, but their low water solubility and sensitivity to storage conditions can limit their direct incorporation. Therefore, this study evaluated the effect of the β-cyclodextrin (β-CD): extract ratio and stirring time on encapsulating a vitamin E- and carotene-rich high-oleic palm oil extract through inclusion complexes. The complexes were prepared using three β-CD: extract ratios (1:1, 1.3:1, and 1.6:1, w/w) and three stirring times (1, 3, and 5 h). The resulting powders were evaluated for process yield, encapsulation efficiency, moisture content, color, morphology, FT-IR spectra, thermal behavior by DSC and TGA, and refrigerated storage stability. The best balance between powder recovery and bioactive compound retention was obtained with a β-CD: extract ratio of 1.6:1 and 1 h of stirring, yielding 72.61% powder recovery and encapsulation efficiencies of 53.53% for vitamin E and 59.10% for carotenes. The selected powder contained 968.88 mg/kg vitamin E and 125.90 mg/kg carotenes, with reduced moisture content and extract-associated color changes. SEM, FT-IR, DSC, and TGA showed modified particle morphology, spectral changes consistent with β-CD–extract interactions, reduced water-loss events, and a shift of the main degradation event toward higher temperatures. After 60 days at 4 °C, the encapsulated extract retained more vitamin E (91.42%) and carotenes (86.27%) than the free extract (82.74% and 74.00%, respectively). These results show that inclusion complexation with β-CD can effectively protect and stabilize lipophilic extracts rich in vitamin E and carotenes for future food applications.", "oa_url": "https://doi.org/10.1016/j.afres.2026.102539", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": [], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7215105321", "doi": "10.1007/s44217-026-02153-x", "title": "Mapping sustainability research, education and training in agriculture and horticulture", "date": "2026-10-01", "year": "2026", "journal": "Discover Education", "issn": "27315525", "publisher": "Springer Science+Business Media", "authors": ["Mallika Roy", "Bablo Biswas"], "abstract": "Agriculture and horticulture education are increasingly recognised as essential for promoting sustainable farming practices, climate resilience, and environmental stewardship. Despite growing scholarly interest, the literature remains fragmented, limiting a comprehensive understanding of its intellectual development, emerging research priorities, and contributions to sustainable agricultural systems. This study presents a bibliometric analysis of 1476 publications (articles, reviews, book chapters, books, and short surveys) indexed in the Scopus database between 2000 and 2024. Publications were retrieved using a structured search strategy, and bibliometric mapping was conducted using VOSviewer to analyse citation, co-authorship, co-citation, and keyword co-occurrence networks, complemented by thematic synthesis to develop a conceptual framework. The analysis identified van der Hoek [ 76 ] and Jallow [ 27 ] as the most influential authors within the co-citation network, while Sustainability (Switzerland) emerged as the leading publication outlet and Science of the Total Environment demonstrated the highest citation impact. Keyword co-occurrence analysis revealed five dominant thematic clusters: (i) sustainability, (ii) climate change and adaptation, (iii) education and capacity building, (iv) farmers’ behaviour and technology adoption, and (v) pesticides, food safety, and agricultural policy. The findings demonstrate a marked shift towards interdisciplinary, sustainability-oriented research integrating environmental stewardship, climate resilience, technology adoption, and educational innovation. By mapping influential contributors, thematic developments, and emerging research directions, this study advances understanding of the intellectual structure of agriculture and horticulture education and provides a theoretical and evidence-based foundation for future research, educational practice, and policy development.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s44217-026-02153-x.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s44217-026-02153-x.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["sustainability", "sustainable agricultural practices", "climate change adaptation", "climate resilience", "environmental stewardship", "capacity building", "farmer behavior", "technology adoption"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 15}, {"id": "W7215090765", "doi": "10.3390/agronomy16191910", "title": "Compositionally Distinct Fertilization Regimes Produce Divergent Responses Across Soil Properties, Fresh-Shoot Chemistry and the Shoot Metabolome in a Mature Tea Plantation", "date": "2026-10-01", "year": "2026", "journal": "Agronomy", "issn": "20734395", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Yuxiao Yan", "Ga Yan", "Jin Xie", "Yao Liu", "Zhiling Li", "Zhitai Yang", "Yan Ma", "李家华", "李家华", "Yuqing Ma", "Yuqing Ma", "Guangrong Yang"], "abstract": "Fertilization regimes in tea plantations must be evaluated across soil conditions, harvested-shoot chemistry and practical input requirements. We compared an unfertilized control with five compositionally distinct regimes in a randomized complete block field experiment. The field plot was the experimental unit, with three independent plots per treatment, and the first observation occurred after the first fertilizer application. At the autumn-2024 sampling, 12 of 15 soil and conventional fresh-shoot traits showed a treatment effect after Benjamini–Hochberg correction, but the direction and statistical support of pairwise differences varied among endpoints. Of 4609 metabolic features, 4069 passed pooled-QC criteria and 3845 were fully detected across the 18 biological samples. A total of 495 unique quantitative-event features contributed 988 feature–contrast events and were summarized in seven empirical modules. Only M1 alkaloid overrepresentation remained significant after correction within the preselected responsive subset; M1 contained 32 selected features, including seven putatively annotated alkaloids, and its unadjusted plot-level association with conventionally measured caffeine was weak. This is limited exploratory compositional evidence, not a confirmed biological mechanism. A total of 9 of 105 correlations among conventional indicators retained correction, whereas none of 35 candidate-metabolite-to-shoot-trait correlations did. Fertilizer material costs ranged from 187.5 to 7500 CNY mu−1 among the five fertilized regimes under the stated price assumptions. These costs and an owner-reported farm-operation scenario provide practical context but are not treatment-specific profitability estimates. The results support regime-specific evaluation under the tested formulations, rates, site and observation period, without establishing fertilizer-source superiority, an organic–mineral interaction or a causal soil-to-metabolite mechanism.", "oa_url": "https://doi.org/10.3390/agronomy16191910", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["Camellia sinensis", "fertilizer composition", "soil properties", "caffeine", "tea alkaloids", "fertilizer costs", "tea plantation management"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 9}, {"id": "W7221160138", "doi": "10.1016/j.indcrop.2026.124554", "title": "Drought effects across seasonal temperature regimes on root morphology, growth, electrical impedance traits and fungal community of Pinus sylvestris var. mongolica seedlings", "date": "2026-10-01", "year": "2026", "journal": "Industrial Crops and Products", "issn": "09266690", "publisher": "Elsevier BV", "authors": ["Yue Liu", "Fang Zheng", "Xue-Ting Wu", "Yu-Qi Kang", "GE Yu-lan", "Ai-Fang Wang"], "abstract": "Water stress is considered to be the main factor causing the decline of Mongolian Scots pine ( Pinus sylvestris var. mongolica ) seedling plantations. Most previous studies have examined seasonal drought under fluctuating ambient temperatures. However, how drought occurring at successive growth stage temperatures regulates root growth, physiological traits, fungal communities and their internal interactions remain poorly understood. In this experiment, two-year-old seedlings were subjected to drought treatments at different growth stages, which were regulated by exposing them to sequential temperatures of 5/2 ℃, 15/10 ℃, 25/20 ℃, and 35/30 ℃ for 20 days each. Well-watered seedlings served as the control. Multiple root and soil parameters were analyzed after each drought period and at final harvest. Drought at 5/2 ℃ stage induced osmotic adjustment via starch hydrolysis, and root tips recovered at final harvest. At 15/10 ℃ stage, seedlings changed to conservative carbon allocation by enhancing starch accumulation. The most severe and irreversible damage occurred at 25/20 ℃ (optimal growth temperature) stage, causing persistent carbon deficit and impaired recovery. In contrast, seedlings at 35/30 ℃ stage exhibited heat-drought acclimation, maintaining stable non-structural carbohydrate levels, preserving antioxidant activities, and enriching stress-tolerant ectomycorrhizal fungi. Electrical impedance spectroscopy parameters effectively tracked root physiological and morphological changes throughout the experiment. These findings highlight the critical role of growth-stage temperature in seedling drought recovery, providing a scientific basis for forest water management in semi-arid regions.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S0926669026019436/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S0926669026019436/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["drought stress", "Pinus sylvestris var. mongolica", "seedlings", "root morphology", "root growth", "electrical impedance", "fungal communities", "mycorrhizal fungi"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7214891044", "doi": "10.3389/fsufs.2026.1885196", "title": "Community radio as a catalyst for social learning, knowledge co-production, and adaptive capacity: a sequential explanatory mixed-methods study in Northern Ghana", "date": "2026-09-30", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Enoch Kwame Tham-Agyekum", "Gabriel Kanuti Ndimbo", "Winnefred Mensah", "Fred Nimoh", "Olumuyiwa Akin Olaniyi", "Abrokwah Daniel Ofosuhene", "Fred Ankuyi", "Jabulani Nyengere", "RUTH WAMBUI WAINAINA"], "abstract": "Introduction Community radio has increasingly been recognised as an important platform for climate communication in sub-Saharan Africa. However, limited empirical evidence exists on how community radio contributes to social learning, climate knowledge co-production, and the adaptive capacity of smallholder farmers. This study examined the role of community radio in enhancing drought adaptation among smallholder farmers in Northern Ghana. Methods A mixed-methods approach was employed involving 1,200 smallholder farmers. Data were collected through household surveys and key informant interviews. Thematic analysis, descriptive statistics, and an Endogenous Switching Regression (ESR) model were used to analyse the data. Results The findings show that community radio strengthens social learning through information sharing, peer-to-peer learning, group discussions, observational learning, and leader-mediated diffusion. Community leaders, farmer groups, and informal social networks further amplified climate information obtained through radio programmes, extending its reach beyond direct listeners. Community radio also facilitated climate knowledge co-production by creating opportunities for collective interpretation, contextualisation, and validation of climate information through interactive formats such as call-in programmes, farmer testimonies, and community discussions. ESR estimates indicate that listening to community radio increased access to drought adaptation inputs and institutional support by 24.3%, diversification strategies by 21.5%, preparedness and coping practices by 10.7%, and climate knowledge and skills by 18.7% compared with non-participants. Discussion The findings demonstrate that community radio functions not only as a communication channel but also as a catalyst for social learning, climate knowledge co-production, and improved adaptive capacity. Strengthening participatory community radio programming and enhancing its integration with agricultural extension services could substantially improve the resilience of smallholder farmers to drought and other climate-related risks in Ghana and similar contexts.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1885196/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1885196/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["community radio", "social learning", "adaptive capacity", "drought adaptation", "smallholder farmers", "climate change communication", "farmer groups", "agricultural extension"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 48}, {"id": "W7215043157", "doi": "10.9734/jsrr/2026/v32i104559", "title": "Women-Led Farmer Producer Organisations: Economic Empowerment, Collective Agency and Extension Support", "date": "2026-09-30", "year": "2026", "journal": "Journal of Scientific Research and Reports", "issn": "23200227", "publisher": "Sc
