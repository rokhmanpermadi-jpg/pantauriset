0.546). Antecedents of supply chain coordination were tested using hierarchical multiple regression on the farmer subsample with complete data (n = 181), and relative technical efficiency across value chain actors was estimated using input-oriented Data Envelopment Analysis (DEA). Results: The comprehensive regression model explained 63.3% of the variance in supply chain coordination performance. Inclusivity (β = 0.251), commitment (β = 0.259), information quality (β = 0.233), and trust (β = 0.160) were significant positive predictors, and a parsimonious model identified commitment and trust as the strongest. DEA showed low mean technical efficiency among smallholder farmers (0.683) relative to retailers (0.934) and wholesalers (0.954), with only modest variation across the three regions. Conclusions: Relational governance mechanisms primarily drive farmer-level supply chain coordination, whereas structural position within the value chain shapes technical efficiency. These empirically validated determinants and efficiency benchmarks can inform targeted agricultural policy. No artificial intelligence system was developed or tested in this study; the results are offered only as candidate inputs that could support the future design of AI-enabled decision-support tools in food supply chain management.", "oa_url": "https://doi.org/10.3390/su18189481", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["banana value chain", "relational governance", "supply chain coordination", "technical efficiency", "smallholder farmers", "trust", "commitment", "information quality"], "topics": ["Pembangunan pedesaan & kebijakan pertanian", "Komoditas: pisang, nanas, padi rawa"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 63}, {"id": "W7213258013", "doi": "10.1007/s43621-026-04519-5", "title": "Institutional dynamics of collaborative governance for forest fire mitigation in large scale palm oil enclaves in West Kalimantan Indonesia", "date": "2026-09-16", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Rijal Ramdani", "Agam Fatchurrochman", "Eko Priyo Purnomo", "Andi Muhammad Amin", "Hefi Al Hifdhi", "Reza Ariesca", "Obed Asamoah", "Susilo Nur Aji Cokro Darsono", "Dian Indra Praja", "Bagus Ali Imron", "Nasrulhaq Nasrulhaq"], "abstract": "Abstract Forest and land fires remain a persistent sustainability challenge in Indonesia’s palm oil landscapes, particularly within enclave areas, community-managed lands located inside large-scale corporate concessions that are highly fire-prone during the dry season due to slash-and-burn practices. This study examines how collaborative governance among palm oil companies, local communities, village authorities, and government agencies contributes to sustainable fire mitigation in these complex socio-ecological systems. Drawing on qualitative case studies from two villages surrounding a major oil palm concession in Ketapang, West Kalimantan, the research integrates in-depth interviews, focus group discussions, field observations, document analysis, and GIS mapping. The findings show that collaborative arrangements, implemented through fire awareness campaigns, preparedness activities, joint monitoring, and coordinated firefighting, have reduced high-risk burning and limited fire spread across community lands and adjacent plantations. These processes were enabled by structured coordination, knowledge exchange, and resource sharing, while shaped by tensions between customary land-use practices and evolving environmental and regulatory conditions. Collaboration was further driven by interdependence in funding, equipment, legitimacy, and personnel, alongside external pressures such as market-based sustainability certification and state enforcement. The study highlights how collaborative governance can strengthen fire resilience and support more sustainable palm oil governance in the Global South.", "oa_url": "https://doi.org/10.1007/s43621-026-04519-5", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["collaborative governance", "wildfire mitigation", "shifting cultivation", "fire preparedness", "joint monitoring", "fire resilience", "sustainability certification", "West Kalimantan"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 61}, {"id": "W7213434130", "doi": "10.3389/fsufs.2026.1924874", "title": "Food-supply resilience under policy, market, and biosecurity shocks: a diagnostic of import vulnerability, supplier substitution, and short-run callable capacity in RCEP agri-food networks", "date": "2026-09-16", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Guo Ru", "Bolu Wei", "Mingrong Zeng", "Pan Liu", "Bixiang Shi"], "abstract": "Introduction Policy, market, and biosecurity shocks test whether regional trade networks can maintain physical food availability when established sourcing channels are disrupted. This narrower dimension of food security is termed food-supply resilience. This study treats the Regional Comprehensive Economic Partnership (RCEP) as a policy-relevant regional supply space and examines whether its agri-food networks contain short-run callable capacity for import-vulnerable economies. The analysis advances the claim that connectivity is not capacity: trade links support resilience only when they connect vulnerable importers to suppliers with callable surplus, stable ties, and usable access. Methods This study constructs 126 commodity-year networks for six agri-food categories over 2001–2021 using CEPII-BACI trade data, with FAOSTAT quantities used as an independent cross-source check. Import vulnerability is measured through supplier dependence, concentration, and tie stability. Supplier substitution is assessed through regional supplier persistence, lower-bound callable surplus, gross-export upper-bound coverage, and shock-specific access conditions. Post-2021 observations are used as descriptive monitoring checks rather than as agreement-effect estimates. Results Regional Comprehensive Economic Partnership agri-food networks became more connected, but resilience profiles diverged by commodity. Rice was the only distributed-supplier profile. Milk-powder dairy and palm oil combined large regional surplus with exporter cores concentrated around New Zealand and Australia, and Indonesia and Malaysia, respectively. Soybean and pork remained weak regional-substitution cases, while selected tropical and subtropical fruit was retained only as a compositional regional-trade profile. China showed a centrality paradox: it became more central where regional alternatives already existed but remained peripheral in soybean and pork, where extra-regional dependence mattered most. Lower-bound and gross-export upper-bound checks confirmed pervasive regional substitution gaps in soybean and pork across eligible importer profiles, not only for China. The Philippines-rice case showed the contrasting profile of an import-vulnerable economy backed by substantial regional surplus. Discussion The shock episodes support the diagnostic. Rice export restrictions, Indonesia’s palm-oil export ban, and the African swine fever pork shock show that regional networks support food-supply resilience only when vulnerable importers are connected to suppliers with callable surplus, stable ties, and usable access. Regional agreements can reduce frictions and improve coordination, but they do not automatically create deployable supply. Food-security governance should therefore monitor commodity-importer vulnerability, callable surplus, gross-export upper bounds, tie persistence, and access readiness rather than treating network connectivity as resilience.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1924874/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1924874/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["food supply resilience", "Regional Comprehensive Economic Partnership", "supplier substitution", "trade shocks", "supplier dependence", "trade concentration", "rice trade", "African swine fever"], "topics": ["Kelapa sawit"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 58}, {"id": "W7213340392", "doi": "10.3389/fsufs.2026.1871964", "title": "Climate-resilient agriculture in Bihar, India: impacts, challenges, and pathways for sustainable food systems", "date": "2026-09-16", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Abdus Sattar", "Ratnesh Kumar Jha", "Shreya Anand"], "abstract": "Climate change poses a significant threat to agricultural sustainability through rising temperatures, erratic rainfall patterns, and the increasing frequency of extreme weather events. Bihar, one of India's most climate-vulnerable agricultural states, faces considerable challenges in sustaining agricultural productivity, food security, and rural livelihoods under changing climatic conditions. This review synthesizes evidence from peer-reviewed research articles, government reports, institutional publications, and program documents to evaluate the scope, performance, and implications of Climate Resilient Agriculture (CRA) interventions implemented in Bihar. The review examines major climate-resilient technologies and management practices, including Zero Tillage (ZT), Laser Land Leveling (LLL), Direct Seeded Rice (DSR), Crop Diversification (CD), Site-Specific Nutrient Management (SSNM), climate-resilient crop varieties, and water-saving irrigation approaches. The reviewed literature indicates that these interventions generally enhance crop productivity, resource-use efficiency, soil health, and resilience to climatic stresses when compared with conventional farming practices. The evidence further highlights the potential of CRA to contribute to sustainable food production, climate adaptation, and the achievement of multiple Sustainable Development Goals (SDGs). However, the large-scale adoption and sustained effectiveness of CRA interventions remain constrained by several challenges, including limited access to machinery and credit, inadequate extension and advisory services, institutional and infrastructural limitations, fragmented landholdings, and concerns regarding the affordability and scalability of certain technologies for smallholder farmers. Furthermore, available evidence on the long-term environmental, economic, and social impacts of several CRA practices remains limited. Future research should focus on adoption dynamics, cost-effectiveness, long-term sustainability assessment, gender and equity dimensions, institutional innovations, and strategies for scaling climate-resilient technologies across diverse agroecological contexts. The review identifies key research and policy priorities for strengthening agricultural resilience and promoting sustainable food production in Bihar and other climate-vulnerable regions.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1871964/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1871964/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["climate-resilient agriculture", "Bihar", "sustainable food systems", "no-tillage", "laser leveling", "DSR", "crop diversification", "site-specific nutrient management"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 52}, {"id": "W7213221852", "doi": "10.3389/fsufs.2026.1944104", "title": "What drives household income among smallholder livestock farming households? Evidence from communal farming systems in South Africa", "date": "2026-09-16", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Tshifhiwa Noluthando Labase", "Lwandiso Mdiya", "Mashford Zenda", "Siphe Zantsi", "Mhlangabezi Slayi"], "abstract": "Introduction Household income is a key indicator of rural welfare and livelihood sustainability among smallholder livestock farming households. Methods This study examined the determinants of household income using survey data collected from communal livestock farmers in South Africa. A multiple linear regression model was employed to assess the influence of demographic, socio-economic, and livestock-related factors on household income. Results Age, household size, and employment status significantly and positively influenced household income, whereas gender, education, farming experience, and livestock holdings were not statistically significant. Employment status emerged as the strongest determinant, highlighting the importance of diversified livelihood strategies that combine livestock production with wage employment and self-employment. Discussion The findings support the Sustainable Livelihoods Framework by demonstrating that household welfare is influenced more by the interaction of human and financial capital than by livestock assets alone. Although livestock remains an important livelihood resource, its economic contribution depends on broader livelihood opportunities and market participation. The study concludes that policies aimed at improving rural household welfare should move beyond increasing livestock ownership to promote livestock commercialisation, rural employment, youth participation, and livelihood diversification. These findings contribute to the growing literature on rural livelihoods and provide evidence to inform integrated rural development policies that seek to enhance household income, resilience, and sustainable agricultural development among South Africa’s smallholder livestock farming households.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1944104/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1944104/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["household income", "smallholder livestock production", "rural livelihoods", "Sustainable Livelihoods Framework", "employment status", "household size", "rural employment", "rural development policy"], "topics": ["Akses & informasi pasar petani", "Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 50}, {"id": "W7213415541", "doi": "10.1371/journal.pone.0350969", "title": "Grow against the flow: The impact of off-season vegetable production in Cambodia", "date": "2026-09-16", "year": "2026", "journal": "PLoS ONE", "issn": "19326203", "publisher": "Public Library of Science", "authors": ["Liz Ignowski", "Pepijn Schreinemachers", "Mercy Maiwa Mwambi", "Uon Bonnarith", "Srinivasan Ramasamy"], "abstract": "Vegetable production is strongly seasonal, creating income volatility for smallholder farmers and occasionally high prices for consumers. The ability to produce vegetables outside their regular growing season can enhance farmers' incomes and income stability, yet empirical evidence remains limited. This study evaluates the impact of training farmers in Cambodia on off-season production technologies for yardlong beans, tomatoes, and brassicas during the hot-dry and wet seasons. Using survey data collected from 172 intervention and 179 control farmers two and three years after the training began, average treatment effects were estimated by using propensity score matching and inverse probability weighting. Trained farmers adopted an average of 3  "abstract": "The millet supply chain is riddled with extreme issues in maintaining transparency, traceability, and efficiency at various stages of its functionality, right from farm production to consumer distribution. To address these issues, this paper proposes an integrated Blockchain–Cloud–Edge–IoT system for a Millet Supply Chain Management System (MSCMS). The given architecture is devised to offer secure data handling, real-time analysis, and precise traceability at the supply chain network. The system architecture consists of four layers. The Sensor and IoT Devices Layer observes real-time information from the stakeholders, including customers, retailers, distributors, processors, and farmers. The Edge Computing Layer enables local data preprocessing and predictive analytics, minimizing latency and enabling faster response times. The Cloud Layer facilitates central data sharing and storage to allow scalability and access by all network nodes. The Blockchain Layer leverages the use of smart contracts and QR-code-verified information to ensure data immutability, integrity, and open sharing of information between the stakeholders. The framework is developed based on permissioned Ethereum platform through Proof-of-Authority Clique consensus approach, AES-256 encryption of payload, ECDSA secp256k1 digital signatures, and Keccak-256 hash function for data protection. Results of experimental evaluation conducted on hybrid physical-emulated testbed indicate that the proposed framework provides 29.5% lower end-to-end execution latency from 880 ms to 620 ms at 500 IoT devices by increasing the number of edge nodes from one to four, allows achieving a peak throughput of 165 TPS, decreases on-chain storage from 175 MB to 55 MB out of total 1,000 transactions generated, provides 39.1% faster QR-code traceability response time in comparison with blockchain-only solution 560 ms vs 920 ms at 1,000 requests, and preserves 75% of system availability in case of ten concurrent node failures, while blockchain-only system ensures only 30% of system availability and 5% of central cloud-based system. The multi-layer integration ensures secure and verifiable data exchange, which allows stakeholders to track product quality, logistics, and conformity effectively. The framework proposed not only instills trust among supply chain stakeholders but also promotes sustainability by allowing decision-making processes based on data and minimizing operational inefficiencies. The MSCMS illustrates how new digital technologies can reconfigure agri-food systems for a transparent, resilient, and intelligent millet value chain.", "oa_url": "https://www.nature.com/articles/s41598-026-68259-2_reference.pdf", "pdf_url": "https://www.nature.com/articles/s41598-026-68259-2_reference.pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["blockchain", "edge computing", "Internet of Things", "supply chain traceability", "smart contracts", "proof-of-authority consensus", "agricultural supply chain management", "data integrity"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7213265524", "doi": "10.1007/s43621-026-04525-7", "title": "Enabling environment for agroforestry scaling in smallholder farming systems of southwestern Ethiopia", "date": "2026-09-16", "year": "2026", "journal": "Discover Sustainability", "issn": "26629984", "publisher": "Springer Nature", "authors": ["Feyisa Ararsa", "Adanech Asfaw", "Samuel Taye", "Sangi Olani", "Niguse Hagazi", "Endalkachew Wolde‐meskel", "Gebrehiwot Hailemariam", "Mulugeta Mokria"], "abstract": "Agroforestry is widely recognized for its contributions to sustainable livelihoods, biodiversity conservation, climate change adaptation, and ecosystem resilience. However, despite supportive national policies, scaling up agroforestry remains constrained by weaknesses in the enabling environment. This study assessed the governance, market, and policy dimensions influencing agroforestry scaling in four districts of southwestern Ethiopia. A mixed-methods approach combined a household survey of 373 randomly selected households with key informant interviews, focus group discussions, stakeholder analysis, and document review. Descriptive statistics, stakeholder power–interest analysis, and binary logistic regression were used to examine institutional interactions and identify the determinants of agroforestry scaling. The regression model was statistically significant (Omnibus χ 2 = 29.94, p < 0.001) and explained 7.7–19.9% of the variation in agroforestry scaling. Distance to the nearest market (OR = 0.64, p = 0.006) and affordability of seedlings (OR = 7.05, p = 0.001) were the only significant determinants. Households located farther from markets were less likely to scale up agroforestry, whereas affordable seedlings increased the likelihood of scaling by more than sevenfold. Stakeholder analysis revealed fragmented institutional coordination, limited engagement of influential market actors, and weak integration among governance, market, and policy systems. Qualitative findings identified inadequate extension services, weak input and market linkages, and implementation gaps as major barriers. Overall, governance, markets, and policy function as interconnected components of the enabling environment, with market accessibility and affordable planting materials emerging as the strongest drivers of agroforestry scaling. Strengthening institutional coordination, improving market access, and enhancing policy implementation are therefore essential for promoting sustainable agroforestry scaling in Ethiopia and other smallholder farming systems across Sub-Saharan Africa.", "oa_url": "https://doi.org/10.1007/s43621-026-04525-7", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["enabling environment", "smallholder farming systems", "governance", "market access", "agricultural policy", "institutional coordination", "market linkages", "extension services"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 37}, {"id": "W7213262377", "doi": "10.3389/fbioe.2026.1933402", "title": "Leveraging agricultural waste manipulation using a novel resveratrol-producing endophytic fungus, Cladosporium sphaerospermum AH26: optimization and enzymatic investigation", "date": "2026-09-16", "year": "2026", "journal": "Frontiers in Bioengineering and Biotechnology", "issn": "22964185", "publisher": "Frontiers Media", "authors": ["Amal A. Al Mousa", "Adel Eltoukhy", "M. A. Abo-Kadoum", "Omar Mohammad Atta", "Khalifa S.H. Eldiehy", "Hassan Mohamed", "Ahmed Abdel-Hadi", "Nageh F. Abo-Dahab", "Abdel-Rehim A. El-Shanawany", "Abdallah M. A. Hassane"], "abstract": "Resveratrol (RES) is utilized in multiple pharmaceutical and industrial applications. Rising global demand has required immediate novel production solutions for sustainable RES supply. Endophytic fungi are a promising source for RES production; however, their conventional culture impedes economic viability. This study aimed to leverage agricultural wastes as a low-cost carbon source for improving RES productivity alongside the associated hydrolytic enzymatic activities using grapevine-derived endophytic fungus Cladosporium sphaerospermum AH26. C. sphaerospermum was isolated from the stem tissues of grapevine ( Vitis vinifera L. Starlight cultivar) and identified by internal transcribed spacer sequencing. The RES-producing capability of AH26 was assessed on potato dextrose broth medium (PDB) and on different agricultural wastes, such as banana peel, wheat straw, and sugarcane bagasse. Thin-layer chromatography (TLC) and high-performance liquid chromatography (HPLC) were employed for the qualitative and quantitative analysis of RES production, respectively. Hydrolytic enzyme activities were initially screened on agar plates and subsequently quantified using a dinitrosalicylic acid-based assay. Optimization of cultivation conditions for maximizing RES productivity on agricultural wastes was achieved through response surface methodology (RSM) using Box–Behnken design. C. sphaerospermum showed significant efficacy for RES production when cultivated on PDB, banana peel, wheat straw, and sugarcane bagasse, yielding total concentrations of 42.30 µg/mL, 41.78 µg/mL, 39.59 µg/mL, and 40.33 μg/mL, respectively. RSM optimization of agricultural waste cultivation conditions resulted in 2.7-, 3.4-, and 4.7-fold increases in RES concentration on banana peel, wheat straw, and sugarcane bagasse, respectively. Analysis of variance revealed that the interaction between temperature and other cultivation parameters, including incubation period, pH, and substrate concentration, significantly affected RES production. The analysis of hydrolytic enzymes demonstrated a positive correlation between enzymatic activity and RES productivity by C. sphaerospermum . Our findings identified C. sphaerospermum AH26 strain as a promising novel and efficient strain for RES production and demonstrated the potential of agricultural waste-based cultivation as a viable economic and sustainable strategy for the cost-effective production of RES by mycoendophytes.", "oa_url": "https://doi.org/10.3389/fbioe.2026.1933402", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["resveratrol production", "Cladosporium sphaerospermum", "endophytic fungi", "agricultural waste", "banana peel", "wheat straw", "sugarcane bagasse", "hydrolytic enzymes"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7213403576", "doi": "10.3390/insects17090962", "title": "Matched Fruit–Larva Metabolomics Identifies Host-Associated Metabolic Signatures After Multi-Generational Laboratory Acclimation in Zeugodacus tau (Tephritidae: Diptera)", "date": "2026-09-16", "year": "2026", "journal": "Insects", "issn": "20754450", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Wei Shi", "Ruixiang Li", "Rui Sun", "Jun Cao"], "abstract": "Zeugodacus tau (Walker) is a polyphagous invasive tephritid capable of cross-family host shifts from ancestral Cucurbitaceae crops to phylogenetically divergent commercial fruits, causing severe horticultural economic losses. As an obligate fruit-boring pest, Z. tau largely relies on larval metabolic plasticity to achieve successful colonization of novel hosts during host shifts. However, few matched fruit–larva metabolomic studies integrate host chemistry to larval physiology, hindering sustainable pest control development. We performed untargeted LC–MS metabolomics on matched fruit and third-instar larval samples from eight hosts after multi-generational acclimation. Principal component analysis (PCA) split fruit and larval metabolomes into cucurbit and non-cucurbit clusters, indicating that larval metabolic profiles align with host fruit chemistry during host shifts. Cucurbit fruits contained uniformly high γ-aminobutyric acid (GABA), and their larvae exhibited enriched glutamate (Glu)-centred amino acid pathways. Non-cucurbit fruits showed heterogeneous chemical composition: larvae-fed banana, mango and pitaya all possessed high UDP-glucose (UDPG), whose levels correlated with fruit glucose-6-phosphate (G6P) enriched in banana and mango. Overall, larvae colonizing distinct non-cucurbit hosts deployed a suite of divergent carbohydrate metabolic modules to respond to variable fruit chemical microenvironments. Banana and pitaya larvae showed enhanced starch–sucrose turnover, whereas mango larvae featured prominent ascorbate and aldarate metabolism; both pathways are closely connected to carbohydrate homeostasis. Orange and guava larvae activated distinct gluconeogenic branches. Gluconeogenesis itself constitutes an important component of carbohydrate metabolism. This dual-metabolome profiling uncovered host-specific biomarkers and two divergent metabolic strategies underlying the host shift in Z. tau, characterizing host-linked metabolic variation after long-term laboratory acclimation, which delivers correlative biochemical clues for subsequent pest management research.", "oa_url": "https://doi.org/10.3390/insects17090962", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["Zeugodacus tau", "host switching", "Cucurbitaceae", "GABA", "glutamate metabolism", "UDP-glucose", "carbohydrate metabolism", "ascorbate and aldarate metabolism"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7213231739", "doi": "10.3390/f17091105", "title": "LiDAR-Based Thinning Simulation for Changes in Competition Index and Predicted Growth in a Pinus koraiensis Plantation", "date": "2026-09-16", "year": "2026", "journal": "Forests", "issn": "19994907", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Byung-Jun Ko", "Jihwi Jang", "Yongkyu Lee", "Sang-Tae Lee"], "abstract": "Thinning effects vary depending on thinning type, intensity, and timing, making it important to compare alternative scenarios before field implementation. We aimed to provide a fundamental basis for selecting appropriate thinning operations by analyzing changes in stand structure and competition release effects under different thinning regimes using LiDAR-based thinning simulations. Specifically, we quantitatively evaluated how the competition releases effect of row thinning varied with the spatial position of residual trees. Among the stand structural variables, significant differences among thinning types were observed only for tree height. Quantitative thinning resulted in a relatively uniform structure dominated by upperstory trees, whereas row thinning retained trees <script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent) || {articles:[],topics:[]};
  const A = DATA.articles || [];
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // --- penyimpanan status per peramban (dibaca/disimpan) -----------------
  const KEY = 'pantauriset-state-v1';
  let state = {read:{}, saved:{}, seen:{}, theme:''};
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
  if (state.theme) document.documentElement.dataset.theme = state.theme;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : (cur === 'light' ? '' : 'dark');
    if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
    state.theme = next; persist();
  };

  // "baru" = ditemukan sejak kunjungan terakhir
  const lastVisit = state.lastVisit || '';
  state.lastVisit = new Date().toISOString().slice(0,10); persist();

  $('#gen').textContent = `Diperbarui ${DATA.generated || '-'} · sumber OpenAlex (OA, jurnal core)`;

  // --- isi dropdown ------------------------------------------------------
  const topics = DATA.topics.length ? DATA.topics : [...new Set(A.flatMap(a=>a.topics||[]))];
  topics.forEach(t => $('#topic').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
  const jc = {}; A.forEach(a => { if(a.journal) jc[a.journal]=(jc[a.journal]||0)+1; });
  Object.entries(jc).sort((x,y)=>y[1]-x[1]).forEach(([j,n]) =>
    $('#journal').insertAdjacentHTML('beforeend', `<option value="${esc(j)}">${esc(j)} (${n})</option>`));

  let filter = 'all', shown = 40;
  $('#tabs').onclick = e => {
    const b = e.target.closest('.tab'); if(!b) return;
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); filter = b.dataset.f; shown = 40; render();
  };
  ['#q','#topic','#journal','#range','#sort'].forEach(s => $(s).addEventListener('input', ()=>{shown=40; render();}));

  function apa(a){
    const au = (a.authors||[]);
    let names = au.length ? (au.length>2 ? `${au[0]} et al.` : au.join(' & ')) : 'Anon.';
    return `${names} (${a.year||'n.d.'}). ${a.title}. ${a.journal||''}. ${a.doi?('https://doi.org/'+a.doi):(a.oa_url||'')}`;
  }
  function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

  function visible(){
    const q = $('#q').value.trim().toLowerCase();
    const tp = $('#topic').value, jn = $('#journal').value, rg = +$('#range').value;
    const cutoff = rg ? new Date(Date.now()-rg*864e5).toISOString().slice(0,10) : '';
    let out = A.filter(a => {
      if (cutoff && (a.date||'') < cutoff) return false;
      if (tp && !(a.topics||[]).includes(tp)) return false;
      if (jn && a.journal !== jn) return false;
      if (filter==='unread' && state.read[a.id]) return false;
      if (filter==='saved' && !state.saved[a.id]) return false;
      if (filter==='prio' && !a.priority_journal) return false;
      if (filter==='pdf' && !a.pdf_url) return false;
      if (filter==='summ' && !a.summary_id) return false;
      if (q){
        const hay = `${a.title} ${a.abstract} ${(a.authors||[]).join(' ')} ${a.journal} ${(a.keywords||[]).join(' ')} ${a.summary_id?Object.values(a.summary_id).join(' '):''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const s = $('#sort').value;
    if (s==='date') out.sort((x,y)=>(y.date||'').localeCompare(x.date||''));
    else if (s==='cites') out.sort((x,y)=>(y.cited_by||0)-(x.cited_by||0));
    else out.sort((x,y)=>((y.relevance||0)-(x.relevance||0)) || (y.date||'').localeCompare(x.date||''));
    return out;
  }

  function card(a){
    const isNew = lastVisit && a.found_at && a.found_at > lastVisit;
    const s = a.summary_id;
    const summ = s ? `<div class="summary">
        ${s.tujuan?`<div><b>Tujuan</b>${esc(s.tujuan)}</div>`:''}
        ${s.metode?`<div><b>Metode</b>${esc(s.metode)}</div>`:''}
        ${s.temuan?`<div><b>Temuan</b>${esc(s.temuan)}</div>`:''}
        ${s.relevansi?`<div><b>Relevansi</b>${esc(s.relevansi)}</div>`:''}
      </div>` : (a.abstract ? `<div class="summary"><div><b>Abstrak</b>${esc(a.abstract.slice(0,420))}${a.abstract.length>420?'…':''}</div></div>` : '');
    const au = (a.authors||[]); const authors = au.length>4 ? au.slice(0,4).join(', ')+` dkk. (${au.length} penulis)` : au.join(', ');
    return `<article data-id="${esc(a.id)}" class="${state.read[a.id]?'read':''}">
      <div class="meta">
        ${isNew?'<span class="badge new">Baru</span>':''}
        ${a.priority_journal?'<span class="badge prio">Jurnal prioritas</span>':''}
        <span class="badge rel" title="Skor relevansi 0-100">Relevansi ${a.relevance||0}${s&&s.skor?` · AI ${s.skor}/5`:''}</span>
        <span>${esc(a.date)}</span><span>·</span><span><i>${esc(a.journal)}</i></span>
        ${a.cited_by?`<span>· ${a.cited_by} sitasi</span>`:''}
        ${(a.topics||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}
      </div>
      <h2><a href="${esc(a.doi?('https://doi.org/'+a.doi):(a.oa_url||'#'))}" target="_blank" rel="noopener">${esc(a.title)}</a></h2>
      <div class="authors">${esc(authors)}</div>
      ${summ}
      ${a.abstract && s ? `<div class="abstract"><b>Abstrak asli.</b> ${esc(a.abstract)}</div>` : (a.abstract && a.abstract.length>420 ? `<div class="abstract"><b>Abstrak lengkap.</b> ${esc(a.abstract)}</div>`:'')}
      ${(a.keywords||[]).length?`<div class="kw">${a.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
      <div class="actions">
        ${a.pdf_url?`<a class="btn primary" href="${esc(a.pdf_url)}" target="_blank" rel="noopener">PDF</a>`:''}
        ${a.oa_url?`<a class="btn" href="${esc(a.oa_url)}" target="_blank" rel="noopener">Baca (OA)</a>`:''}
        ${a.doi?`<a class="btn" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">DOI</a>`:''}
        ${(a.abstract && (s || a.abstract.length>420))?`<button class="btn" data-act="toggle">Abstrak</button>`:''}
        <button class="btn" data-act="read" aria-pressed="${!!state.read[a.id]}">${state.read[a.id]?'Sudah dibaca':'Tandai dibaca'}</button>
        <button class="btn" data-act="save" aria-pressed="${!!state.saved[a.id]}">${state.saved[a.id]?'Tersimpan':'Simpan'}</button>
        <button class="btn" data-act="cite">Salin sitasi</button>
      </div>
    </article>`;
  }

  function render(){
    const v = visible();
    $('#list').innerHTML = v.length ? v.slice(0,shown).map(card).join('') : '<div class="empty">Tidak ada artikel yang cocok dengan filter ini.</div>';
    $('#more').innerHTML = v.length>shown ? `<button class="btn" id="morebtn">Tampilkan ${Math.min(40, v.length-shown)} lagi (${v.length-shown} tersisa)</button>` : '';
    const mb = $('#morebtn'); if (mb) mb.onclick = ()=>{shown+=40; render();};
    const unread = A.filter(a=>!state.read[a.id]).length;
    const newC = A.filter(a=>lastVisit && a.found_at>lastVisit).length;
    const week = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
    $('#stats').innerHTML = `<span><b>${A.length}</b> artikel</span><span><b>${A.filter(a=>a.date>=week).length}</b> minggu ini</span><span><b>${unread}</b> belum dibaca</span>${newC?`<span><b>${newC}</b> baru sejak kunjungan terakhir</span>`:''}`;
  }

  $('#list').onclick = e => {
    const b = e.target.closest('button[data-act]'); if(!b) return;
    const art = b.closest('article'); const id = art.dataset.id; const a = A.find(x=>x.id===id);
    if (b.dataset.act==='toggle'){ art.classList.toggle('open'); return; }
    if (b.dataset.act==='read'){ if(state.read[id]) delete state.read[id]; else state.read[id]=1; persist(); render(); return; }
    if (b.dataset.act==='save'){ if(state.saved[id]) delete state.saved[id]; else state.saved[id]=1; persist(); render(); return; }
    if (b.dataset.act==='cite'){
      const txt = apa(a);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Sitasi disalin'), ()=>{ prompt('Salin sitasi:', txt); });
    }
  };

  render();
})();
</script>
</body>
</html>
