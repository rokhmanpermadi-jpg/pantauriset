ative study of 16 operations in the US West Coast Tree Fruit Industry (California and Washington), this article examines the ‘last mile’ of agricultural automation. The study reveals that integrating AI and robotics is a contested negotiation shaped by epistemological friction—the tension between the algorithmic logic of developers and the embodied, site‐specific expertise of farmers and farm workers. Rather than resulting in seamless labour replacement, we find that agricultural automation reconfigures work, creating an invisible reliance on ‘human middleware’ to navigate the biological recalcitrance of the orchard. Demonstrating how regional contexts and participatory implementation shape technological trajectories, this study extends Labour Process Theory. We argue for the need for a relational approach recognising the essential cognitive labour of farmers and farm workers that is demanded by digital agriculture. Ultimately, this study shows the ‘farm of the future’ depends on reconciling rigid systems with the situated expertise of the farm workforce.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/ntwe.70047", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/ntwe.70047", "oa_status": "hybrid", "cited_by": 0, "keywords": ["agricultural automation", "embodied expertise", "farm workers", "cognitive work", "labour process theory", "agricultural robotics", "artificial intelligence in agriculture", "orchard management"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 15}, {"id": "W7214437063", "doi": "10.1016/j.heliyon.2026.e45504", "title": "Effect of the formal milk market participation on the gross margin of dairy producers in Nyandarua County", "date": "2026-09-26", "year": "2026", "journal": "Heliyon", "issn": "24058440", "publisher": "Elsevier BV", "authors": ["Naomi Chebiwot Chelang’a", "Naftali Kiprono", "Mary W. K. Mathenge", "Dickson Okello"], "abstract": "Dairy production is a critical value chain for Kenya's rural employment and household income. However, the sector experiences low production and informal marketing. As a result, the government has established several interventions to support farmers in rural areas, including encouraging the formation of formal markets. However, it is not clear whether farmers have utilised and benefited from joining the formal markets (dairy cooperative and processors). This study, therefore, estimates the effect of the formal milk market on the gross margin of dairy producers using an endogenous switching regression model. The data was collected using a semi-structured questionnaire from 384 households drawn from Nyandarua County. The finding indicates that formal milk market participation increased the gross margin by about 38%. Moreover, the results revealed that risk-taking, proactiveness, autonomy, education, experience, land size, herd size, and milk yield significantly influence the choice of the formal milk market. This study recommends initiatives that increase formal market participation for enhanced welfare among dairy farmers.", "oa_url": "https://doi.org/10.1016/j.heliyon.2026.e45504", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["dairy farmers", "gross margin", "dairy value chain", "dairy cooperatives", "milk marketing", "farmer welfare", "risk-taking", "herd size"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 41}, {"id": "W7214477378", "doi": "10.1016/j.foohum.2026.101527", "title": "Transforming food chains for a sustainable future in Sub-saharan Africa: Roles of consumers, industry, and government", "date": "2026-09-26", "year": "2026", "journal": "Food and Humanity", "issn": "29498244", "publisher": "Elsevier BV", "authors": ["Isiguzoro O. Onyeoziri", "Oluwafemi Ayodeji Adebo", "Helen N. Onyeaka", "Adedola Sulaiman Adeboye", "Maria Modupe Adeyemi", "Oluwaseun Peter Bamidele", "Susan N. Sekgweng"], "abstract": "ABSTRACT Food chain sustainability is a pressing global concern, especially in sub-Saharan Africa (SSA), where weak infrastructure, limited public awareness, and fragmented policies obstruct environmentally sound practices. The region experiences up to 30–50% post-harvest losses for perishable commodities, while food waste contributes to an estimated 1.3 billion tonnes of global carbon dioxide equivalent emissions annually. This highlights the urgency for systemic change. Agriculture in SSA is dominated by smallholder systems, yet livestock and other animal-based food production account for approximately 57% of global food-related greenhouse gas emissions, which also emphasizes the importance of sustainable production and dietary shifts. This paper, therefore, analyses how consumers, the food industry, and government bodies can each contribute to more sustainable systems in the region through targeted interventions in policy, sustainable behaviour, technology adoption, and production practices. Major identified obstacles include consumer distrust, limited awareness of sustainability standards, weak policies, and inadequate institutional support. The integration of digital technologies like artificial intelligence, blockchain, and ICT can further transparency, efficiency, and coordination across the food chain. Governments, food producers, and consumers can jointly build more sustainable and resilient food systems by taking a coordinated, holistic approach, one that addresses specific barriers such as inadequate infrastructure, poor policy enforcement, and unsustainable consumer behaviour while aligning efforts across economic, environmental, and social domains.", "oa_url": "https://doi.org/10.1016/j.foohum.2026.101527", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["food chain sustainability", "sub-Saharan Africa", "post-harvest losses", "food waste", "greenhouse gas emissions", "smallholder farming", "animal husbandry", "dietary change"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7216052335", "doi": "10.52214/ptweeg39", "title": "Racial Bifurcation of Benefit and Burden: A Bioethical Analysis of Petrochemical Development in Louisiana's Cancer Alley", "date": "2026-09-26", "year": "2026", "journal": "Voices in Bioethics", "issn": "26914875", "publisher": "Columbia University Libraries", "authors": ["Siyeon Joo"], "abstract": "Photo ID 57449093 © Tomas1111 | Dreamstime.com Introduction In Louisiana's Cancer Alley, an eighty-five-mile stretch of industry along the Mississippi River between Baton Rouge and New Orleans, the petrochemical sector has long defended its development on economic grounds.[1] Industry representatives and state officials frequently credit petrochemical plants with creating jobs, generating tax revenue, and contributing to the economic viability of the regions where they operate. Yet conversations and research conducted with residents reveal a more complicated story: the wages, security, and mobility that people expect from such employment rarely materialize as promised.[2] This narrative is not unique. It reflects a broader idealism that circulates in community gatherings and local government meetings, where proponents widely credit the petrochemical industry with sustaining the region's economic viability. Notably, white residents are the main proponents of this narrative, while being a demographic that is largely absent from the frontline communities most affected by risk factors caused by petrochemical pollution.[3] One explanation lies at the intersection of racial discrimination and a broader ideological commitment to industrialization as an economic necessity, a commitment so entrenched that it precludes scrutiny.[4] In this framework, industrialization is self-evidently beneficial, while the testimony of residents living in its shadow is merely anecdotal.[5] The “Jobs Equal Wealth” Narrative and Its Limits The assertion that petrochemical investment constitutes an economic boon for Cancer Alley communities relies heavily on Louisiana's Industrial Tax Exemption Program (ITEP), established in 1936. Under the ITEP, manufacturers are eligible for property tax exemptions of up to eighty percent for up to ten years, without requiring approval from the local government.[6] Since 1998, the ITEP has granted more than twenty billion dollars in business tax incentives.[7] Recently, in a single fiscal year alone, the program cost state and local governments an estimated 1.5 billion dollars in forgone property tax revenue, much of it drawn from public school funding.[8] A twenty-year examination of the program found that it had funneled twenty-three billion dollars in public funds to industry while, over that same period, net employment among companies receiving these credits declined by twenty-six thousand jobs.[9] The claim that ITEP-subsidized industries deliver economic benefits to local populations is empirically unsupported. One study, in line with local residents’ complaints, found no statistically significant relationship between the scale of a parish's ITEP exemptions and its growth in household income.[10] This situation reflects a failure of distribution, not merely one of inefficiency. The GDP contributed by petrochemical industries does not translate into a definite value for local employees, since a substantial share of that generated wealth is transferred out of state, while much of the employment generated during a facility's construction phase goes to temporary workers brought in from elsewhere.[11] Nor are these arrangements' costs shared equally among Cancer Alley's residents. The parishes where petrochemical facilities are concentrated are disproportionately Black and Brown, even as the ITEP diverts tax revenue that would otherwise have funded the schools and municipal services on which these same residents depend.[12] Ironically, industry defenders cite these services as justification for offering tax exemptions in the first place, since supporters credit the ITEP with sustaining the very jobs residents rely on. The literature does not suggest that the petrochemical industry has created no jobs, or that no resident of the affected areas has benefited. It suggests, rather, that the industry's broader economic argument does not hold up to scrutiny and disproportionately impacts communities. Historical and Structural Roots The current geography of Cancer Alley is not accidental. Before acquiring its moniker, the eighty-five-mile stretch between Baton Rouge and New Orleans was referred to as Plantation Country.[13] Many of the petrochemical plants built along this corridor since the 1960s occupy land that was once sugar plantations toiled by enslaved laborers, a legacy so entrenched that a number of these facilities still bear the names of the plantations on which they stand.[14] After emancipation, newly freed Black residents established Free Towns on land they purchased or were granted, communities that also included Union soldiers and formerly self-liberated people who had escaped bondage before the war's end. Yet as industry expanded into the corridor in the twentieth century, many of these Free Towns faced encroachment, and their residents were displaced or pushed out entirely.[15] This history carries ethical and descriptive significance. It reframes the corridor's industrial geography not as a neutral outcome of infrastructure or resource logic, but as the continuation of a much older pattern of dispossession. Quantitative environmental justice research also suggests that race, not zoning considerations, remains the strongest predictor of where hazardous industry is sited in this region.[16] Cancer Alley serves as a classic example of this phenomenon. It conflates, within a single geography, two stages of land exploitation that remain, in most other contexts, comparatively diffuse and difficult to trace to one another. The descendants of those who built the land's initial wealth under slavery remain excluded from the industrial wealth generated by that same land today. Cumulative Health The conventional method of assessing environmental pollution considers only one pollutant, one facility, and one exposure route at a time. This approach ignores the cumulative burden borne by populations experiencing multiple sources of pollution, as well as additional forms of socioeconomic or environmental pressure.[17] In recent years, the US Environmental Protection Agency has advocated for cumulative impact assessment as an alternative framework.[18] The case of Reserve, Louisiana, illustrates the considerable cost of adhering to the standard model. A federal inquiry found that residents living near a plant that manufactures chloroprene, a chemical used in the production of synthetic rubber, face one of the highest lifetime cancer risks in the country due to airborne chemical contamination.[19] The plant exposes residents of this predominantly Black neighborhood, many of them children from low-income families attending an elementary school located less than half a mile from the plant, to cancer risks that substantially exceed levels deemed acceptable by the agency's own standards.[20] High-precision mobile air quality monitoring has since confirmed that concentrations of volatile organic compounds in the surrounding air correspond to cancer risk levels well above federal thresholds, corroborating what residents themselves had reported for decades.[21] The Bioethical Problem: A False Symmetry The argument surrounding Cancer Alley is typically framed as an ordinary bioethical trade-off between economic development and public health, where one value must be weighed against another. This framing presupposes that the same parties bear both the costs and the benefits. However, in Cancer Alley, those who benefit, namely shareholders, senior management, and tax authorities, are indifferent to where their revenue originates. Conversely, those who bear the highest costs and environmental harm are disproportionately Black residents living along the fence line. This is not a trade-off in the traditional sense, since a trade-off describes a single party weighing costs and benefits for itself. It is instead a transfer: one group absorbs harm so that another group can capture the resulting gain. This situation also has an evidentiary dimension that constitutes a case of epistemic injustice: the unfair treatment of individuals, specifically in their capacity as knowers or sources of information.[22] In the context of Cancer Alley's public hearings, this injustice operates through two related mechanisms. The first is testimonial injustice, by which the system dismisses or recasts residents’ accounts of their exposure, their illnesses, and their uncompensated labor as mere anecdote, a discrediting rooted in their identity as low-income Black residents of a working-class industrial corridor. The second is representational injustice, by which the frameworks used to evaluate industrial expansion (chiefly, aggregate job counts and projected tax revenue) are structurally incapable of registering accumulated lived experience as a form of harm. When a resident recounts a father's decades of uncompensated labor, or when a mother describes her child's chronic lung disease, this is not merely testimony; it is a lifetime's evidentiary record of harm that regulatory frameworks have only recently begun to measure. It is not neutral to disregard this evidence while treating a company's self-reported revenue projections as self-evident fact. The Department of Justice brought into sharp relief the question of whose knowledge counts in 2025, when it dismissed its civil rights case against the operators of a petrochemical plant in Cancer Alley despite a substantial body of resident testimony documenting the harm at issue.[23] Dismissing this case did not resolve the underlying dispute over harm. Rather, it eliminated the institutional mechanism through which resident testimony could be treated as legally cognizable evidence, instead of as an anecdote. The bioethical question this paper raises, then, is not whether economic development and public health can be balanced against one another, but who holds the authority to define knowledge within that balancing process. Toward Redress Acknowledgment of these dynamics has grown, and comm", "oa_url": "https://journals.library.columbia.edu/index.php/index/article/view/14972", "pdf_url": "", "oa_status": "diamond", "cited_by": 0, "keywords": ["petrochemical industry", "Cancer Alley", "Louisiana", "racial discrimination", "property tax exemption", "industrial pollution", "environmental justice", "frontline communities"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 0}, {"id": "W7214316276", "doi": "10.1016/j.joitmc.2026.100881", "title": "When the neediest are the least ready: Open business models in Indonesian banana value chains", "date": "2026-09-25", "year": "2026", "journal": "Journal of Open Innovation Technology Market and Complexity", "issn": "21998531", "publisher": "Springer Science+Business Media", "authors": ["Asaduddin Abdullah", "Dikky Indrawan", "Alim Setiawan Slamet", "Heti Mulyati", "Agus Purwito", "Indah Yuliasih", "Yanuar Trisnowati", "Diyah Ratna Fauziana", "Xue-Ming Yuan", "Chaik Ming Koh"], "abstract": "This study challenges the narrative that open business models drive inclusive agricultural development. A comparative case study of Indonesian banana value chains confirms that an open, cooperative-mediated export model is associated with lower transaction costs, reduced information asymmetry, and greater financial inclusion than a closed, middleman-dominated domestic model. However, four critical complications have emerged. First, the transparency of the open model is superficial; cooperative management remains obscure to members, revealing that outward openness masks inward closures. Second, farmers do not commit to one model but maintain portfolio strategies, retaining ties to the closed system as insurance against open-system risks. Third, a break-even analysis shows that the closed system's credit terms dominate formal options when the harvest failure probability exceeds approximately 37% under the median-rate and full-waiver assumptions—an illustrative scenario rather than a general empirical threshold, because the threshold ranges from 26% to above 100% across the observed rate and waiver combinations, indicating that closed models persist through competitiveness, not merely exploitation. Fourth, the wide interest rate dispersion within the closed model (48–150%) reveals an internal spectrum from extractive to relational intermediaries. This study makes three contributions: nested closure, portfolio rather than binary adoption, and a Capability–Need Inversion Paradox advanced as a theory-generating proposition supported by preliminary researcher-rated evidence and by the captured-openness, dominance-region, and intermediary-gradient findings. These findings challenge simplistic openness-development narratives and provide a framework for understanding business model dynamics in asymmetric institutional contexts, where relational complexity, risk management, and local adaptation fundamentally shape the outcomes.", "oa_url": "https://doi.org/10.1016/j.joitmc.2026.100881", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["open business models", "banana value chain", "value chain development", "smallholder farmers", "agricultural innovation"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 58}, {"id": "W7214363671", "doi": "10.1016/j.jrurstud.2026.104423", "title": "Can information increase farmers’ willingness to pay for digital agricultural technologies? A survey experiment on agricultural drones in rural China", "date": "2026-09-25", "year": "2026", "journal": "Journal of Rural Studies", "issn": "07430167", "publisher": "Elsevier BV", "authors": ["Zhixian Lu", "Huang Chen", "Jinxia Wang", "Kaixing Huang"], "abstract": "Can information interventions increase farmers’ willingness to pay (WTP) for digital agricultural technologies, and do their effects vary by mode of access? We conduct a large-scale survey experiment across eight provinces in China, providing farmers with technical and market information about agricultural drones. The intervention significantly increases WTP by approximately 29% for drone services and 37% for direct investment, relative to their baseline levels. Mechanism analysis suggests that farmers’ improved cognition of technical characteristics exhibits an inverted-U relationship with service WTP but a positive relationship with investment WTP, whereas cognition of market conditions is positively associated with WTP for both modes. Using a saturation design, we identify a positive spillover effect on service WTP and a treatment-saturation effect consistent with social interaction: treated farmers in partially treated villages exhibit lower gains in service WTP than those in fully treated villages, with this pattern moderated by local adoption status. Importantly, while advantaged farmers exhibit larger WTP gains for direct investment, disadvantaged farmers (smallholders, elderly, less educated) respond more on the service margin, suggesting a potential pathway to address the digital divide. Illustrative projections based on stated WTP suggest possible increases in investment rates. These findings imply that extension programs should be tailored to local adoption conditions and facilitate service-based access for inclusive agricultural digitalization.", "oa_url": "https://doi.org/10.1016/j.jrurstud.2026.104423", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["willingness to pay", "agricultural drones", "digital agricultural technologies", "information interventions", "agricultural extension", "technology adoption", "spillover effects", "social interaction"], "topics": ["Akses & informasi pasar petani", "Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 57}, {"id": "W7214338777", "doi": "10.3389/frbhe.2026.1900046", "title": "Behavioral decision-making and marketing institution preferences in coconut agroindustry development: evidence from SWOT-AHP and value-added analysis in Indonesia", "date": "2026-09-25", "year": "2026", "journal": "Frontiers in Behavioral Economics", "issn": "28135296", "publisher": "Frontiers Media", "authors": ["Wa Ode Dian Purnamasari", "Sutawi", "Bambang Yudi Ariadi", "Wa Ode Al Zarliani"], "abstract": "Introduction Coconut agroindustry supports rural livelihoods and economic resilience in Indonesia, yet many producers remain dependent on inefficient marketing systems characterized by intermediary dominance, weak bargaining power, and limited value-added diversification. This study examines how behavioral decision-making influences marketing institution preferences and strategic agroindustry development in Buton Regency, Indonesia. Methods A field-based mixed-method study involved 489 copra processors, 182 coconut shell charcoal processors, marketing actors, and 10 institutional experts. Economic performance was evaluated through Hayami value-added analysis, farmer’s share, marketing margins, and a price-spread efficiency index. The archived expert-consensus ordering of five marketing-institution criteria was converted into normalized rank-order centroid weights. The retained four-group priority vector was analyzed through a transparent group-level SWOT-AHP synthesis and one-at-a-time sensitivity analysis. Results Coconut shell charcoal processing generated an average value added of IDR 1,002.52/kg and a value-added ratio of 54.87%. The shorter marketing channel increased farmer's share from 75.00% to 85.71% and reduced the price-spread index from 25.00% to 14.29%. Selling price (0.4567), demand stability (0.2567), and accessibility (0.1567) were the leading preference criteria. SWOT weights were 0.4658 for strengths, 0.2771 for opportunities, 0.1611 for weaknesses, and 0.0960 for threats. The normalized strategy scores ranked SO first (0.3715), followed by ST (0.2809), WO (0.2191), and WT (0.1286); no rank reversals occurred under ±10% and ±20% weight perturbations. Discussion Coconut-agroindustry decisions reflect both economic incentives and institutional constraints. Higher-value processing and shorter marketing channels improve economic outcomes, but liquidity certainty, transaction security, accessibility, and institutional familiarity continue to shape producer preferences. The behavioral interpretation is therefore preference-based and conceptual rather than a psychometric validation of bounded rationality or institutional trust.", "oa_url": "https://www.frontiersin.org/journals/behavioral-economics/articles/10.3389/frbhe.2026.1900046/pdf", "pdf_url": "https://www.frontiersin.org/journals/behavioral-economics/articles/10.3389/frbhe.2026.1900046/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["marketing institutions", "behavioral decision making", "copra processing", "coconut shell charcoal", "value-added analysis", "farmer share", "marketing margin", "bargaining power"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 43}, {"id": "W7214332603", "doi": "10.3390/ijms27198591", "title": "Nitric Oxide Signaling in Photosynthetic Resilience: Linking Photoprotection and Carbon Gain in Tropical Crops", "date": "2026-09-25", "year": "2026", "journal": "International Journal of Molecular Sciences", "issn": "14220067", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Mohammad Shafiqul Islam", "Nusrat Jahan Methela", "Young B. Cho", "Moon‐Sub Lee", "Bong‐Gyu Mun"], "abstract": "Tropical crops are increasingly exposed to climate-driven, recurrent combinations of heat, excessive irradiance, high vapor pressure deficit (VPD), drought, flooding, salinity, and pathogen pressure that collectively impair photosynthesis and reduce crop productivity. Unlike individual stress events, these interacting stresses simultaneously disrupt photoprotection, electron transport, carbon assimilation, stomatal regulation, and chloroplast redox homeostasis, ultimately limiting whole-plant carbon gain under fluctuating environments. Nitric oxide (NO) has emerged as a central signaling molecule coordinating these adaptive responses, yet its roles in photosynthetic regulation remain dispersed across molecular, physiological, and crop-specific studies. This review presents an integrated framework linking chloroplast-level NO signaling with whole-plant photosynthetic performance in major tropical crops, including maize, sugarcane, banana, cassava, and oil palm. We propose that NO regulates photosynthetic resilience through three interconnected axes: (i) reversible protein S-nitrosylation that modulates photosynthetic complexes and Calvin–Benson cycle enzymes; (ii) maintenance of chloroplast redox homeostasis through coordinated reactive oxygen species (ROS) and reactive nitrogen species (RNS) signaling, antioxidant networks, and S-nitrosothiol metabolism; and (iii) ABA-mediated stomatal regulation that optimizes the trade-off between carbon assimilation, stomatal conductance, and water-use efficiency under environmental stress. We further discuss the emerging roles of S-nitrosothiols (SNOs) and S-nitrosoglutathione (GSNO) as central regulators of NO homeostasis and potential biochemical indicators linking chloroplast signaling with whole-plant carbon performance. By synthesizing current evidence across climate-relevant stress combinations, including heat + high light, drought + high VPD, flooding + hypoxia, salinity + pathogen interactions, this review provides a conceptual framework for understanding NO-mediated photosynthetic resilience and identifies key research priorities for developing NO-based strategies to enhance productivity and climate resilience in tropical cropping systems.", "oa_url": "https://doi.org/10.3390/ijms27198591", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["nitric oxide signaling", "photoprotection", "tropical crops", "S-nitrosylation", "reactive oxygen species", "reactive nitrogen species", "S-nitrosothiols", "S-nitrosoglutathione"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 31}, {"id": "W7214281036", "doi": "10.1016/j.talanta.2026.130673", "title": "AI-assisted smartphone-based prompt fluorescence imaging for adulteration monitoring of extra virgin olive oil", "date": "2026-09-25", "year": "2026", "journal": "Talanta", "issn": "00399140", "publisher": "Elsevier BV", "authors": ["Arnab Talukder", "Md. Sadik Al Rayhan", "Mohiminur Rahman Ifty", "Md. Tanjim Joarder", "Md. Arafat Hossain", "Md. Rafiqul Islam", "Protik Chandra Biswas"], "abstract": "Detection of adulteration in extra-virgin olive oil (EVOO) and tracing possible sources remain critical challenges for food authenticity, consumer safety, and regulatory enforcement, particularly in resource-limited settings where the application of high-accuracy analytical tools is impractical. In this work, a practical integration of a machine learning system with a compact, ultra-low-cost smartphone-based prompt fluorescence imaging platform is presented for on-site detection of EVOO adulteration, where prompt fluorescence refers to fluorescence recorded during excitation without time-delayed detection. The proposed platform employs a λ= 405 nm laser excitation source and orthogonal fluorescence imaging geometry, customized with a smartphone CMOS camera. The smartphone runs as a two-stage analytical framework, comprising adulterant classification followed by concentration estimation. The performance of machine-learning approaches (LightGBM, SVM, KNN, RF, Logistic Regression, Naive Bayes, Gradient Boosting, Decision Tree, Lasso Regression, SVR) has been evaluated using EVOO adulterated with common sources of adulteration such as refined olive oil, soybean oil, and palm oil over a wide concentration range. Machine learning models attain strong discrimination ability and high predictive accuracy by utilizing non-linear relationships within the fluorescence-derived RGB features. Independent validation using real samples confirms reliable adulterant identification and accurate EVOO purity estimation, with an average error of 3.1%. The present framework has been developed and validated using binary mixtures containing EVOO and a single adulterant, with the minimum operational detection threshold being 2% adulterant concentration. The proposed approach overcomes key limitations of conventional methods by enabling simultaneous detection of adulterant type and quantification without prior knowledge of the adulterant type, and therefore allowing users to predict the possible source of adulteration.", "oa_url": "https://doi.org/10.1016/j.talanta.2026.130673", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["extra virgin olive oil", "olive oil adulteration", "food authenticity", "palm oil adulteration", "soybean oil adulteration", "refined olive oil"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7214330296", "doi": "10.1016/j.biombioe.2026.110127", "title": "Unraveling the catalytic potential of a heterometallic Zn-Ca metal-organic framework for intensified green biodiesel synthesis from waste palm oil", "date": "2026-09-25", "year": "2026", "journal": "Biomass and Bioenergy", "issn": "09619534", "publisher": "Elsevier BV", "authors": ["Abu Mustafa Khan", "D. Rhithuparna", "Suhaib Ansari", "Mohammad  Zaeem Sherwani", "Sujoy Chattaraj", "Samuel Lalthazuala Rokhum", "Gopinath Halder"], "abstract": "The diminution of fossil fuel reserves and the escalating environmental concerns have triggered a worldwide search for sustainable energy solutions. In this light, the present study explores the use of a heterometallic structured zinc-calcium metal-organic framework (Zn-Ca MOF) as a heterogeneous catalyst to address this problem. The novelty of this work lies in integrating this heterometallic Zn-Ca MOF catalyst with statistical process optimization and economic assessment for the conversion of waste palm oil into biodiesel. To optimize the transesterification process, Response Surface Methodology (RSM) based on a Central Composite Design (CCD) was employed to assess the interactive impact of key process variables, specifically methanol-to-oil molar ratio, catalyst loading, reaction temperature, and time, to maximize the production of fatty acid methyl esters (FAME). Under the optimized conditions of a methanol-to-oil ratio of 6:1, a catalyst loading of 5 wt %, a temperature of 75 °C, and a reaction time of 180 min, a remarkable biodiesel productivity of 97.34% was achieved. Catalyst reusability tests demonstrated sustained catalytic activity without decay over seven consecutive reaction cycles, while life cycle cost analysis (LCCA) confirmed the economic feasibility of the process. These findings validate that the Zn-Ca MOF is a robust, efficient, and cost-effective hetero-catalyst for sustainable biodiesel production.", "oa_url": "https://doi.org/10.1016/j.biombioe.2026.110127", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["biodiesel production", "waste palm oil", "heterometallic metal-organic frameworks", "heterogeneous catalysis", "transesterification", "fatty acid methyl esters", "catalyst reusability", "process optimization"], "topics": ["Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 17}, {"id": "W7214396032", "doi": "10.3390/laws15050126", "title": "Judicial Interpretation and Employee Compensation in Corporate Insolvency: A Comparative Analysis of Malaysia and Australia", "date": "2026-09-25", "year": "2026", "journal": "Laws", "issn": "2075471X", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Aimi Anuar", "Muhamad Yohaniz Atan"], "abstract": "When a company is wound up, employee compensation is recognised, but it usually occupies a vulnerable position. Although most insolvency systems grant priority to unpaid wages, termination benefits, and accrued employment entitlements, substantive recovery often remains uncertain due to asset insufficiency and interactions with secured creditor claims. This article examines how judicial interpretation mediates the relationship between formal priority and actual recovery in corporate insolvency. The study adopts a doctrinal and comparative case law approach based on the analysis of leading insolvency decisions in Malaysia and Australia. The findings indicate that courts in both jurisdictions consistently uphold statutory hierarchy but differ in their interpretive engagement with employee vulnerability and asset characterisation. Australian cases more often involve questions of circulating assets, receivership, and estate scope, and operate within a framework supplemented by the Fair Entitlements Guarantee (FEG) scheme. Malaysian courts generally adopt a more formalist interpretive posture within insolvency distribution law, where employee recovery remains more directly dependent on statutory priority and the sufficiency of the insolvent estate. The article contributes to comparative insolvency scholarship by clarifying how interpretive choices and structural constraints shape employee protection in practice.", "oa_url": "https://doi.org/10.3390/laws15050126", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["employee compensation", "corporate insolvency", "judicial interpretation", "receivership", "circulating assets", "secured creditors", "employee protection", "Malaysia"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 14}, {"id": "W7214376038", "doi": "10.1080/02827581.2026.2736666", "title": "The hidden wealth of forests: quantifying shadow protection value via a revealed-preference Hartman-Faustmann extension", "date": "2026-09-25", "year": "2026", "journal": "Scandinavian Journal of Forest Research", "issn": "02827581", "publisher": "Taylor & Francis", "authors": ["Jaakko Juvonen"], "abstract": "This paper introduces a revealed-preference application of the Hartman-Faustmann forestry valuation to construct a one-sided, benchmark-relative opportunity-cost measure for privately owned forests, combining population-wide administrative data on forest owners with forest characteristics. Using stand-level data for over 690,000 privately owned forest stands in Finland, I compare observed stand ages with Faustmann-optimal rotation ages calculated under the benchmark model. Stands left unharvested beyond the Faustmann-optimal rotation age are assigned a shadow protection value (SPV), defined as the foregone timber value associated with observed harvest postponement relative to that benchmark. I examine how owner characteristics are associated with extended rotations and foregone timber revenue. The results imply an aggregate SPV of €196–323 million (€423–724 per hectare of delayed-rotation forest) across discount rates of 3% to 1%. Around 36.8% of identifiable private forest owners have stands with extended rotations, covering 3.6% of privately owned forests. Among delayed-rotation stands, SPV and extension length are higher for rural residents and owners with larger forest holdings, while the associations with owner age and heir-estate status are sensitive to model specification. The observed heterogeneity may inform targeting of forest policy instruments by indicating for whom liquidity constraints and ownership-transfer frictions may be most relevant.", "oa_url": "https://doi.org/10.1080/02827581.2026.2736666", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["forest ecosystem services"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 7}, {"id": "W7214149886", "doi": "10.1002/sd.71714", "title": "Mixed‐Methods Insights on Trade Efficiency and Sustainability in Indonesia's Palm Oil Sector", "date": "2026-09-24", "year": "2026", "journal": "Sustainable Development", "issn": "09680802", "publisher": "Wiley", "authors": ["Fatima Tuzzahara Alkaf", "Evelyn S. Devadason"], "abstract": "ABSTRACT This study combines quantitative trade modelling with qualitative stakeholder perspectives. The quantitative analysis integrates gravity modelling and stochastic frontier analysis to evaluate trade efficiency across destination markets, revealing generally low export efficiency with considerable variation across markets and product groups. While tariffs exhibit a more consistent negative relationship with trade performance, the relationship between regulatory distance in non‐tariff measures and trade performance is less robust across model specifications. Qualitative insights from government, industry, smallholders, and non‐governmental organizations (NGOs) provide important context for these findings. Stakeholders consistently identify sustainability requirements, particularly certification, traceability, and land legality, as central to market access. Government actors emphasize trade diplomacy and market diversification, industry representatives highlight compliance costs and technical adaptation, smallholders stress price volatility and the risk of exclusion from formal supply chains, while the limited NGO responses identify sustainability as an important consideration for market legitimacy. Across stakeholder groups, sustainability emerges as a key link between trade barriers, market opportunities, and export competitiveness. Integrating both strands of evidence reveals convergence between the negative association of regulatory distance with trade performance and stakeholder concerns about sustainability‐related market barriers, particularly in the European Union (EU), while also highlighting firm‐level and implementation frictions that are not captured by macro‐level trade models. The findings suggest that access to the EU market is becoming increasingly dependent on compliance with stringent sustainability requirements. The study concludes that strengthening Indonesia's export performance requires a coordinated strategy combining efficiency improvements, sustainability compliance, trade diplomacy, and targeted support for smallholders.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/sd.71714", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/sd.71714", "oa_status": "bronze", "cited_by": 0, "keywords": ["palm oil trade", "export efficiency", "sustainability requirements", "non-tariff measures", "regulatory distance", "tariffs", "stakeholder perspectives", "sustainability certification"], "topics": ["Akses & informasi pasar petani", "Kelapa sawit"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 62}, {"id": "W7214168061", "doi": "10.1016/j.gfs.2026.100946", "title": "Mapping climate resilience and food security outcomes in smallholder agricultural systems research in low- and middle-income countries", "date": "2026-09-24", "year": "2026", "journal": "Global Food Security", "issn": "22119124", "publisher": "Elsevier BV", "authors": ["Shareen K.D. Sanders", "Işık Öztürk", "Kamal Elharty", "Linda Errington", "Aakar Shah", "Volha Skidan", "Vidhi Shah", "Oshani Perera", "Sini Savilaakso"], "abstract": "Climate change threatens agricultural systems and food security in low- and middle-income countries. Seven agricultural interventions have been identified for their potential to improve both food security (FS) and climate resilience (CR) in smallholder systems. This review examines how FS and CR outcomes are measured across these interventions, where research has concentrated, and where gaps remain. We focus on simultaneous measurement of both outcomes in contrast to previous reviews that examined one or the other. We conducted searches in six databases. Using a combination of manual screening and ML classification we identified a subset of 127 studies reporting at least one FS and one CR outcome. Based on this subset, literature is concentrated on biophysical interventions; soil conservation, improved water management, and crop diversification, while enabling interventions such as improved market access, access to climate information and extension services, and post-harvest management and storage are sparsely represented. Most studies assess short-term outcomes at community or household level, providing highly context-specific insights. The focus on biophysical indicators restricts understanding of how smallholder resilience is shaped with enabling interventions beyond the farm gate. Similarly, emphasis on short-term impacts, and small study scales, limits development of systemic insights. Addressing these constraints requires a shift toward multi-level, longitudinal research and adoption of harmonized FS and CR indicators enabling comparability and scaling. Collaborative efforts among research networks, donors, and international organizations promoting standardized indicators and impact-evaluation frameworks will be essential to build coherent evidence base capable of guiding resilient food-system transformation under increasing climate stress.", "oa_url": "https://doi.org/10.1016/j.gfs.2026.100946", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["climate resilience", "food security", "smallholder farming", "climate change impacts on agriculture", "outcome measurement", "soil conservation", "water management", "crop diversification"], "topics": ["Akses & informasi pasar petani"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 51}, {"id": "W7214169979", "doi": "10.1016/j.jafr.2026.103329", "title": "From plantation to secondary market: A mesoeconomic thematic analysis on labour demand–supply coordination and food waste reduction in the Australian banana industry", "date": "2026-09-24", "year": "2026", "journal": "Journal of Agriculture and Food Research", "issn": "26661543", "publisher": "Elsevier BV", "authors": ["Mallika Roy", "Delwar Akbar", "Azad Rahman", "Darshana Rajapaksa", "C. M. Rixon"], "abstract": "ABSTRACT Food waste in fresh produce supply chains is often attributed to logistics, retail standards, or consumer preferences, yet the role of labour demand–supply coordination in labour-intensive horticulture remains under-examined. This study investigates how labour coordination, market structures, organisational capacity, and value-recovery pathways jointly shape food-waste generation and the recovery of off-spec bananas through secondary markets and circular-economy pathways in the Australian banana industry. Using a mesoeconomic perspective, four in-depth semi-structured interviews were conducted across four Queensland banana farms of different operational scales, involving three growers/decision-makers and one central packing-shed manager. Thematic analysis examined how labour pipelines, training systems, technology, market access, and organisational practices interact to influence food-waste outcomes. The findings show that food waste is not primarily a technical failure but an outcome of interrelated coordination processes involving labour systems, market structures, organisational practices, and recovery mechanisms. Family-based farms rely on tacit labour and short marketing circuits to minimise waste, whereas medium- and large-scale operations use institutionalised migration schemes, structured training, and data-driven packing systems to stabilise labour supply and manage quality losses. Supermarket grading standards and transport distances contribute to structurally embedded waste, while secondary processing, animal feed, and other value-recovery pathways partially offset these losses. Across the cases, workforce continuity, training, and organisational coordination were associated with lower preventable waste and greater recovery of off-spec fruit. By positioning food waste within the mesoeconomic organisation of production, labour, markets, and recovery pathways, this study contributes to agricultural economics by demonstrating how interconnected organisational and market mechanisms shape waste generation and value recovery. The findings provide practical implications for labour policy, migration schemes, secondary-market development, and circular-economy strategies in perishable agricultural supply chains.", "oa_url": "https://www.sciencedirect.com/science/article/pii/S2666154326007003/pdf", "pdf_url": "https://www.sciencedirect.com/science/article/pii/S2666154326007003/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["banana industry", "labor demand", "labor supply", "food waste reduction", "secondary market", "mesoeconomics", "plantation agriculture"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 48}, {"id": "W7214099591", "doi": "10.3389/fsufs.2026.1907286", "title": "Beyond awareness: accounting for information exposure bias in adoption and income effects of Orange-Fleshed Sweet Potato technology among smallholder farming households in Nigeria", "date": "2026-09-24", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Adetomiwa Kolapo", "Melusi Sibanda", "Nolwazi Zanele Khumalo", "Temitope Oluwaseun Ojo"], "abstract": "This study examined the role of information exposure in the adoption of Orange-Fleshed Sweet Potato (OFSP) technology and its effect on the income of smallholder sweet potato farming households in Nigeria. Using cross-sectional primary data collected from 320 smallholder sweet potato farming households in Osun and Kwara States through a two-stage sampling procedure, the study accounted for heterogeneous awareness exposure and actual adoption behavior. The Heckman probit selection model was employed to distinguish between awareness exposure and adoption conditional on awareness, while the Endogenous Treatment Effect (ETE) and Inverse-Probability-Weighted Regression Adjustment (IPWRA) models were used to estimate the income effects of OFSP adoption while correcting for potential endogeneity and selection bias. The findings showed that awareness exposure was significantly influenced by age, marital status, household size, and membership in farmer associations, whereas adoption conditional on awareness was significantly associated with education, farming experience, and access to credit. Descriptively, OFSP adopters reported more favorable perceptions of the technology’s productivity, climate resilience, and nutritional benefits than non-adopters. Both ETE and IPWRA estimates further indicated that OFSP adoption had a positive and significant effect on household income. The study concludes that awareness and adoption are distinct stages influenced by different factors. Policies aimed at promoting OFSP adoption should therefore strengthen targeted information dissemination, extension support, farmer education, and access to credit to enhance adoption, household income, food security, nutrition, and rural livelihoods.", "oa_url": "https://doi.org/10.3389/fsufs.2026.1907286", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["orange-fleshed sweet potato", "technology adoption", "information exposure", "awareness", "household income", "smallholder farmers", "selection bias", "endogenous treatment effects"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 47}, {"id": "W7214363646", "doi": "10.1002/bse.71591", "title": "From Farm to Global Markets: Enhancing Rural Livelihoods Through Sustainable Superfood Supply Chains", "date": "2026-09-24", "year": "2026", "journal": "Business Strategy and the Environment", "issn": "09644733", "publisher": "Wiley", "authors": ["Rahul Priyadarshi", "C.V. Sunil Kumar", "Vandana Vandana"], "abstract": "ABSTRACT This research examines the cultivation and distribution business strategies of rural superfoods aimed at sustainable development. Superfoods have the potential to sustainably improve rural livelihoods, promote healthy consumption and enable integration into global markets as health consciousness rises. Accordingly, the study has explored the Sustainable Business Development Factors (SBDFs) that could contribute to the attainment of the Sustainable Development Goals (SDGs) including poverty alleviation (SDG 1), health awareness and sustainable wellness (SDG 3), business modernization and structural development (SDG 9), sustainable harvesting and dietary habits (SDG 12) and collaboration for collective success (SDG 17). The research uses Fuzzy Analytical Hierarchy Process (FAHP), Pareto analysis, and Fuzzy DEMATEL to identify, rank and analyse causal relationships among the SBDFs. Analysis shows that social motivation, sustainability‐driven behaviours and government support lead to success. The prominent causal SBDFs identified were local and regional food systems, rural development and infrastructure, information governance and digital infrastructure and institutional support and capacity building. They influence social responsibility and ethical standards, supply chain transparency and traceability, sustainable packaging and transportation, health and safety standards and carbon footprint reduction. This analysis enables superfoods to integrate environmental, social and governance (ESG) sustainability, providing smallholders with actionable knowledge to develop sustainable, digitally enabled business models.", "oa_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/bse.71591", "pdf_url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/bse.71591", "oa_status": "bronze", "cited_by": 0, "keywords": ["superfoods", "rural livelihoods", "supply chain sustainability", "smallholder farmers", "Sustainable Development Goals", "local food systems", "supply chain transparency", "traceability"], "topics": ["Pembangunan pedesaan & kebijakan pertanian"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 38}, {"id": "W7214230798", "doi": "10.3390/agriculture16192076", "title": "The Prospects and Challenges of Community Seed/Field Banking of Bananas, Roots and Tubers: Insights from the Literature and a Pilot Initiative in Ghana", "date": "2026-09-24", "year": "2026", "journal": "Agriculture", "issn": "20770472", "publisher": "Multidisciplinary Digital Publishing Institute", "authors": ["Ronnie Vernooy", "Daniel Nyadanu"], "abstract": "Neglected and underutilized species, also known as minor or orphan crops, are a core component of local food systems in Africa. Roots, tubers, and bananas (RTB) are a particular group of these crops characterized by vegetative propagation. This reproductive system poses challenges for their conservation. Community seed banks commonly conserve seeds of grains, oil crops, pulses, and vegetables. However, little is known about whether and how community seed banks around the world include roots, tubers, and bananas, which cannot be easily stored in conventional seed-bank facilities. The objective of this review was to contribute to the design of a method that can be effectively used by community seed banks to conserve RTB while complementing the conservation method already used for other crops. We conducted a systematic literature review and assessed the initial results of a pilot study involving a new community-based conservation mechanism introduced in Ghana: the community field bank. The strengths and challenges of the two methods were compared. Field bank and seed bank can become complementary components, both conceptually and practically, of a dynamic conservation system that farmers can master through learning by doing. Initial observations from the field in Ghana suggest that farmers have grasped the concept and are now monitoring the practicalities of RTB field-bank plots, with the distribution of the first vegetatively propagated planting materials taking place toward the end of 2026. Further research, both within and beyond the pilot study sites, is warranted to refine the field-bank method.", "oa_url": "https://doi.org/10.3390/agriculture16192076", "pdf_url": "", "oa_status": "gold", "cited_by": 0, "keywords": ["community seed banks", "root and tuber crops", "banana", "neglected and underutilized species", "crop conservation", "vegetative propagation", "Ghana"], "topics": ["Komoditas: pisang, nanas, padi rawa"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 33}, {"id": "W7214186963", "doi": "10.14719/pst.16225", "title": "Performance of millet intercrops under Casuarina junghuhniana Miq.-based agroforestry system and consequent changes in soil fertility", "date": "2026-09-24", "year": "2026", "journal": "Plant Science Today", "issn": "23481900", "publisher": "", "authors": ["B. Sivakumar", "K. Ananthi", "A Balasubramanian", "S Radhakrishnan", "P. Rajendran", "Barath Muralidharan", "S Navaneetha Krishnan", "K S Ashwin", "R. Adithiyan", "R S P Ravi"], "abstract": "An intercropping experiment was made through three consecutive crop cycles with Casuarina junghuhniana Miq. Plantations of (Casuarinaceae) established between 3–18 months after tree planting to determine the most suitable millet species and to determine the effect of intercropping on soil fertility. Six millet intercrops-kodo millet (Paspalum scrobiculatum L.), foxtail millet (Setaria italica (L.) P.Beauv.), finger millet (Eleusine coracana (L.) Gaertn.). Invading species include Gaertn., barnyard millet (Echinochloa frumentacea Link) and three crop species including little millet (Panicum sumatrense Roth) and proso millet (Panicum miliaceum L.) were tested in a randomised block design (RBD) with 3 blocks at the tree spacing of 2 m × 2 m. Evaluation was done for growth attributes, dry matter production (DMP), grain yield, crop equivalent yield (CEY), tree growth parameters, soil fertility and economics. Little millet always had the highest DMP (2560–2650 kg ha-1) and grain yield (770–1890 kg ha-1) under intercropping and added the highest value for tree height (5.63 m at 18 months) and wood production (29.84 t ha-1). C. junghuhniana + little millet produced the highest total land equivalent ratio (land equivalent ratio (LER) = 2.92) followed by C. junghuhniana + barnyard millet (LER = 2.51). Maximum net income (₹26000) and benefit to cost ratio (B : C = 3.16) was also obtained for little millet. The post-harvest soil analysis showed that the soil under all intercropping treatment was better in terms of soil electrical conductivity, soil organic carbon and available soil nutrients, namely nitrogen (N), phosphorus (P) and potassium (K) than in the tree-alone treatment. Kodo millet was least compatible intercrop in the study. Little millet is suggested as the best intercrop for C. junghuhniana-based short rotation plantation agroforestry, providing a viable option to the smallholder farmers to obtain short-term food and income and to promote the growth of trees and regeneration of soil fertility, thus emphasising the importance of selecting the appropriate species for agroforestry intercrop systems for better ecological and economic returns.", "oa_url": "https://horizonepublishing.com/journals/index.php/PST/article/download/16225/16278", "pdf_url": "https://horizonepublishing.com/journals/index.php/PST/article/download/16225/16278", "oa_status": "diamond", "cited_by": 0, "keywords": ["Casuarina junghuhniana", "agroforestry", "short rotation plantations", "little millet", "Echinochloa frumentacea", "kodo millet", "foxtail millet", "finger millet"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 23}, {"id": "W7214211154", "doi": "10.1007/s10342-026-01953-y", "title": "Perceptions of forest certification among key audiences in a mediterranean landscape dominated by forestry plantations", "date": "2026-09-24", "year": "2026", "journal": "European Journal of Forest Research", "issn": "16124669", "publisher": "Springer Science+Business Media", "authors": ["Sofia Lino", "Joana Pereira", "Maria Joao Santos", "Luís Miguel Rosalino"], "abstract": "Forest certification (FC) was created to promote responsible forestry by requiring compliance with defined environmental, social, and economic standards. Across Europe, interest in FC has grown in response to climate change mitigation and increasing societal demand for sustainable production. In Portugal, however, uptake remains low. Although small landowners hold most forested land, most certified areas are managed by two major pulp and paper companies, highlighting long-standing challenges in Portuguese forest management. Promoting sustainable forestry requires understanding how stakeholders who depend on and use forest products perceive forests and FC. To explore this, we conducted an anonymous semi-structured survey of forest managers, technicians, workers, landowners, and residents/users of plantations in Central Portugal. Respondents widely recognised forests as key providers of ecosystem services and consistently distinguished between native forests and eucalypt plantations, rating native forests more positively overall; however, perceptions varied across groups, particularly between forestry professionals and the general public. Knowledge of FC also differed, with forestry-related respondents showing greater familiarity and more positive assessments of its benefits, while others reported limited awareness. Nonetheless, most participants considered FC a valuable management tool, noting that uncertified plantations often lack active management. Among landowners, economic gain was the primary motivation for pursuing certification, while non-certified landowners cited small property size and lack of awareness as barriers. Our findings highlight the need for locally-adapted strategies that address the economic, administrative, and social concerns identified by stakeholders, and strengthen cooperative management structures (e.g., forest owners’ associations) to support broader adoption of FC across Portugal.", "oa_url": "https://doi.org/10.1007/s10342-026-01953-y", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["forest certification", "stakeholder perspectives", "eucalyptus plantations", "native forest", "sustainable forest management", "ecosystem services", "paper industry", "forest owners' associations"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 22}, {"id": "W7214104281", "doi": "10.1007/s13593-026-01138-2", "title": "Multifaceted dynamics in variety and seed choices: the case of pumpkin farmers in northern Vietnam", "date": "2026-09-23", "year": "2026", "journal": "Agronomy for Sustainable Development", "issn": "17730155", "publisher": "Springer Science+Business Media", "authors": ["Thi-Phuong Nguyen", "Paul C. Struik", "Conny Almekinders", "Kees Swaans", "Hai Thanh Vu", "T.J. Stomph"], "abstract": "Abstract Smallholder farmers’ crop variety and seed choices shape agro-biodiversity and livelihood sustainability. However, existing studies often overlook the dynamic, context-specific nature of these choices. We explored how introductions of hybrid pumpkin affected farmers’ pumpkin variety choices, seed sourcing, and seed management strategies across spatial and temporal contexts. We interviewed 72 stakeholders and 178 households from 3 ethnic groups in 15 villages at 2 altitudes in northern Vietnam. We assessed farmers’ encounters and experimentation with introduced pumpkin types, and why they grew different types, defined by fruit shape and seed origin (self-saved or purchased), using thematic analysis. Farmers were grouped according to the dynamics of their choices. In Mai Son (700 m above sea level), four groups emerged: (i) farmers abandoning traditional types and only growing introduced types, (ii) farmers growing traditional and introduced types, (iii) farmers only growing traditional types after experimenting with introduced types, and (iv) farmers exclusively growing traditional types without trying introduced types. In Sa Pa (1600 m above sea level), the first group was absent. Farmers encountered and experimented with introduced types, resulting in adoption or eventual dis-adoption based on agronomic performance, market opportunities, and how introduced varieties fitted within broader livelihood systems co-influenced by market access, land and labor allocation, and food and feed needs. These factors operated differently across the two agro-ecologies. Traditional types were maintained if serving farmers’ needs, not for conservation. We showed for the first time how the dynamics of variety use were shaped by a range of changes, not static decisions. Simple adoption models are not useful for designing interventions that enhance the use of introduced pumpkins or the conservation of traditional pumpkins: variety choice proved to be an ongoing, dynamic, contextualized process. Interventions need to align with farmers’ shifting priorities and constraints to support innovation and in situ conservation.", "oa_url": "https://link.springer.com/content/pdf/10.1007/s13593-026-01138-2.pdf", "pdf_url": "https://link.springer.com/content/pdf/10.1007/s13593-026-01138-2.pdf", "oa_status": "hybrid", "cited_by": 0, "keywords": ["pumpkin", "seed selection", "traditional crop varieties", "seed sourcing", "seed management", "smallholder farmers", "agrobiodiversity", "in situ conservation"], "topics": ["Akses & informasi pasar petani"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 40}, {"id": "W7214096390", "doi": "10.1145/3817035", "title": "\"We Belong to the Land\": Centering Aesthetic Experience in CSCW Research on Urban Farming", "date": "2026-09-23", "year": "2026", "journal": "Proceedings of the ACM on Human-Computer Interaction", "issn": "25730142", "publisher": "Association for Computing Machinery", "authors": ["Feifei Pang", "Rob Grace", "Lauren W. Forbes", "Jess Kropczynski"], "abstract": "Urban farming is increasingly recognized as a response to sustainability challenges caused by industrial agriculture. However, CSCW research has largely examined farming through optimization and coordination in large-scale and rural agricultural settings. This paper shifts the focus from achieving sustainability as a predefined goal to examining the ongoing process of sustaining, through which cooperative work is maintained over time, using aesthetic experience as an analytical lens. Drawing on an empirical study of small-scale urban farmers, we show that sustaining unfolds through four interrelated qualities of aesthetic experience, including attunement, rhythm, expressive form, and consummation. Through these qualities, farmers’ efforts to nourish neighbors, balance access with livelihood, and repair communities take form in everyday practice. At the same time, these experiences are continually shaped, and frequently disrupted, by material, social, ecological, and organizational constraints. We call for designing for sustaining to support continuity under constraint by deepening attunement, aligning rhythms, and supporting expressive forms that foster mutual appreciation. This study advances CSCW research by foregrounding the aesthetic dimensions of urban farming and opens up new directions for future digital technologies that foster sustainable community food systems.", "oa_url": "https://doi.org/10.1145/3817035", "pdf_url": "", "oa_status": "hybrid", "cited_by": 0, "keywords": ["urban agriculture", "aesthetic experience", "collaboration", "smallholder farmers", "community food systems", "attunement", "rhythm", "forms of expression"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 38}, {"id": "W7214095281", "doi": "10.3389/fsufs.2026.1908513", "title": "A study on entertainment farm education television programs in rainfed areas of the North-Western Himalayas, India", "date": "2026-09-23", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Banarsi Lal", "Parvender Sheoran", "Amit Singh Charak", "Jasbir Singh Manhas", "Suja N. Qureshi"], "abstract": "Introduction Entertainment–education (E–E) integrates educational messages with engaging narrative and entertainment formats and can complement conventional agricultural extension by improving the accessibility and practical salience of technical information. Evidence on farmer preferences for agricultural E–E television in rainfed Himalayan farming systems remains limited. Methods This study assessed farmers’ preferred agricultural technology themes, ranked selected agricultural television programs, and identified priority program contents among 150 television owning farmers in Reasi district, Jammu and Kashmir, India. Four Community Development blocks were randomly selected from the district’s 12 blocks, followed by random selection of Gram Panchayats, villages, and respondents. We collected data using a structured interview schedule and analyzed them descriptively using frequencies, percentages, and preference rankings. Results and discussion Methods of using insecticides and pesticides were the most preferred technology theme for E–E presentation (56.66%), followed by dairy production (25.33%), poultry production (10.66%), and soil-improvement techniques (7.33%). Krishi Darshan was the most preferred agricultural television program (72.66%), followed by agricultural and allied-sector programs on DD Kisan (18.00%) and Sadi Dharti Sade Lok (9.33%). Among program contents, insecticide and pesticide-use information ranked first (87.00%), followed by dairy guidance (79.00%), animal husbandry (75.00%), and monthly crop-management schedules (69.00%). The findings indicate a strong demand for practical, problem-oriented agricultural information and support the potential of E–E television as a complementary extension channel. From a sustainable food-systems perspective, future E–E programming should integrate integrated pest management, pesticide safety, soil health, climate resilience, and crop–livestock integration. Future research should test effects on knowledge, adoption, farm economics, and environmental outcomes using larger samples and experimental or longitudinal designs.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1908513/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1908513/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["entertainment-education", "agricultural television programs", "farmer preferences", "agricultural extension", "rainfed agriculture", "northwestern Himalaya", "dairy production", "poultry farming"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": true, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 32}, {"id": "W7214088794", "doi": "10.3389/fpls.2026.1946831", "title": "Radial growth resilience assessment and management implications for major planted forests in the west loess plateau based on improved parameters", "date": "2026-09-23", "year": "2026", "journal": "Frontiers in Plant Science", "issn": "1664462X", "publisher": "Frontiers Media", "authors": ["Yucheng Xiao", "Xiaomei Peng", "Quanyan Tian", "Cunwei Che", "Jingrong Su"], "abstract": "Under the background of global climate change, frequent and severe drought have led to forest decline and tree mortality, ultimately threatening the structure, function, and stability of forest ecosystems. However, forest ecosystems and individual trees exhibit a certain degree of growth resilience to the impacts of drought. A profound understanding of the growth resilience of forest ecosystems and individual trees to drought is of great significance for maintaining the stability of forest ecosystems, particularly for plantation ecosystems. Based on an improved resilience assessment framework (maximum averaged growth reduction and recovery rate with the flexible time window), this study compared the radial growth resilience of major tree and shrub species between planted forests across different sub-climatic zones of the west Loess Plateau and corresponding natural forest species in adjacent area. The results indicate that: 1) Compared to plantations, natural forest tree species exhibit higher growth resilience. 2) Platycladus orientalis , Hippophae rhamnoides , and Caragana korshinskii possess high growth resilience, rendering them highly suitable for afforestation across the arid regions of the Loess Plateau. In contrast, Picea crassifolia and Pinus tabulaeformis showed lower resilience and should be confined to high altitude, semi-arid zones with higher precipitation. 3) In terms of plantation management in areas with insufficient precipitation, appropriate silvicultural interventions, such as rainwater harvesting, soil moisture conservation, and stand tending, must be supplemented to maintain the healthy and sustainable development of planted forests. These findings provide a scientific basis for species selection and adaptive plantation management on the Loess Plateau.", "oa_url": "https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2026.1946831/pdf", "pdf_url": "https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2026.1946831/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["drought resilience", "forest plantations", "Loess Plateau", "tree species selection", "afforestation", "natural forest comparison", "Platycladus orientalis", "Hippophae rhamnoides"], "topics": ["Tenaga kerja & produktivitas perkebunan"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 6}, {"id": "W7168366870", "doi": "10.12688/f1000research.177413.1", "title": "Exploring Revenue-Sharing Strategies as a Pathway to Inclusive Growth and Sustainability in Sri Lanka’s Tea Value Chain", "date": "2026-09-22", "year": "2026", "journal": "F1000Research", "issn": "20461402", "publisher": "Faculty of 1000", "authors": ["Sanjeewa Jayawickrama", "D. A. T. Kumari", "Ravindra Dissanayake", "Prem Kumar"], "abstract": "Purpose The tea industry, a cornerstone of agricultural economies across Asia and Africa, faces persistent challenges related to unequal value distribution, rising production costs, labour shortages, and climate uncertainty. This study systematically examines revenue-sharing (RS) strategies as a mechanism for promoting inclusive growth, equitable value distribution, and long-term sustainability within the tea value chain, with particular emphasis on the Sri Lankan context. Design/methodology/approach A Structured Literature Review (SLR) was conducted following a PRISMA-based review protocol. A total of 186 records were identified from five major academic databases, of which 32 studies published between 2000 and 2024 met the inclusion criteria. Bibliometric analysis using VOSviewer, together with thematic content analysis, was employed to identify the intellectual structure, research trends, and emerging themes within the literature. Findings The review identified four major research clusters: (1) smallholder empowerment through revenue-sharing incentives, (2) digital traceability and blockchain-enabled revenue-sharing systems, (3) cooperative governance and risk-sharing mechanisms, and (4) policy frameworks and institutional barriers. The findings indicate that revenue-sharing mechanisms have considerable potential to improve producer incentives, strengthen transparency, enhance stakeholder trust, and promote sustainable value-chain governance. Based on these findings, the study proposes an integrated conceptual framework linking revenue-sharing mechanisms, digital technologies, cooperative governance, and sustainability outcomes. Research limitations/implications The study is based on secondary literature and therefore highlights the need for future empirical validation of revenue-sharing models, particularly blockchain-enabled contracts, digital payment systems, and gender-inclusive governance frameworks within plantation economies. Practical implications The findings provide evidence-based recommendations for policymakers, tea boards, cooperatives, exporters, and plantation companies, including regulatory reforms, tax incentives, mandatory revenue-sharing disclosure, digital traceability, and cooperative digitisation to facilitate equitable and sustainable value-chain development. Originality/value This study represents the first structured literature review dedicated to revenue-sharing in the tea value chain. It develops the first integrated conceptual framework connecting revenue sharing, digital technologies, governance, and sustainability while proposing the first comprehensive future research agenda for tea-sector revenue-sharing. The study advances both theory and practice by providing an evidence-based roadmap for achieving inclusive growth and sustainable transformation in plantation-based value chains.", "oa_url": "https://f1000research.com/articles/15-1566/pdf", "pdf_url": "https://f1000research.com/articles/15-1566/pdf", "oa_status": "gold", "cited_by": 0, "keywords": ["revenue sharing", "inclusive growth", "sustainable value chains", "smallholder empowerment", "blockchain traceability", "cooperative governance", "plantation economy", "Nevanlinna theory"], "topics": ["Adopsi teknologi & pertanian digital"], "priority_journal": false, "language": "en", "found_at": "2026-10-16", "summary_id": null, "relevance": 49}, {"id": "W7214023979", "doi": "10.3389/fsufs.2026.1940600", "title": "Integrating agrarian differentiation and labor mobility into TAPE-based assessments of agroecology. A methodological exploration in the Cambodian rice sector", "date": "2026-09-22", "year": "2026", "journal": "Frontiers in Sustainable Food Systems", "issn": "2571581X", "publisher": "Frontiers Media", "authors": ["Titouan Filloux", "Jean‐Christophe Diepart", "Mathilde Sester", "Rada Kong", "Sreymom Sieng", "Florent Elie Tivet"], "abstract": "Agroecology is increasingly considered to be a promising pathway to more sustainable agriculture. The Tool for Agroecology Performance Evaluation (TAPE) is a multiscale interdisciplinary assessment framework that helps tackle the complexity of such transitions. We critically engaged with TAPE and explored ways to enhance the approach based on empirical case studies conducted in Cambodia, in two rice-based agricultural landscapes with contrasted degrees of agricultural intensification. We complemented the TAPE framework by clarifying and operationalizing perspectives on the political-economic dynamics of agrarian change, including the reconstruction of agrarian history, a farming-system typology based on the distribution of land, and other assets and explicit consideration of off-farm work and migration. We then assessed TAPE at the local level, using focus group discussions with farmers’ collectives, in-depth household surveys, and interviews with village authorities and public administration at the local and provincial levels. The study helped frame agroecological performance from the perspective of the recent agrarian dynamics that have emerged in each area and have largely favored conventional agriculture models that rely on synthetic agro-chemicals and mechanization to achieve higher production and exports. This modernization pathway has unfolded in both landscapes and has resulted in rapid differentiation between smallholder farming households in terms of asset structure and labor processes. Our approach provides a basis for understanding why farmers’ production logic, constraints, and opportunities to engage time and resources in more sustainable farming practices vary considerably between and within landscapes. We argue that enriching the TAPE approach with such political-economic questions of agrarian changes makes it possible to link scales and to understand how agrarian modernization intersects with transition to agroecology. We see it as an important component for tailoring meaningful policies and practices that embrace the daily labor realities of smallholder farming households.", "oa_url": "https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2026.1940600/pdf", "pdf_url": "https://www.frontiersin.org/journals/sustainable-food-system
